关。典型的结构非特异性药物只有在高浓度时才有活性。","ok":true,"kw":["结构非特异性药物","生物活性","特异性"]},{"id":"44ae9c3771","no":4,"q":"手性药物","a":"\u003cdiv class=\"q-ln\"\u003e是指药物分子结构中引入手性中心后得到的一对实物和镜像的对映异构体。对映异构体有着相同的物理性质和化学性质，但它们能使偏振光等量地向相反方向旋转。\u003c/div\u003e","pt":"是指药物分子结构中引入手性中心后得到的一对实物和镜像的对映异构体。对映异构体有着相同的物理性质和化学性质，但它们能使偏振光等量地向相反方向旋转。","ok":true,"kw":["对映异构体","异构体"]},{"id":"bec5704f4a","no":5,"q":"对映异构体","a":"\u003cdiv class=\"q-ln\"\u003e光学异构分子中存在手性中心，两个对映体互为实物和镜像，称为对映异构体。对映异构体有着相同的物理性质和化学性质，但它们能使偏振光等量地向相反方向旋转。\u003c/div\u003e","pt":"光学异构分子中存在手性中心，两个对映体互为实物和镜像，称为对映异构体。对映异构体有着相同的物理性质和化学性质，但它们能使偏振光等量地向相反方向旋转。","ok":true,"kw":["对映异构体","异构体"]},{"id":"17be279802","no":6,"q":"举例说明为什么不同的几何异构会影响药物活性?","a":"\u003cdiv class=\"q-ln\"\u003e药物分子中含有双键，或有刚性或半刚性的环状结构时，可产生几何异构体。几何异构体的理化性质和生物活性都有较大差异，如顺式己烯雌酚、反式己烯雌酚。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e在己烯雌酚的构效关系研究中，发现两个含氧官能团及氧原子间的距离对生物活性是必需的，而甾体母核对雌激素并非必需结构。人工合成的反式己烯雌酚中，两个羟基得到距离是1.45nm，这与雌二醇两个羟基的距离近似，表现出较强的生物活性。顺式己烯雌酚两个羟基间的距离为0.72nm，生物活性大大减弱。\u003c/div\u003e","pt":"药物分子中含有双键，或有刚性或半刚性的环状结构时，可产生几何异构体。几何异构体的理化性质和生物活性都有较大差异，如顺式己烯雌酚、反式己烯雌酚。 在己烯雌酚的构效关系研究中，发现两个含氧官能团及氧原子间的距离对生物活性是必需的，而甾体母核对雌激素并非必需结构。人工合成的反式己烯雌酚中，两个羟基得到距离是1.45nm，这与雌二醇两个羟基的距离近似，表现出较强的生物活性。顺式己烯雌酚两个羟基间的距离为0.72nm，生物活性大大减弱。","ok":true,"kw":["构效关系","生物活性","异构体"]},{"id":"0c13f1b9f0","no":7,"q":"先导化合物 (lead compound)","a":"\u003cdiv class=\"q-ln\"\u003e简称先导物，又称原型物 (prototype compound)，具有所期望的生物或药理活性，但会存在一些其他所不合适的性质，如较高毒性、较差的溶解度或药物代谢问题等。一般而言，先导化合物的发现是新药研究的起始点。\u003c/div\u003e","pt":"简称先导物，又称原型物 (prototype compound)，具有所期望的生物或药理活性，但会存在一些其他所不合适的性质，如较高毒性、较差的溶解度或药物代谢问题等。一般而言，先导化合物的发现是新药研究的起始点。","ok":true,"kw":["先导化合物的发现","先导化合物"]},{"id":"5f6297b614","no":8,"q":"先导化合物的发现","a":"\u003cdiv class=\"q-ln\"\u003e① 从天然产物中得到先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 以现有药物作为先导化合物: 1. 由药物副作用发现先导化合物；2.通过药物的代谢发现先导化合物；3.以现有突破性药物作为先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 用活性内源性物质作为先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 通过组合化学与高通量筛选得到先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 通过靶向虚拟筛选得到先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 利用人工智能快速发现先导化合物\u003c/div\u003e","pt":"① 从天然产物中得到先导化合物 ② 以现有药物作为先导化合物: 1. 由药物副作用发现先导化合物；2.通过药物的代谢发现先导化合物；3.以现有突破性药物作为先导化合物 ③ 用活性内源性物质作为先导化合物 ④ 通过组合化学与高通量筛选得到先导化合物 ⑤ 通过靶向虚拟筛选得到先导化合物 ⑥ 利用人工智能快速发现先导化合物","ok":true,"kw":["先导化合物","组合化学","副作用"]},{"id":"f4275f2866","no":9,"q":"\"me-too\"药物","a":"\u003cdiv class=\"q-ln\"\u003e是指化学结构与已有药物非常相似，但生物活性稍有差别的药物。有时可能得到比原突破性药物活性更好或有药代动力学特色药物。例如兰索拉唑就是以奥美拉唑为先导化合物经结构改造得到的，其活性比奥美拉唑更强。\u003c/div\u003e","pt":"是指化学结构与已有药物非常相似，但生物活性稍有差别的药物。有时可能得到比原突破性药物活性更好或有药代动力学特色药物。例如兰索拉唑就是以奥美拉唑为先导化合物经结构改造得到的，其活性比奥美拉唑更强。","ok":true,"kw":["奥美拉唑","先导化合物","生物活性","动力学"]},{"id":"3a3a74ee1d","no":10,"q":"合理药物设计 (rational drug design)","a":"\u003cdiv class=\"q-ln\"\u003e针对与生理活性有关的酶或受体来设计药物，称为合理药物设计。内源性的神经递质、酶或受体的底物就是初始的先导化合物。例如以炎症介质5-羟色胺为先导化合物研发了抗炎药吲哚美辛。\u003c/div\u003e","pt":"针对与生理活性有关的酶或受体来设计药物，称为合理药物设计。内源性的神经递质、酶或受体的底物就是初始的先导化合物。例如以炎症介质5-羟色胺为先导化合物研发了抗炎药吲哚美辛。","ok":true,"kw":["合理药物设计","先导化合物"]},{"id":"c08783c61b","no":11,"q":"组合化学 (combinatorial chemistry)","a":"\u003cdiv class=\"q-ln\"\u003e是将一些基本小分子，如氨基酸、核苷酸、单糖等通过化学或生物合成的手段装配成不同的组合，由此得到大量具有结构多样性的化合物分子，配合高通量筛选寻找先导化合物的一种新的合成技术与方法。\u003c/div\u003e","pt":"是将一些基本小分子，如氨基酸、核苷酸、单糖等通过化学或生物合成的手段装配成不同的组合，由此得到大量具有结构多样性的化合物分子，配合高通量筛选寻找先导化合物的一种新的合成技术与方法。","ok":true,"kw":["先导化合物","氨基酸"]},{"id":"21069a1a29","no":12,"q":"先导化合物的优化","a":"\u003cdiv class=\"q-ln\"\u003e① 生物电子等排替换\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 前药设计\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 软药设计\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 骨架跃迁策略药物设计\u003c/div\u003e","pt":"① 生物电子等排替换 ② 前药设计 ③ 软药设计 ④ 骨架跃迁策略药物设计","ok":true,"kw":["软药"]},{"id":"594aee42e6","no":13,"q":"生物电子等排体 (bioisosteres)","a":"\u003cdiv class=\"q-ln\"\u003e具有相似的分子形状和体积、相似的电荷分布，并由此表现出相似的物理性质（如疏水性），对同一靶标产生相似或拮抗的生物活性的分子或基团。\u003c/div\u003e","pt":"具有相似的分子形状和体积、相似的电荷分布，并由此表现出相似的物理性质（如疏水性），对同一靶标产生相似或拮抗的生物活性的分子或基团。","ok":true,"kw":["生物活性"]},{"id":"489cbcafae","no":14,"q":"前药设计的目的","a":"\u003cdiv class=\"q-ln\"\u003e① 提高生物利用度和生物膜通透性: 氨苄西林口服吸收较差，将其羧基酯化形成易被酶裂解的酯如匹氨西林，口服时几乎定量吸收，且给药剂量较氨苄西林低，安全有效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 提高药物的靶向性：将苯丁酸氮芥结合到修饰后的胆汁酸上使其具有肝靶向性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 延长药物的作用时间：雌二醇在体内代谢快，作用短暂，将其与长链脂肪酸酯化后得到如戊酸雌二醇，延长作用时间。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 改善药物的水溶性和稳定性：如将依托泊苷转变为依托泊苷磷酸酯，可在较短时间内以更高浓度在体内转运。\u003c/div\u003e","pt":"① 提高生物利用度和生物膜通透性: 氨苄西林口服吸收较差，将其羧基酯化形成易被酶裂解的酯如匹氨西林，口服时几乎定量吸收，且给药剂量较氨苄西林低，安全有效。 ② 提高药物的靶向性：将苯丁酸氮芥结合到修饰后的胆汁酸上使其具有肝靶向性。 ③ 延长药物的作用时间：雌二醇在体内代谢快，作用短暂，将其与长链脂肪酸酯化后得到如戊酸雌二醇，延长作用时间。 ④ 改善药物的水溶性和稳定性：如将依托泊苷转变为依托泊苷磷酸酯，可在较短时间内以更高浓度在体内转运。","ok":true,"kw":["水溶性","稳定性"]},{"id":"dd215331cb","no":15,"q":"药物潜伏化 (drug latentiation)","a":"\u003cdiv class=\"q-ln\"\u003e是通过对生物活性化合物的化学修饰形成新的化合物，该新化合物在体内酶的作用下释放出母体药物而发挥作用。\u003c/div\u003e","pt":"是通过对生物活性化合物的化学修饰形成新的化合物，该新化合物在体内酶的作用下释放出母体药物而发挥作用。","ok":true,"kw":["生物活性"]},{"id":"31ee9b5569","no":16,"q":"前体药物 (prodrug)","a":"\u003cdiv class=\"q-ln\"\u003e是指经生物转化后才显示药理作用的化合物。可分为载体前药和生物前体。载体前药 (carrier prodrug) 是指活性药物与载体部分连接构成的在体外无活性或活性较小，在体内经酶或其他生物转化释放出活性药物而发挥药效的化合物。生物前体 (bioprecursor) 是通过对有活性的化合物进行结构修饰得到的新化合物，该新化合物是代谢酶的底物，经过酶的代谢产生的活性代谢物是预期的活性分子。\u003c/div\u003e","pt":"是指经生物转化后才显示药理作用的化合物。可分为载体前药和生物前体。载体前药 (carrier prodrug) 是指活性药物与载体部分连接构成的在体外无活性或活性较小，在体内经酶或其他生物转化释放出活性药物而发挥药效的化合物。生物前体 (bioprecursor) 是通过对有活性的化合物进行结构修饰得到的新化合物，该新化合物是代谢酶的底物，经过酶的代谢产生的活性代谢物是预期的活性分子。","ok":true,"kw":[]},{"id":"ec651256bf","no":17,"q":"软药 (soft drug)","a":"\u003cdiv class=\"q-ln\"\u003e设计出容易代谢失活的药物，使药物在完成治疗作用后，按预先规定的代谢途径和可以控制的速率分解、失活并迅速排除体外，从而避免药物的蓄积毒性，这类药物被称为软药。\u003c/div\u003e","pt":"设计出容易代谢失活的药物，使药物在完成治疗作用后，按预先规定的代谢途径和可以控制的速率分解、失活并迅速排除体外，从而避免药物的蓄积毒性，这类药物被称为软药。","ok":true,"kw":["软药"]},{"id":"75d85f57cc","no":18,"q":"定量构效关系 (quantitative structure-activity relationship, QSAR)","a":"\u003cdiv class=\"q-ln\"\u003e是对药物分子的化学结构与其生物活性之间的关系进行定量分析，找出药物的化学结构与生物活性之间的量变规律，或得到构效关系的数学方程，为进一步的结构优化提供理论依据。\u003c/div\u003e","pt":"是对药物分子的化学结构与其生物活性之间的关系进行定量分析，找出药物的化学结构与生物活性之间的量变规律，或得到构效关系的数学方程，为进一步的结构优化提供理论依据。","ok":true,"kw":["构效关系","生物活性"]},{"id":"665b61beca","no":19,"q":"计算机辅助药物设计 (computer-aided drug design, CADD)","a":"\u003cdiv class=\"q-ln\"\u003e是利用计算机的快速计算功能、全方位的逻辑判断功能、一目了然的图形显示功能，将量子化学、分子力学、药物化学、生命科学、计算机图形学和信息科学等学科交叉融合，从药物分子的作用机制入手进行药物设计。\u003c/div\u003e","pt":"是利用计算机的快速计算功能、全方位的逻辑判断功能、一目了然的图形显示功能，将量子化学、分子力学、药物化学、生命科学、计算机图形学和信息科学等学科交叉融合，从药物分子的作用机制入手进行药物设计。","ok":true,"kw":["作用机制"]},{"id":"dd9f99b552","no":20,"q":"药效团 (pharmacophore)","a":"\u003cdiv class=\"q-ln\"\u003e对于一个药物分子，分子中的不同基团对活性的影响不同，有些基团改变对分子活性的影响甚小，而有一些则对药物分子与靶点的结合至关重要。这些药物活性分子中对活性起重要作用的“药效特征元素”及其空间排列形式即为药效团。\u003c/div\u003e","pt":"对于一个药物分子，分子中的不同基团对活性的影响不同，有些基团改变对分子活性的影响甚小，而有一些则对药物分子与靶点的结合至关重要。这些药物活性分子中对活性起重要作用的“药效特征元素”及其空间排列形式即为药效团。","ok":true,"kw":["药效团"]},{"id":"7a5e406271","no":21,"q":"构效关系 (structure-activity relationship, SAR)","a":"\u003cdiv class=\"q-ln\"\u003e在同一基本结构的系列药物中，药物结构变化引起药物活性变化的规律，称为该类药物的构效关系。其研究对揭示该类药物的作用机制、研究新药等有重要意义。\u003c/div\u003e","pt":"在同一基本结构的系列药物中，药物结构变化引起药物活性变化的规律，称为该类药物的构效关系。其研究对揭示该类药物的作用机制、研究新药等有重要意义。","ok":true,"kw":["构效关系","作用机制"]},{"id":"3b467b3071","no":22,"q":"药物代谢在药物研究中的作用。","a":"\u003cdiv class=\"q-ln\"\u003e一、设计和发现新药:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 寻找和发现新的先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 先导化合物的结构修饰\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 对新药研究的指导作用\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e二、优化药物的药动学性质:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 通过修饰缩短药物的作用时间\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 通过修饰延长药物的作用时间\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 通过修饰提高药物的生物利用度\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 指导设计适当的剂型\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e三、解释药物的作用机制\u003c/div\u003e","pt":"一、设计和发现新药: ① 寻找和发现新的先导化合物 ② 先导化合物的结构修饰 ③ 对新药研究的指导作用 二、优化药物的药动学性质: ① 通过修饰缩短药物的作用时间 ② 通过修饰延长药物的作用时间 ③ 通过修饰提高药物的生物利用度 ④ 指导设计适当的剂型 三、解释药物的作用机制","ok":true,"kw":["先导化合物","药动学","作用机制"]},{"id":"5ed7af3f00","no":23,"q":"第Ⅰ相生物转化","a":"\u003cdiv class=\"q-ln\"\u003e主要是官能团化反应，在酶的催化下对药物分子进行氧化、还原、水解等反应，在药物分子中引入或使药物分子暴露出极性基团，如羟基、羧基、巯基和氨基等。\u003c/div\u003e","pt":"主要是官能团化反应，在酶的催化下对药物分子进行氧化、还原、水解等反应，在药物分子中引入或使药物分子暴露出极性基团，如羟基、羧基、巯基和氨基等。","ok":true,"kw":[]},{"id":"5349868ce9","no":24,"q":"第Ⅱ相生物转化","a":"\u003cdiv class=\"q-ln\"\u003e又称为“结合反应”，是指药物中原有的或者经第Ⅱ相转化后产生的极性基团与体内内源性成分，如葡糖醛酸、硫酸、甘氨酸或谷胱甘肽，经共价键结合，生成极性大、易溶于水和易排出体外的结合物。\u003c/div\u003e","pt":"又称为“结合反应”，是指药物中原有的或者经第Ⅱ相转化后产生的极性基团与体内内源性成分，如葡糖醛酸、硫酸、甘氨酸或谷胱甘肽，经共价键结合，生成极性大、易溶于水和易排出体外的结合物。","ok":true,"kw":["谷胱甘肽"]}],"count":24,"done":24},{"label":"第三章","questions":[{"id":"5d31336019","no":1,"q":"巴比妥类药物的一般合成方法中，用卤烃取代丙二酸二乙酯的α-氢时，当两个取代基大小不同时，一般应先引入大基团，还是小基团？为什么？","a":"\u003cdiv class=\"q-ln\"\u003e当引入的两个烃基不同时，一般先引入较大的烃基到次甲基上。经分馏纯化后，再引入小基团。这是因为，当引入一个大基团后，因空间位阻较大，不易再接连上第二个基团，成为反应副产物。同时当引入一个大基团后，原料、一取代产物和二取代副产物的理化性质差异较大，也便于分离纯化。\u003c/div\u003e","pt":"当引入的两个烃基不同时，一般先引入较大的烃基到次甲基上。经分馏纯化后，再引入小基团。这是因为，当引入一个大基团后，因空间位阻较大，不易再接连上第二个基团，成为反应副产物。同时当引入一个大基团后，原料、一取代产物和二取代副产物的理化性质差异较大，也便于分离纯化。","ok":true,"kw":[]},{"id":"cef0b586b3","no":2,"q":"巴比妥类药物具有哪些共同的化学性质？","a":"\u003cdiv class=\"q-ln\"\u003e① 呈弱酸性，巴比妥类药物因能形成内酰胺醇-内酰胺互变异构，故呈弱酸性；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 水解性，巴比妥类药物因含环酰脲结构，其钠盐水溶液不够稳定，甚至在吸湿情况下也能水解；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 与银盐的反应，这类药物在碳酸钠的碱性溶液中与硝酸银溶液作用，先生成可溶性的一银盐，继而则生成不溶性的二银盐白色沉淀；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 与铜吡啶试液的反应，这类药物分子中含有一CONHCONHCO一结构，能与重金属形成不溶性的络合物，可供鉴别。\u003c/div\u003e","pt":"① 呈弱酸性，巴比妥类药物因能形成内酰胺醇-内酰胺互变异构，故呈弱酸性； ② 水解性，巴比妥类药物因含环酰脲结构，其钠盐水溶液不够稳定，甚至在吸湿情况下也能水解； ③ 与银盐的反应，这类药物在碳酸钠的碱性溶液中与硝酸银溶液作用，先生成可溶性的一银盐，继而则生成不溶性的二银盐白色沉淀； ④ 与铜吡啶试液的反应，这类药物分子中含有一CONHCONHCO一结构，能与重金属形成不溶性的络合物，可供鉴别。","ok":true,"kw":["巴比妥","水溶液"]},{"id":"854b68953a","no":3,"q":"为什么巴比妥C5位次甲基上的两个氢原子必须全被取代，才有镇静催眠作用？","a":"\u003cdiv class=\"q-ln\"\u003e未解离的巴比妥类药物分子较其离子易于透过细胞膜而发挥作用。巴比妥酸和一取代巴比妥酸的 pKa 值较小，酸性较强，在生理 pH 时几乎全部解离，均无疗效。如 5 位上引入两个基团，生成的 5,5 位双取代物则酸性大大降低，在生理 pH 时未解离药物分子的比例较大。这些分子态药物能透过血-脑脊液屏障，进入中枢神经系统而发挥作用。\u003c/div\u003e","pt":"未解离的巴比妥类药物分子较其离子易于透过细胞膜而发挥作用。巴比妥酸和一取代巴比妥酸的 pKa 值较小，酸性较强，在生理 pH 时几乎全部解离，均无疗效。如 5 位上引入两个基团，生成的 5,5 位双取代物则酸性大大降低，在生理 pH 时未解离药物分子的比例较大。这些分子态药物能透过血-脑脊液屏障，进入中枢神经系统而发挥作用。","ok":true,"kw":["中枢神经系统","巴比妥","细胞膜"]},{"id":"2be8f0cb8c","no":4,"q":"合成类镇痛药按结构可以分成几类？这些药物的化学结构类型不同，但为什么都具有类似吗啡的作用？","a":"\u003cdiv class=\"q-ln\"\u003e按结构可分为：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 吗啡喃类: 左啡诺\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 苯并吗喃类: 喷他佐辛\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 哌啶类: 哌替啶、芬太尼\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 氨基酮类: 美沙酮\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 其他类: 曲马多\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e它们化学结构类型不同但均具有类似吗啡的作用，是因为它们都含有以下共同的结构特征:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 有一个平坦的芳环结构；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 有一个叔氮原子碱性中心，且在生理pH条件下大部分电离成阳离子，碱性中心应和平坦结构在同一平面上。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 含有哌啶或类似哌啶的空间结构，哌啶或类似哌啶的烃基部分应该突出于芳环构成的平面上方。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e这些共同的结构特征使得它们都能作用于阿片受体发挥类似吗啡的作用。\u003c/div\u003e","pt":"按结构可分为： ① 吗啡喃类: 左啡诺 ② 苯并吗喃类: 喷他佐辛 ③ 哌啶类: 哌替啶、芬太尼 ④ 氨基酮类: 美沙酮 ⑤ 其他类: 曲马多 它们化学结构类型不同但均具有类似吗啡的作用，是因为它们都含有以下共同的结构特征: ① 有一个平坦的芳环结构； ② 有一个叔氮原子碱性中心，且在生理pH条件下大部分电离成阳离子，碱性中心应和平坦结构在同一平面上。 ③ 含有哌啶或类似哌啶的空间结构，哌啶或类似哌啶的烃基部分应该突出于芳环构成的平面上方。 这些共同的结构特征使得它们都能作用于阿片受体发挥类似吗啡的作用。","ok":true,"kw":[]},{"id":"eec773151a","no":5,"q":"试分析酒石酸唑吡坦上市后使用人群迅速增大的原因。","a":"\u003cdiv class=\"q-ln\"\u003e镇静催眠药在上个世纪 60 年代前主要使用巴比妥类药物，因其有成瘾性、耐受性和蓄积中毒。在 60 年代苯并氮䓬类药物问世后，使用开始减少。苯并氮䓬类药物比巴比妥类的选择性高、安全范围大，对呼吸抑制小，在 60 年代后西泮类药物逐渐占主导。唑吡坦的作用类似苯二氮䓬，但可选择性地与苯二氮䓬 ω1 型受体结合，有强镇静作用，没有肌肉松弛和抗惊厥作用，不会引起反弹和戒断综合症，被滥用的可能性比苯二氮䓬小，故问世后使用人群迅速增大。\u003c/div\u003e","pt":"镇静催眠药在上个世纪 60 年代前主要使用巴比妥类药物，因其有成瘾性、耐受性和蓄积中毒。在 60 年代苯并氮䓬类药物问世后，使用开始减少。苯并氮䓬类药物比巴比妥类的选择性高、安全范围大，对呼吸抑制小，在 60 年代后西泮类药物逐渐占主导。唑吡坦的作用类似苯二氮䓬，但可选择性地与苯二氮䓬 ω1 型受体结合，有强镇静作用，没有肌肉松弛和抗惊厥作用，不会引起反弹和戒断综合症，被滥用的可能性比苯二氮䓬小，故问世后使用人群迅速增大。","ok":true,"kw":["巴比妥","选择性"]},{"id":"0929183dc1","no":6,"q":"请叙述卤加比作为前药的意义。","a":"\u003cdiv class=\"q-ln\"\u003e卤加比在体内转化成 γ-氨基丁酰胺，是 GABA 受体的激动剂，对癫痫、痉挛状态和运动失调有良好的治疗效果。由于 γ-氨基丁酰胺的极性太大，如直接使用，因不能透过血脑屏障进入中枢，即不能达到作用部位，起到药物的作用。为此作成希夫氏碱的前药，使极性减小，可以进入血脑屏障，转化后起作用。\u003c/div\u003e","pt":"卤加比在体内转化成 γ-氨基丁酰胺，是 GABA 受体的激动剂，对癫痫、痉挛状态和运动失调有良好的治疗效果。由于 γ-氨基丁酰胺的极性太大，如直接使用，因不能透过血脑屏障进入中枢，即不能达到作用部位，起到药物的作用。为此作成希夫氏碱的前药，使极性减小，可以进入血脑屏障，转化后起作用。","ok":true,"kw":["治疗效果"]},{"id":"d265fdb298","no":7,"q":"试分析选择性的5-HT再摄取抑制剂类药物并无相似结构的原因。","a":"\u003cdiv class=\"q-ln\"\u003e一般和特定的受体结合（受体激动剂或拮抗剂），或与酶结合（酶抑制剂）的药物，因需与受体和酶在空间上适应，在电性效应上互补，同类药物大都有一些相同的结构，一般称为药效团（pharmacophore）。但重摄取抑制剂不需与受体或酶结合，有多个作用环节的可能：如阻碍吸收的路径，或与 5-羟色胺复合，影响吸收……。这在药物结构上无特异性的要求。故该类药物无相似的结构。\u003c/div\u003e","pt":"一般和特定的受体结合（受体激动剂或拮抗剂），或与酶结合（酶抑制剂）的药物，因需与受体和酶在空间上适应，在电性效应上互补，同类药物大都有一些相同的结构，一般称为药效团（pharmacophore）。但重摄取抑制剂不需与受体或酶结合，有多个作用环节的可能：如阻碍吸收的路径，或与 5-羟色胺复合，影响吸收……。这在药物结构上无特异性的要求。故该类药物无相似的结构。","ok":true,"kw":["药效团","特异性","拮抗剂"]},{"id":"8b917102ef","no":8,"q":"巴比妥类药物的构效关系","a":"","pt":"","ok":false,"kw":[]},{"id":"c00b861fd9","no":9,"q":"苯二氮䓬类构效关系","a":"","pt":"","ok":false,"kw":[]},{"id":"24e7fcce25","no":10,"q":"吗啡类药物的构效关系","a":"","pt":"","ok":false,"kw":[]},{"id":"97a5979edc","no":11,"q":"为什么说吩噻嗪类抗精神病药物中2位氯的取代对活性至关重要。","a":"","pt":"","ok":false,"kw":[]},{"id":"3f39671128","no":12,"q":"噻吨类","a":"\u003cdiv class=\"q-ln\"\u003e为抗精神失常药的一种，其基本结构与吩噻嗪类相似，根据生物电子等排原理，将吩噻嗪母核中的10位N替换成-C-，并用双键连接侧链碱性基团仍具有抗精神失常活性，得到噻吨类抗精神病药，又称为硫杂蒽类抗精神病药，其许多化合物的侧链结构都与吩噻嗪药物相同。\u003c/div\u003e","pt":"为抗精神失常药的一种，其基本结构与吩噻嗪类相似，根据生物电子等排原理，将吩噻嗪母核中的10位N替换成-C-，并用双键连接侧链碱性基团仍具有抗精神失常活性，得到噻吨类抗精神病药，又称为硫杂蒽类抗精神病药，其许多化合物的侧链结构都与吩噻嗪药物相同。","ok":true,"kw":["噻吨类"]},{"id":"e4fd8017ab","no":13,"q":"抗抑郁药的分类及代表药","a":"\u003cdiv class=\"q-ln\"\u003e① 三环类抗抑郁药: 丙米嗪\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 选择性5-HT再摄取抑制药: 氟西汀、舍曲林\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 5-HT与NE再摄取抑制药: 文拉法辛\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ NE再摄取抑制药: 安非他酮\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 单胺受体拮抗药: 米氮平\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 单胺氧化酶抑制药: 吗氯贝胺\u003c/div\u003e","pt":"① 三环类抗抑郁药: 丙米嗪 ② 选择性5-HT再摄取抑制药: 氟西汀、舍曲林 ③ 5-HT与NE再摄取抑制药: 文拉法辛 ④ NE再摄取抑制药: 安非他酮 ⑤ 单胺受体拮抗药: 米氮平 ⑥ 单胺氧化酶抑制药: 吗氯贝胺","ok":true,"kw":["受体拮抗药","选择性"]}],"count":13,"done":9},{"label":"第四章","questions":[{"id":"92d6ef76e0","no":1,"q":"拟胆碱药(cholinergic drugs)","a":"","pt":"","ok":false,"kw":[]},{"id":"39eab5e963","no":2,"q":"抗胆碱药(anticholinergic drugs)","a":"","pt":"","ok":false,"kw":[]},{"id":"f1345332f3","no":3,"q":"合成M受体激动剂和拮抗剂的化学结构有哪些异同点？","a":"\u003cdiv class=\"q-ln\"\u003e相同点：①合成M胆碱受体激动剂与大部分合成M胆碱受体拮抗剂都具有与乙酰胆碱相似的氨基部分和酯基部分；②这两部分相隔2个碳的长度为最好。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e不同点：①在这个乙基桥上，激动剂可有甲基取代，拮抗剂通常无取代；②酯基的酰基部分，激动剂应为较小的乙酰基或氨甲酰基，而拮抗剂则为较大的碳环、芳环或杂环；③氨基部分，激动剂为季铵离子，拮抗剂可为季铵离子或叔胺；④大部分合成M胆碱受体拮抗剂的酯基的酰基α-碳上带有羟基，激动剂没有；⑤一部分合成M胆碱受体拮抗剂的酯键可被—O—代替或去掉，激动剂不行。总之，合成M胆碱受体激动剂的结构专属性要大大高于拮抗剂。\u003c/div\u003e","pt":"相同点：①合成M胆碱受体激动剂与大部分合成M胆碱受体拮抗剂都具有与乙酰胆碱相似的氨基部分和酯基部分；②这两部分相隔2个碳的长度为最好。 不同点：①在这个乙基桥上，激动剂可有甲基取代，拮抗剂通常无取代；②酯基的酰基部分，激动剂应为较小的乙酰基或氨甲酰基，而拮抗剂则为较大的碳环、芳环或杂环；③氨基部分，激动剂为季铵离子，拮抗剂可为季铵离子或叔胺；④大部分合成M胆碱受体拮抗剂的酯基的酰基α-碳上带有羟基，激动剂没有；⑤一部分合成M胆碱受体拮抗剂的酯键可被—O—代替或去掉，激动剂不行。总之，合成M胆碱受体激动剂的结构专属性要大大高于拮抗剂。","ok":true,"kw":["乙酰胆碱","胆碱受体","拮抗剂"]},{"id":"12739edc93","no":4,"q":"苯乙醇胺类拟肾上腺素受体激动剂的β-碳是手性碳原子，其R构型异构体的活性大大高于S构型体，试解释之。","a":"\u003cdiv class=\"q-ln\"\u003e苯乙醇胺类与肾上腺素受体相互结合时，通过其分子中的氨基、苯环及其上酚羟基、β-羟基三个部分与受体发生三点结合。这三个部分的空间相对位置能否与受体匹配，对药物作用强度影响很大。只有β-碳是R构型的异构体可满足受体的空间要求，实现上述三点结合，而其S构型异构体因其β-羟基的位置发生改变，与受体只能有两点结合，即氨基、苯环及其上酚羟基，因而对受体的激动作用较弱。\u003c/div\u003e","pt":"苯乙醇胺类与肾上腺素受体相互结合时，通过其分子中的氨基、苯环及其上酚羟基、β-羟基三个部分与受体发生三点结合。这三个部分的空间相对位置能否与受体匹配，对药物作用强度影响很大。只有β-碳是R构型的异构体可满足受体的空间要求，实现上述三点结合，而其S构型异构体因其β-羟基的位置发生改变，与受体只能有两点结合，即氨基、苯环及其上酚羟基，因而对受体的激动作用较弱。","ok":true,"kw":["肾上腺素","异构体"]},{"id":"d1e3bed04f","no":5,"q":"经典H1受体拮抗剂有何突出的不良反应？为什么？第二代H1受体拮抗剂如何克服这一缺点？","a":"\u003cdiv class=\"q-ln\"\u003e经典H₁受体拮抗剂最突出的毒副作用是中枢抑制作用，可引起明显的镇静、嗜睡。产生这种作用的机制尚不十分清楚，有人认为这些药物易通过血-脑脊液屏障，并与脑内H₁受体有高度亲和力，由此拮抗脑内的内源性组胺引起的觉醒反应而致中枢抑制。第二代H₁受体拮抗剂通过限制药物进入中枢和提高药物对外周H₁受体的选择性来发展新型非镇静性抗组胺药。如 acrivastine 和 cetirizine 就是通过引入极性或易电离基团使药物难以通过血-脑脊液屏障进入中枢，克服镇静作用的。而 mizolastine、clemastine 和 loratadine 则是对外周H₁受体有较高的选择性，避免中枢副作用。\u003c/div\u003e","pt":"经典H₁受体拮抗剂最突出的毒副作用是中枢抑制作用，可引起明显的镇静、嗜睡。产生这种作用的机制尚不十分清楚，有人认为这些药物易通过血-脑脊液屏障，并与脑内H₁受体有高度亲和力，由此拮抗脑内的内源性组胺引起的觉醒反应而致中枢抑制。第二代H₁受体拮抗剂通过限制药物进入中枢和提高药物对外周H₁受体的选择性来发展新型非镇静性抗组胺药。如 acrivastine 和 cetirizine 就是通过引入极性或易电离基团使药物难以通过血-脑脊液屏障进入中枢，克服镇静作用的。而 mizolastine、clemastine 和 loratadine 则是对外周H₁受体有较高的选择性，避免中枢副作用。","ok":true,"kw":["拮抗剂","副作用","选择性"]},{"id":"af7dc3c3bd","no":6,"q":"从 procaine 的结构分析其化学稳定性，说明配制注射液时的注意事项及药典规定杂质检查的原因。","a":"\u003cdiv class=\"q-ln\"\u003eProcaine 的化学稳定性较低，原因有二：其一，结构中含有酯基，易被水解失活，酸、碱和体内酯酶均能促使其水解，温度升高也加速水解；其二，结构中含有芳伯氨基，易被氧化变色，pH 及温度升高、紫外线、氧、重金属离子等均可加速氧化。所以注射剂制备中要控制最稳定的 pH 范围 3.5~5.0，低温灭菌(100℃，30min)，通入惰性气体，加入抗氧剂及金属离子掩蔽剂等稳定剂。Procaine 水解生成对氨基苯甲酸和二乙氨基乙醇，所以中国药典规定要检查对氨基苯甲酸的含量。\u003c/div\u003e","pt":"Procaine 的化学稳定性较低，原因有二：其一，结构中含有酯基，易被水解失活，酸、碱和体内酯酶均能促使其水解，温度升高也加速水解；其二，结构中含有芳伯氨基，易被氧化变色，pH 及温度升高、紫外线、氧、重金属离子等均可加速氧化。所以注射剂制备中要控制最稳定的 pH 范围 3.5~5.0，低温灭菌(100℃，30min)，通入惰性气体，加入抗氧剂及金属离子掩蔽剂等稳定剂。Procaine 水解生成对氨基苯甲酸和二乙氨基乙醇，所以中国药典规定要检查对氨基苯甲酸的含量。","ok":true,"kw":["金属离子","注射剂","稳定性"]},{"id":"f79cca08ff","no":7,"q":"肾上腺素类药物相比，麻黄碱的特点。","a":"\u003cdiv class=\"q-ln\"\u003e① 一是苯环上不带有酚羟基。苯环上酚羟基的存在一般使作用增强，尤以3, 4-二羟基化合物的活性最强。但具有此而儿茶酚结构的化合物极易被COMT代谢失活，不宜口服。麻黄碱没有酚羟基，不受COMT的影响，虽作用强度较肾上腺素低，但作用时间比肾上腺素长，且可口服。苯环上没有酚羟基也使得化合物极性大为降低，易通过血脑屏障进入中枢神经系统，所以麻黄碱具有较强的中枢兴奋作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 二是氨基的α-碳上带有一个甲基。因甲基的空间位阻，使麻黄碱不易被MAO代谢脱胺，稳定性增加，作用时间延长。但α-碳上烷基亦使活性降低，中枢毒性增大。若甲基换以更大的取代基，则活性更弱，毒性更大。\u003c/div\u003e","pt":"① 一是苯环上不带有酚羟基。苯环上酚羟基的存在一般使作用增强，尤以3, 4-二羟基化合物的活性最强。但具有此而儿茶酚结构的化合物极易被COMT代谢失活，不宜口服。麻黄碱没有酚羟基，不受COMT的影响，虽作用强度较肾上腺素低，但作用时间比肾上腺素长，且可口服。苯环上没有酚羟基也使得化合物极性大为降低，易通过血脑屏障进入中枢神经系统，所以麻黄碱具有较强的中枢兴奋作用。 ② 二是氨基的α-碳上带有一个甲基。因甲基的空间位阻，使麻黄碱不易被MAO代谢脱胺，稳定性增加，作用时间延长。但α-碳上烷基亦使活性降低，中枢毒性增大。若甲基换以更大的取代基，则活性更弱，毒性更大。","ok":true,"kw":["中枢神经系统","肾上腺素","稳定性"]},{"id":"7a13c307ab","no":8,"q":"氨贝胆碱如何设计而来？","a":"\u003cdiv class=\"q-ln\"\u003e乙酰胆碱作用短暂和不稳定是由于其结构中的酯基的快速水解。氨甲酰基由于氮上孤对电子的参与，使得羰基碳的亲电性较乙酰基低，因而不易被化学和酶促反应水解。将乙酰胆碱结构中的乙酰基用氨甲酰基替代，得到卡巴胆碱，可以口服，作用强而较持久，但兼具M样和N样作用。在卡巴胆碱的亚乙基桥的酯基一侧引入甲基，得到氯贝胆碱，对M受体具有选择性，并且可以口服给药。\u003c/div\u003e","pt":"乙酰胆碱作用短暂和不稳定是由于其结构中的酯基的快速水解。氨甲酰基由于氮上孤对电子的参与，使得羰基碳的亲电性较乙酰基低，因而不易被化学和酶促反应水解。将乙酰胆碱结构中的乙酰基用氨甲酰基替代，得到卡巴胆碱，可以口服，作用强而较持久，但兼具M样和N样作用。在卡巴胆碱的亚乙基桥的酯基一侧引入甲基，得到氯贝胆碱，对M受体具有选择性，并且可以口服给药。","ok":true,"kw":["乙酰胆碱","选择性"]},{"id":"23c7c05a53","no":9,"q":"如何从天然生物碱类的结构出发，设计得到四氢异喹啉类神经肌肉阻滞药？","a":"","pt":"","ok":false,"kw":[]},{"id":"d3ceafbcbc","no":10,"q":"局麻药的分类","a":"\u003cdiv class=\"q-ln\"\u003e① 苯甲酸酯类: 普鲁卡因\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 酰胺类: 利多卡因\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 氨基酮类: 达克罗宁\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 氨基醚类: 普莫卡因\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 氨基甲酸酯类: 地哌冬\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 脒类: 非那卡因\u003c/div\u003e","pt":"① 苯甲酸酯类: 普鲁卡因 ② 酰胺类: 利多卡因 ③ 氨基酮类: 达克罗宁 ④ 氨基醚类: 普莫卡因 ⑤ 氨基甲酸酯类: 地哌冬 ⑥ 脒类: 非那卡因","ok":true,"kw":[]}],"count":10,"done":7},{"label":"第五章","questions":[{"id":"b957a756df","no":1,"q":"离子通道(ion channel)","a":"\u003cdiv class=\"q-ln\"\u003e（离子通道是一类跨膜蛋白，在受一定刺激时（电压、机械、配体），能有选择性地让某种离子通过膜，而顺其电化学梯度进行被动转运，或通过消耗ATP逆浓度梯度主动转运，从而产生和传导电信号，参与调节人体多种生理功能。）（自拟答案，可能不准确）\u003c/div\u003e","pt":"（离子通道是一类跨膜蛋白，在受一定刺激时（电压、机械、配体），能有选择性地让某种离子通过膜，而顺其电化学梯度进行被动转运，或通过消耗ATP逆浓度梯度主动转运，从而产生和传导电信号，参与调节人体多种生理功能。）（自拟答案，可能不准确）","ok":true,"kw":["离子通道","选择性"]},{"id":"ec29f16f2c","no":2,"q":"NO 供体药物(NO donor drug)","a":"\u003cdiv class=\"q-ln\"\u003e能在体内释放外源性NO分子的药物。NO是一种内皮舒张因子，且是一种活性很强的气体小分子，能有效地扩张血管、降低血压。NO供体药物是临床上治疗心绞痛的主要药物。\u003c/div\u003e","pt":"能在体内释放外源性NO分子的药物。NO是一种内皮舒张因子，且是一种活性很强的气体小分子，能有效地扩张血管、降低血压。NO供体药物是临床上治疗心绞痛的主要药物。","ok":true,"kw":["心绞痛"]},{"id":"bf0648a552","no":3,"q":"以普萘洛尔为例分析芳氧丙醇胺类β受体拮抗剂的结构特点及构效关系。","a":"","pt":"","ok":false,"kw":[]},{"id":"825f853a1e","no":4,"q":"简述钙通道阻滞剂的概念及其分类。","a":"\u003cdiv class=\"q-ln\"\u003e钙通道阻滞药: 是在细胞膜生物通道水平上选择性地阻滞Ca\u003csup\u003e2+\u003c/sup\u003e经细胞膜上的钙通道进入细胞内，减少细胞内Ca\u003csup\u003e2+\u003c/sup\u003e浓度的药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 1, 4-二氢吡啶类: 硝苯地平\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 苯并硫氮䓬类: 盐酸地尔硫䓬\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 苯烷基胺类: 盐酸维拉帕米\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 二苯基哌嗪类: 氟桂利嗪\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 二苯基丙胺类: 普尼拉明\u003c/div\u003e","pt":"钙通道阻滞药: 是在细胞膜生物通道水平上选择性地阻滞Ca 2+ 经细胞膜上的钙通道进入细胞内，减少细胞内Ca 2+ 浓度的药物。 ① 1, 4-二氢吡啶类: 硝苯地平 ② 苯并硫氮䓬类: 盐酸地尔硫䓬 ③ 苯烷基胺类: 盐酸维拉帕米 ④ 二苯基哌嗪类: 氟桂利嗪 ⑤ 二苯基丙胺类: 普尼拉明","ok":true,"kw":["钙通道阻滞药","细胞膜","选择性"]},{"id":"eb2be7175b","no":5,"q":"以卡托普利为例，简要说明 ACEI 类抗高血压药的作用机制及为克服的缺点对其进行结构改造的方法。","a":"","pt":"","ok":false,"kw":[]},{"id":"080385b9a2","no":6,"q":"简述 NO donor drug 扩血管的作用机制。","a":"\u003cdiv class=\"q-ln\"\u003eNO供体药物如硝酸甘油进入血管平滑肌细胞后，经代谢释放出NO，NO与可溶性GC中的血红蛋白Fe\u003csup\u003e2+\u003c/sup\u003e结合，激活GC，催化GTP转化成cGMP，cGMP激活cGMP依赖蛋白激酶，从而抑制胞外Ca\u003csup\u003e2+\u003c/sup\u003e内流，以及胞内Ca\u003csup\u003e2+\u003c/sup\u003e释放，使得胞内游离Ca\u003csup\u003e2+\u003c/sup\u003e浓度减小，从而使肌球蛋白轻链去磷酸化，导致血管平滑肌舒张，扩张血管。\u003c/div\u003e","pt":"NO供体药物如硝酸甘油进入血管平滑肌细胞后，经代谢释放出NO，NO与可溶性GC中的血红蛋白Fe 2+ 结合，激活GC，催化GTP转化成cGMP，cGMP激活cGMP依赖蛋白激酶，从而抑制胞外Ca 2+ 内流，以及胞内Ca 2+ 释放，使得胞内游离Ca 2+ 浓度减小，从而使肌球蛋白轻链去磷酸化，导致血管平滑肌舒张，扩张血管。","ok":true,"kw":["血管平滑肌","GMP"]},{"id":"23cd6a92bd","no":7,"q":"洛伐他汀为何称为前药？说明其代谢物的结构特点。","a":"\u003cdiv class=\"q-ln\"\u003e洛伐他汀为前药，只有在体内将内酯环水解成开链的β-羟基酸衍生物后才能抑制HMG-CoA还原酶活性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e因为该开链的β-羟基酸结构部分，恰好与HMG-CoA还原酶的底物HMG-CoA的戊二酰部分相似，HMG-CoA还原酶与其结合后失去催化活性，抑制胆固醇的合成，从而有效降低血浆中的胆固醇。\u003c/div\u003e","pt":"洛伐他汀为前药，只有在体内将内酯环水解成开链的β-羟基酸衍生物后才能抑制HMG-CoA还原酶活性。 因为该开链的β-羟基酸结构部分，恰好与HMG-CoA还原酶的底物HMG-CoA的戊二酰部分相似，HMG-CoA还原酶与其结合后失去催化活性，抑制胆固醇的合成，从而有效降低血浆中的胆固醇。","ok":true,"kw":["胆固醇"]},{"id":"ef91fa86d4","no":8,"q":"根据高脂血症的定义，简述调血脂药物的分类，并说明每类药物的作用、机制","a":"\u003cdiv class=\"q-ln\"\u003e血脂是指血浆或血清中的脂质，包括胆固醇、胆固醇酯、甘油三酯、磷脂以及它们与载脂蛋白形成的各种可溶性的脂蛋白。血浆中的脂蛋白有乳糜微粒、极低密度脂蛋白、低密度脂蛋白和高密度脂蛋白。人体高脂血症主要是极低密度脂蛋白和低密度脂蛋白增多，临床上血浆胆固醇高于230mg/100ml和甘油三酯高于140mg/100ml统称为高血脂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e目前临床上使用的调血脂药物，一方面是通过减少极低密度脂蛋白和低密度脂蛋白，来调节高血脂；另一方面通过影响胆固醇和甘油三酯的代谢，来治疗高血脂。按照治疗效果分为羟甲戊二酰辅酶A还原酶抑制剂和影响胆固醇和甘油三酯代谢的药物。其中前者是通过抑制羟甲戊二酰辅酶A还原酶，使胆固醇合成受阻，并能减少极低密度脂蛋白和低密度脂蛋白，提高高密度脂蛋白水平。后者通过促进胆固醇和甘油三酯代谢，使其转化为其他物质。\u003c/div\u003e","pt":"血脂是指血浆或血清中的脂质，包括胆固醇、胆固醇酯、甘油三酯、磷脂以及它们与载脂蛋白形成的各种可溶性的脂蛋白。血浆中的脂蛋白有乳糜微粒、极低密度脂蛋白、低密度脂蛋白和高密度脂蛋白。人体高脂血症主要是极低密度脂蛋白和低密度脂蛋白增多，临床上血浆胆固醇高于230mg/100ml和甘油三酯高于140mg/100ml统称为高血脂。 目前临床上使用的调血脂药物，一方面是通过减少极低密度脂蛋白和低密度脂蛋白，来调节高血脂；另一方面通过影响胆固醇和甘油三酯的代谢，来治疗高血脂。按照治疗效果分为羟甲戊二酰辅酶A还原酶抑制剂和影响胆固醇和甘油三酯代谢的药物。其中前者是通过抑制羟甲戊二酰辅酶A还原酶，使胆固醇合成受阻，并能减少极低密度脂蛋白和低密度脂蛋白，提高高密度脂蛋白水平。后者通过促进胆固醇和甘油三酯代谢，使其转化为其他物质。","ok":true,"kw":["治疗效果","胆固醇"]}],"count":8,"done":6},{"label":"第六章","questions":[{"id":"41a2c50231","no":1,"q":"质子泵抑制剂(proton pump inhibitors)","a":"\u003cdiv class=\"q-ln\"\u003e即H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶抑制剂，抑制H\u003csup\u003e+\u003c/sup\u003e与K\u003csup\u003e+\u003c/sup\u003e的交换，从而阻止胃酸形成。作用于胃壁细胞泌酸的最后一个环节，对各种刺激引起的胃酸分泌都有较好的抑制作用。另一方面，H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶仅存在于胃壁细胞膜表面，而H\u003csub\u003e2\u003c/sub\u003e受体不仅存在于胃壁细胞，而且存在于其他组织中。因此，与H\u003csub\u003e2\u003c/sub\u003e受体拮抗剂相比，质子泵抑制剂具有作用专一、选择性高、副作用较小等优点。\u003c/div\u003e","pt":"即H + , K + ATP酶抑制剂，抑制H + 与K + 的交换，从而阻止胃酸形成。作用于胃壁细胞泌酸的最后一个环节，对各种刺激引起的胃酸分泌都有较好的抑制作用。另一方面，H + , K + ATP酶仅存在于胃壁细胞膜表面，而H 2 受体不仅存在于胃壁细胞，而且存在于其他组织中。因此，与H 2 受体拮抗剂相比，质子泵抑制剂具有作用专一、选择性高、副作用较小等优点。","ok":true,"kw":["质子泵抑制剂","细胞膜","拮抗剂","副作用","选择性"]},{"id":"cd6100499f","no":2,"q":"为什么质子泵抑制剂抑制胃酸分泌的作用强，选择性好？","a":"\u003cdiv class=\"q-ln\"\u003e① 质子泵抑制剂作用于胃壁细胞泌酸的最后一个环节，对各种刺激引起的胃酸分泌都有较好的抑制作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 另一方面，H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶仅存在于胃壁细胞膜表面，而H\u003csub\u003e2\u003c/sub\u003e受体不仅存在于胃壁细胞，而且存在于其他组织中。因此，与H\u003csub\u003e2\u003c/sub\u003e受体拮抗剂相比，质子泵抑制剂具有作用专一、选择性高、副作用较小等优点。\u003c/div\u003e","pt":"① 质子泵抑制剂作用于胃壁细胞泌酸的最后一个环节，对各种刺激引起的胃酸分泌都有较好的抑制作用。 ② 另一方面，H + , K + ATP酶仅存在于胃壁细胞膜表面，而H 2 受体不仅存在于胃壁细胞，而且存在于其他组织中。因此，与H 2 受体拮抗剂相比，质子泵抑制剂具有作用专一、选择性高、副作用较小等优点。","ok":true,"kw":["质子泵抑制剂","细胞膜","拮抗剂","副作用","选择性"]},{"id":"5394d60e80","no":3,"q":"试解释，奥美拉唑的活性形式并无光学活性，为什么艾司奥美拉唑的使用效果较奥美拉唑好。","a":"\u003cdiv class=\"q-ln\"\u003e奥美拉唑因亚砜上的硫具有手性而具有光学活性，但药用为其外消旋体，故无光学活性。其S(-)型异构体称为艾司奥美拉唑，因体内清除率大大低于R(+)型异构体，生物利用度较高，作用时间更长。同时，由于S型异构体受肝中代谢酶的影响较小，故个体差异也较小。现以单独成药用于临床。\u003c/div\u003e","pt":"奥美拉唑因亚砜上的硫具有手性而具有光学活性，但药用为其外消旋体，故无光学活性。其S(-)型异构体称为艾司奥美拉唑，因体内清除率大大低于R(+)型异构体，生物利用度较高，作用时间更长。同时，由于S型异构体受肝中代谢酶的影响较小，故个体差异也较小。现以单独成药用于临床。","ok":true,"kw":["奥美拉唑","异构体"]},{"id":"653b2fb7c0","no":4,"q":"为什么奥美拉唑是前药？","a":"\u003cdiv class=\"q-ln\"\u003e奥美拉唑为生物前体型前药，在体外无活性，在体内经生物转化后发挥作用。奥美拉唑具有弱碱性，口服后在十二指肠吸收，可选择性的聚集于胃壁细胞的酸性环境中，在氢离子的影响下，转换成活性形式。首先经smiles重排转换成螺环中间体，很快形成两种活性形式次磺酸和次磺酰胺。活性转化物与H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶上的4~6跨膜区的Cys813和7~8跨膜区的Cys892的巯基通过二硫键共价结合，形成酶-抑制剂复合物。次磺酸和次磺酰胺极性大，不易被吸收进入血液循环，有利于其在胃壁细胞聚集发挥作用，是奥美拉唑的理想活性形式。形成的酶-抑制剂复合物在酸性条件下稳定，虽可被谷胱甘肽和半胱氨酸等内源性巯基化合物竞争而复活，但胃壁细胞的酸性环境中谷胱甘肽极少，故奥美拉唑对H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶表现出持久、不可逆的抑制作用。\u003c/div\u003e","pt":"奥美拉唑为生物前体型前药，在体外无活性，在体内经生物转化后发挥作用。奥美拉唑具有弱碱性，口服后在十二指肠吸收，可选择性的聚集于胃壁细胞的酸性环境中，在氢离子的影响下，转换成活性形式。首先经smiles重排转换成螺环中间体，很快形成两种活性形式次磺酸和次磺酰胺。活性转化物与H + , K + ATP酶上的4~6跨膜区的Cys813和7~8跨膜区的Cys892的巯基通过二硫键共价结合，形成酶-抑制剂复合物。次磺酸和次磺酰胺极性大，不易被吸收进入血液循环，有利于其在胃壁细胞聚集发挥作用，是奥美拉唑的理想活性形式。形成的酶-抑制剂复合物在酸性条件下稳定，虽可被谷胱甘肽和半胱氨酸等内源性巯基化合物竞争而复活，但胃壁细胞的酸性环境中谷胱甘肽极少，故奥美拉唑对H + , K + ATP酶表现出持久、不可逆的抑制作用。","ok":true,"kw":["谷胱甘肽","奥美拉唑","选择性"]},{"id":"b495788770","no":5,"q":"请简述镇吐药的分类和作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e镇吐药物可阻断呕吐神经反射环的传导，达到镇吐的临床治疗效果。该反射环受多种神经递质影响，如组胺、乙酰胆碱、多巴胺和5-羟色胺。镇吐药，现以其作用靶点和作用机制（即拮抗的受体）分为抗组胺受体镇吐药、抗乙酰胆碱受体镇吐药、抗多巴胺受体镇吐药和5-HT₃受体拮抗剂。\u003c/div\u003e","pt":"镇吐药物可阻断呕吐神经反射环的传导，达到镇吐的临床治疗效果。该反射环受多种神经递质影响，如组胺、乙酰胆碱、多巴胺和5-羟色胺。镇吐药，现以其作用靶点和作用机制（即拮抗的受体）分为抗组胺受体镇吐药、抗乙酰胆碱受体镇吐药、抗多巴胺受体镇吐药和5-HT₃受体拮抗剂。","ok":true,"kw":["乙酰胆碱","治疗效果","胆碱受体","作用机制","拮抗剂"]},{"id":"df1c13c647","no":6,"q":"试从化学结构上分析多潘立酮比甲氧氯普胺较少中枢副作用的原因。","a":"\u003cdiv class=\"q-ln\"\u003e作为促动力药物的多潘立酮和甲氧氯普胺，作用于消化系统的多巴胺D₂受体，促进胃肠道的蠕动。但这两个药物都能进入中枢，影响中枢的多巴胺D₂受体，导致中枢神经的副作用。从结构上看多潘立酮比甲氧氯普胺含有较多的极性基团，极性较甲氧氯普胺大，不易透过血-脑脊液屏障。相比之下，进入中枢的多潘立酮的量较少，故多潘立酮比甲氧氯普胺较少中枢的副作用。\u003c/div\u003e","pt":"作为促动力药物的多潘立酮和甲氧氯普胺，作用于消化系统的多巴胺D₂受体，促进胃肠道的蠕动。但这两个药物都能进入中枢，影响中枢的多巴胺D₂受体，导致中枢神经的副作用。从结构上看多潘立酮比甲氧氯普胺含有较多的极性基团，极性较甲氧氯普胺大，不易透过血-脑脊液屏障。相比之下，进入中枢的多潘立酮的量较少，故多潘立酮比甲氧氯普胺较少中枢的副作用。","ok":true,"kw":["胃肠道","副作用"]}],"count":6,"done":6},{"label":"第七章","questions":[{"id":"4b138aad6c","no":1,"q":"解热镇痛药","a":"\u003cdiv class=\"q-ln\"\u003e是指能降低超过正常体温温度的药物。该类药物在治疗剂量内对正常体温没有影响，并且能够升高痛觉的阈值，使痛觉神经对疼痛的感觉变得迟钝，因此该类药物在降体温的同时，通常也有止痛的效果。\u003c/div\u003e","pt":"是指能降低超过正常体温温度的药物。该类药物在治疗剂量内对正常体温没有影响，并且能够升高痛觉的阈值，使痛觉神经对疼痛的感觉变得迟钝，因此该类药物在降体温的同时，通常也有止痛的效果。","ok":true,"kw":[]},{"id":"5633474820","no":2,"q":"非甾体抗炎药","a":"\u003cdiv class=\"q-ln\"\u003e该类药物抑制环氧合酶的活性，减少体内花生四烯酸合成前列腺素和血栓素前体的一大类具有不同化学结构的药物。这些药物都具有解热、镇痛和抗炎的作用。其抗炎作用的机制与甾类抗炎药如可的松不同。广义的非甾体抗炎药也包括解热镇痛药、抗痛风药。\u003c/div\u003e","pt":"该类药物抑制环氧合酶的活性，减少体内花生四烯酸合成前列腺素和血栓素前体的一大类具有不同化学结构的药物。这些药物都具有解热、镇痛和抗炎的作用。其抗炎作用的机制与甾类抗炎药如可的松不同。广义的非甾体抗炎药也包括解热镇痛药、抗痛风药。","ok":true,"kw":["非甾体抗炎药","解热镇痛药"]},{"id":"e9762f4c54","no":3,"q":"为什么临床上使用的布洛芬为消旋体？","a":"\u003cdiv class=\"q-ln\"\u003e非甾体抗炎药布洛芬其S-(+)-异构体有效，R-(-)-异构体无活性。在体内，辅酶A立体选择性地与R-(-)-异构体结合形成酰化辅酶A，不和S-(+)-异构体结合。生成的酰化辅酶A在体内酶的催化下发生差向异构化，生成R-酰化物和S-酰化物，S-酰化物很快水解生成S-(+)-布洛芬。通过这种方式手性药物实现了在体内异构体的转化，因此临床上布洛芬可以使用消旋体。\u003c/div\u003e","pt":"非甾体抗炎药布洛芬其S-(+)-异构体有效，R-(-)-异构体无活性。在体内，辅酶A立体选择性地与R-(-)-异构体结合形成酰化辅酶A，不和S-(+)-异构体结合。生成的酰化辅酶A在体内酶的催化下发生差向异构化，生成R-酰化物和S-酰化物，S-酰化物很快水解生成S-(+)-布洛芬。通过这种方式手性药物实现了在体内异构体的转化，因此临床上布洛芬可以使用消旋体。","ok":true,"kw":["非甾体抗炎药","手性药物","异构体","选择性"]},{"id":"910cb8156e","no":4,"q":"从现代科学的角度分析，将阿司匹林制成钙盐是否能降低胃肠道的副作用。","a":"\u003cdiv class=\"q-ln\"\u003e阿司匹林的作用靶点为环氧合酶，其钙盐不改变其作用靶点，只能改变其溶解度。而胃肠道副作用产生的机制是抑制胃壁的前列腺素合成。故其钙盐不能降低该药物的胃肠道副作用。\u003c/div\u003e","pt":"阿司匹林的作用靶点为环氧合酶，其钙盐不改变其作用靶点，只能改变其溶解度。而胃肠道副作用产生的机制是抑制胃壁的前列腺素合成。故其钙盐不能降低该药物的胃肠道副作用。","ok":true,"kw":["胃肠道","副作用"]},{"id":"60c0564446","no":5,"q":"为什么将含苯胺类的非那西丁淘汰，而保留了对乙酰氨基酚？","a":"\u003cdiv class=\"q-ln\"\u003e为苯胺类药物代谢规律所决定。非那西丁的代谢物不易被排除而产生毒性，对乙酰氨基酚的代谢物较非那西丁易于排出体外，按药物说明书使用，正常剂量下没有毒性。同时对乙酰氨基酚是非那西丁的活性代谢物，两者的活性相当。\u003c/div\u003e","pt":"为苯胺类药物代谢规律所决定。非那西丁的代谢物不易被排除而产生毒性，对乙酰氨基酚的代谢物较非那西丁易于排出体外，按药物说明书使用，正常剂量下没有毒性。同时对乙酰氨基酚是非那西丁的活性代谢物，两者的活性相当。","ok":true,"kw":[]},{"id":"910d00c056","no":6,"q":"如何从吲哚美辛改造得到舒林酸?舒林酸特点如何?","a":"\u003cdiv class=\"q-ln\"\u003e利用电子等排原理，将吲哚环上的一N一换成一CH=，获得了舒林酸（sulindac）。舒林酸有几何异构，药用顺式体（Z），这可保证亚磺酰苯基与茚的苯环在同侧，舒林酸属前药，它在体外无效。在体内经肝代谢，甲基亚砜基被还原为甲硫基化合物而显示生物活性。舒林酸自肾脏排泄较慢，半衰期长，故起效慢，作用持久。具有副作用较轻、耐受性好、长期服用不易引起肾坏死等特点。\u003c/div\u003e","pt":"利用电子等排原理，将吲哚环上的一N一换成一CH=，获得了舒林酸（sulindac）。舒林酸有几何异构，药用顺式体（Z），这可保证亚磺酰苯基与茚的苯环在同侧，舒林酸属前药，它在体外无效。在体内经肝代谢，甲基亚砜基被还原为甲硫基化合物而显示生物活性。舒林酸自肾脏排泄较慢，半衰期长，故起效慢，作用持久。具有副作用较轻、耐受性好、长期服用不易引起肾坏死等特点。","ok":true,"kw":["生物活性","半衰期","副作用"]},{"id":"ded510fbb8","no":7,"q":"从双氯芬酸钠的合成工艺研究结果，分析药物合成工艺的进展应向哪个方向发展?","a":"\u003cdiv class=\"q-ln\"\u003e双氯芬酸钠的合成有许多种方法，其中以苯胺与 2,6-二氯苯酚缩合，再与氯乙酰氯进行缩合、水解的方法成本最低。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e从双氯芬酸钠的合成路线改进看，取得合成工艺的突破在于合成路线的巧妙设计和新试剂、新反应的使用及对反应机制的深刻理解。\u003c/div\u003e","pt":"双氯芬酸钠的合成有许多种方法，其中以苯胺与 2,6-二氯苯酚缩合，再与氯乙酰氯进行缩合、水解的方法成本最低。 从双氯芬酸钠的合成路线改进看，取得合成工艺的突破在于合成路线的巧妙设计和新试剂、新反应的使用及对反应机制的深刻理解。","ok":true,"kw":[]}],"count":7,"done":7},{"label":"第八章","questions":[{"id":"959ab274b3","no":1,"q":"生物烷化剂","a":"","pt":"","ok":false,"kw":[]},{"id":"0e75011fcd","no":2,"q":"抗代谢药物","a":"","pt":"","ok":false,"kw":[]},{"id":"18d882e783","no":3,"q":"生物电子等排体","a":"","pt":"","ok":false,"kw":[]},{"id":"684d265659","no":4,"q":"潜效化","a":"","pt":"","ok":false,"kw":[]},{"id":"30abedff75","no":5,"q":"试从作用机制解释脂肪氮芥和芳香氮芥类抗肿瘤药物的活性和毒性的差异。","a":"","pt":"","ok":false,"kw":[]},{"id":"c8bd2afaf7","no":6,"q":"为什么环磷酰胺的毒性比其他氮芥类抗肿瘤药物的毒性小?","a":"","pt":"","ok":false,"kw":[]},{"id":"b9391ccf46","no":7,"q":"抗代谢抗肿瘤药物是如何设计出来的？试举一例药物说明。","a":"","pt":"","ok":false,"kw":[]},{"id":"5f8f20cd74","no":8,"q":"试说明顺铂的注射剂中加入氯化钠的作用。","a":"","pt":"","ok":false,"kw":[]},{"id":"7158e38e55","no":9,"q":"氮芥类抗肿瘤药物是如何发展而来的？其结构是由哪两部分组成？并简述各","a":"","pt":"","ok":false,"kw":[]}],"count":9,"done":0},{"label":"第九章","questions":[{"id":"482f9d158f","no":1,"q":"抗生素(antibiotics)","a":"","pt":"","ok":false,"kw":[]},{"id":"526eee0af4","no":2,"q":"半合成抗生素","a":"","pt":""," <script>
/* 药学考研 · 沉浸式刷题 */
(function () {
  'use strict';

  var DATA = window.QUIZ_DATA;
  var KEY = 'pharm-quiz-v1';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ------------------------------------------------------------------ */
  /* 存储                                                                */
  /* ------------------------------------------------------------------ */
  var DEF = {
    prog: {},   // id -> {s:0未掌握/1模糊/2掌握, n:次数, t:时间, d:到期}
    set: { count: 20, order: 'rand', mask: 'kw', answered: true, weak: false },
    sel: {},    // 学科 -> [章节]
    theme: 'dark'
  };
  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
  S = Object.assign({}, DEF, S);
  S.set = Object.assign({}, DEF.set, S.set);
  if (!S.sel) S.sel = {};
  if (!S.prog) S.prog = {};
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // 预处理：为每题挂上所属学科 / 章节
  DATA.subjects.forEach(function (s) {
    s.chapters.forEach(function (c) {
      c.questions.forEach(function (q) { q._s = s.subject; q._c = c.label; });
    });
  });

  var curSubj = 0;
  var SE = null;      // 当前练习
  var IDLE = null;

  /* ------------------------------------------------------------------ */
  /* 工具                                                                */
  /* ------------------------------------------------------------------ */
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function selOf(name) {
    if (!S.sel[name]) {
      var subj = DATA.subjects.filter(function (x) { return x.subject === name; })[0];
      S.sel[name] = subj ? subj.chapters.map(function (c) { return c.label; }) : [];
    }
    return new Set(S.sel[name]);
  }
  function setSel(name, set) { S.sel[name] = Array.from(set); save(); }
  function prog(id) { return S.prog[id]; }
  function isWeak(q) { var p = prog(q.id); return !!p && p.s < 2; }

  /** 记忆评分：1 忘记 / 2 模糊 / 3 掌握 */
  function memorize(id, r) {
    var p = S.prog[id] || (S.prog[id] = { s: 0, n: 0, t: 0, d: 0 });
    p.n++; p.t = Date.now();
    if (r === 3) { p.s = Math.min(2, p.s + 1); p.d = Date.now() + (p.s >= 2 ? 4 : 1) * 864e5; }
    else if (r === 2) { p.s = 1; p.d = Date.now() + 12 * 36e5; }
    else { p.s = 0; p.d = Date.now(); }
    save();
  }

  /* ------------------------------------------------------------------ */
  /* 关键词遮盖                                                          */
  /* ------------------------------------------------------------------ */
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function applyMask(root, terms, numMode) {
    var parts = terms.slice().sort(function (a, b) { return b.length - a.length; }).map(escRe);
    if (numMode) parts.push('\\d+(?:\\.\\d+)?%?');
    if (!parts.length) return 0;

    var re = new RegExp(parts.join('|'), 'g');
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = n.parentElement;
        if (!p || p.closest('.q-tbl')) return NodeFilter.FILTER_REJECT; // 表格保持完整
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    var budget = Math.max(16, root.textContent.length * 0.4);  // 最多遮盖 40% 篇幅
    var used = 0;

    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i], txt = node.nodeValue, m, frag, last = 0, hit = false;
      re.lastIndex = 0;
      frag = document.createDocumentFragment();
      while ((m = re.exec(txt)) !== null) {
        var prev = txt.charAt(m.index - 1);
        var next = txt.charAt(m.index + m[0].length);
        if (/[A-Za-z]/.test(prev) || /[A-Za-z]/.test(next)) continue;   // 5-HT、pH4 之类不切
        if (numMode && /^\d/.test(m[0])) {                              // 序号、编号不遮盖
          if (/[.．、,，]/.test(next)) continue;                                   // 1. 2、 这类序号
          if (prev === '第' || prev === 'P' || prev === 'p') continue;              // 第一章、P123
          if ((prev === '（' && next === '）') || (prev === '(' && next === ')')) continue;  // （1）
        }
        if (used + m[0].length > budget) continue;
        used += m[0].length;
        if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
        var sp = document.createElement('span');
        sp.className = 'mask';
        sp.textContent = m[0];
        frag.appendChild(sp);
        last = m.index + m[0].length;
        hit = true;
      }
      if (hit) {
        if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
        node.parentNode.replaceChild(frag, node);
      }
    }
    return used;
  }

  /** 伪随机（按题目固定种子，保证反复渲染结果一致） */
  function seeded(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () {
      h += 0x6D2B79F5;
      var t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** 兜底：没有关键词时，按语句片段挖空 */
  function clauseMask(root, seedStr, ratio) {
    var rnd = seeded(seedStr);
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = n.parentElement;
        if (!p || p.closest('.q-tbl')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var budget = root.textContent.length * (ratio || 0.22);
    var used = 0, out = [];

    nodes.forEach(function (node) {
      var txt = node.nodeValue;
      var frag = document.createDocumentFragment(), last = 0, hit = false;
      var re = /[一-龥][一-龥0-9]{1,}/g, m;
      while ((m = re.exec(txt)) !== null) {
        var run = m[0], pos = m.index;
        while (run.length) {
          var len = Math.min(run.length, 4 + Math.floor(rnd() * 3));
          var chunk = run.slice(0, len);
          run = run.slice(len);
          if (chunk.length < 2 || !/[一-龥]/.test(chunk)) continue;   // 纯数字片段不挖空
          if (used + chunk.length > budget || rnd() > 0.4) continue;
          var at = pos + m[0].length - run.length - chunk.length;
          used += chunk.length;
          if (at > last) frag.appendChild(document.createTextNode(txt.slice(last, at)));
          var sp = document.createElement('span');
          sp.className = 'mask';
          sp.textContent = chunk;
          frag.appendChild(sp);
          last = at + chunk.length;
          hit = true;
        }
      }
      if (hit) {
        if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
        node.parentNode.replaceChild(frag, node);
        out.push(1);
      }
    });
    return out.length;
  }

  /** 浏览页用的遮盖（不做整段遮盖） */
  function maskInto(box, q) {
    if (S.set.mask === 'off' || S.set.mask === 'block') return;
    var n = applyMask(box, q.kw || [], S.set.mask === 'kwnum');
    if (!n) clauseMask(box, q.id, 0.22);
  }

  /** 渲染答案并按当前设置遮盖 */
  function renderAnswer(box, q, wrap) {
    var mode = SE ? (SE.maskOn ? S.set.mask : 'off') : S.set.mask;
    box.innerHTML = q.a || '';
    box.classList.remove('reveal-all');
    wrap.classList.remove('blur');
    if (mode === 'off' || !q.ok) return { n: 0, fallback: false };
    if (mode === 'block') { wrap.classList.add('blur'); return { n: 1, fallback: false }; }
    var n = applyMask(box, q.kw || [], mode === 'kwnum');
    if (!n) n = clauseMask(box, q.id, 0.22);   // 没有关键词时按片段挖空
    return { n: n, fallback: !n ? false : !q.kw || !q.kw.length };
  }

  /* ------------------------------------------------------------------ */
  /* 屏幕切换                                                            */
  /* ------------------------------------------------------------------ */
  function showScreen(name) {
    $$('.screen').forEach(function (el) { el.classList.toggle('is-on', el.id === 'screen-' + name); });
    $$('.tab').forEach(function (b) { b.classList.toggle('is-on', b.dataset.screen === name); });
    document.body.style.overflow = name === 'quiz' ? 'hidden' : '';
    if (name !== 'quiz') { clearTimeout(IDLE); showChrome(true); }
    if (name === 'browse') renderBrowse();
    if (name === 'stats') renderStats();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ------------------------------------------------------------------ */
  /* 设置页                                                              */
  /* ------------------------------------------------------------------ */
  function renderSubjects() {
    var box = $('#subjGrid');
    box.innerHTML = '';
    DATA.subjects.forEach(function (s, i) {
      var all = 0, ok = 0, learned = 0;
      s.chapters.forEach(function (c) {
        c.questions.forEach(function (q) {
          all++; if (q.ok) ok++;
          if (S.prog[q.id]) learned++;
        });
      });
      var el = document.createElement('button');
      el.className = 'subj' + (i === curSubj ? ' is-on' : '');
      el.innerHTML =
        '<div class="nm">' + s.subject + '</div>' +
        '<div class="sub">' + s.chapters.length + ' 章 · ' + all + ' 题 · 有答案 ' + ok + '</div>' +
        '<div class="bar"><i style="width:' + (ok ? Math.round(learned / ok * 100) : 0) + '%"></i></div>';
      el.onclick = function () { curSubj = i; renderSetup(); };
      box.appendChild(el);
    });
  }

  function renderChapters() {
    var s = DATA.subjects[curSubj];
    var sel = selOf(s.subject);
    $('#chapTitle').textContent = s.subject + ' · 章节';
    var box = $('#chapGrid');
    box.innerHTML = '';
    s.chapters.forEach(function (c) {
      var weak = c.questions.filter(isWeak).length;
      var el = document.createElement('div');
      el.className = 'chap' + (sel.has(c.label) ? ' is-on' : '');
      el.innerHTML = '<i class="cbox">✓</i><span>' + c.label + '</span>' +
        '<span class="cnt">' + (weak ? '<b>' + weak + '</b> 待巩固 / ' : '') + c.done + '/' + c.count + '</span>';
      el.onclick = function () {
        if (sel.has(c.label)) sel.delete(c.label); else sel.add(c.label);
        setSel(s.subject, sel);
        el.classList.toggle('is-on', sel.has(c.label));
        refreshStart();
      };
      box.appendChild(el);
    });
    $('#chapCount').textContent = '已选 ' + sel.size + ' / ' + s.chapters.length + ' 章';
  }

  function buildPool() {
    var s = DATA.subjects[curSubj];
    var sel = selOf(s.subject);
    var out = [];
    s.chapters.forEach(function (c) {
      if (!sel.has(c.label)) return;
      c.questions.forEach(function (q) {
        if (S.set.answered && !q.ok) return;
        if (S.set.weak && !isWeak(q)) return;
        out.push(q);
      });
    });
    return out;
  }

  function maskName(m) {
    return { kw: '关键词', kwnum: '关键词+数字', block: '整段', off: '不遮盖' }[m] || m;
  }

  function refreshStart() {
    var pool = buildPool();
    var n = S.set.count > 0 ? Math.min(S.set.count, pool.length) : pool.length;
    $('#startInfo').innerHTML = '共 <b>' + pool.length + '</b> 道可选题目，本组将练习 <b>' + n + '</b> 题。' +
      (S.set.mask === 'off' ? '（答案直接显示）' : '（答案按“' + maskName(S.set.mask) + '”遮盖）');
    $('#startBtn').disabled = pool.length === 0;
    $('#startBtn').textContent = pool.length ? '开始刷题 · ' + n + ' 题' : '没有可练的题目';
  }

  function renderSetup() {
    renderSubjects();
    renderChapters();
    $$('.segbar').forEach(function (bar) {
      var v = S.set[bar.dataset.opt];
      $$('button', bar).forEach(function (b) { b.classList.toggle('is-on', b.dataset.v === String(v)); });
    });
    $('#optAnswered').checked = S.set.answered;
    $('#optWeak').checked = S.set.weak;
    refreshStart();
  }

  /* ------------------------------------------------------------------ */
  /* 刷题                                                                */
  /* ------------------------------------------------------------------ */
  function startSession() {
    var pool = buildPool();
    if (!pool.length) { toast('没有符合条件的题目'); return; }
    if (S.set.order === 'rand') shuffle(pool);
    var target = S.set.count > 0 ? Math.min(S.set.count, pool.length) : pool.length;
    SE = {
      pool: pool, ni: 0, target: target, picked: 0,
      queue: [], history: [], cur: null, revealed: false, maskOn: true,
      res: { 1: 0, 2: 0, 3: 0 }, seen: new Set(), t0: Date.now(), requeue: {}
    };
    showScreen('quiz');
    nextQuestion();
  }

  function pullNew() {
    while (SE.ni < SE.pool.length && SE.picked < SE.target) {
      SE.queue.push(SE.pool[SE.ni++]);
      SE.picked++;
    }
  }

  function nextQuestion() {
    if (!SE.queue.length) pullNew();
    if (!SE.queue.length) return finish();
    var q = SE.queue.shift();
    if (SE.cur) SE.history.push(SE.cur);
    SE.cur = q;
    SE.revealed = false;
    renderQuestion();
  }

  function prevQuestion() {
    if (!SE.history.length) { toast('已经是第一题'); return; }
    var q = SE.history.pop();
    SE.queue.unshift(SE.cur);
    SE.cur = q;
    SE.revealed = false;
    renderQuestion();
  }

  function renderQuestion() {
    var q = SE.cur;
    var p = prog(q.id);
    var tag = ['新题', '待巩固', '模糊', '已掌握'][p ? p.s + 1 : 0];
    $('#qTag').innerHTML = q._s + ' · ' + q._c + ' · 第 ' + q.no + ' 题　<span class="muted">' + tag + '</span>';
    $('#qText').innerHTML = q.q;

    var wrap = $('#ansBox'), box = $('#ansInner');
    wrap.classList.remove('show');
    $('#revealHint').hidden = false;
    $('#ansTools').hidden = true;
    $('#rateRow').hidden = true;
    $('#ansEmpty').hidden = q.ok;
    box.hidden = !q.ok;
    if (q.ok) {
      var r = renderAnswer(box, q, wrap);
      $('#maskTip').textContent = (!r.n && S.set.mask !== 'off')
        ? '本题答案太短，没有可遮盖的内容'
        : (r.fallback ? '本题无术语关键词，已按语句片段挖空' : '');
    }

    var total = SE.target;
    $('#qzCount').textContent = SE.seen.size + ' / ' + total;
    $('#qzBar').style.width = (total ? SE.seen.size / total * 100 : 0) + '%';
    $('#qzPath').textContent = q._s + ' · ' + q._c;
    updateMaskBtn();
    $('.qz-body').scrollTop = 0;
  }

  function reveal() {
    if (!SE || SE.revealed) return;
    if (!SE.cur.ok) { $('#ansBox').classList.add('show'); SE.revealed = true; $('#revealHint').hidden = true; return; }
    SE.revealed = true;
    $('#ansBox').classList.add('show');
    $('#revealHint').hidden = true;
    $('#ansTools').hidden = false;
    $('#rateRow').hidden = false;
  }

  function requeue(q, at) {
    var n = SE.requeue[q.id] || 0;
    if (n >= 3) return;
    SE.requeue[q.id] = n + 1;
    SE.queue.splice(Math.min(at, SE.queue.length), 0, q);
  }

  function rate(r) {
    if (!SE || !SE.cur) return;
    var q = SE.cur;
    memorize(q.id, r);
    SE.res[r]++;
    SE.seen.add(q.id);
    if (r === 1) requeue(q, 3);
    else if (r === 2) requeue(q, 6);
    nextQuestion();
  }

  function skip() {
    if (!SE || !SE.cur) return;
    SE.seen.add(SE.cur.id);
    nextQuestion();
  }

  function finish() {
    var min = Math.max(1, Math.round((Date.now() - SE.t0) / 60000));
    var uniq = SE.seen.size;
    $('#doneTitle').textContent = '本组完成 · ' + uniq + ' 题 / ' + min + ' 分钟';
    $('#doneGrid').innerHTML =
      cell(SE.res[3], '掌握', 'var(--accent2)') +
      cell(SE.res[2], '模糊', 'var(--warn)') +
      cell(SE.res[1], '忘记', 'var(--bad)');
    SE = null;
    showScreen('done');
  }
  function cell(n, label, color) {
    return '<div class="done-cell"><b style="color:' + color + '">' + n + '</b><span>' + label + '</span></div>';
  }

  function updateMaskBtn() {
    var mode = SE && !SE.maskOn ? 'off' : S.set.mask;
    $('#maskBtn').textContent = '遮盖：' + (mode === 'off' ? '关' : maskName(mode));
  }

  function toggleMask() {
    if (!SE) return;
    SE.maskOn = !SE.maskOn;
    if (SE.cur && SE.cur.ok) renderAnswer($('#ansInner'), SE.cur, $('#ansBox'));
    updateMaskBtn();
    toast(SE.maskOn ? '已开启遮盖' : '已关闭遮盖');
  }

  function revealAll() {
    var box = $('#ansInner'), wrap = $('#ansBox');
    if (wrap.classList.contains('blur')) {
      wrap.classList.remove('blur');
      $('#revealAllBtn').textContent = '全部揭晓';
      return;
    }
    var on = box.classList.toggle('reveal-all');
    $('#revealAllBtn').textContent = on ? '恢复遮盖' : '全部揭晓';
  }

  /* ------------------------------------------------------------------ */
  /* 浏览                                                                */
  /* ------------------------------------------------------------------ */
  var browseOpen = new Set();
  function renderBrowse() {
    var box = $('#browseList');
    var kw = ($('#searchInput').value || '').trim().toLowerCase();
    var list = [];
    DATA.subjects.forEach(function (s) {
      var sel = selOf(s.subject);
      s.chapters.forEach(function (c) {
        if (!sel.has(c.label)) return;
        c.questions.forEach(function (q) { list.push(q); });
      });
    });
    if (kw) {
      list = list.filter(function (q) {
        return q.q.toLowerCase().indexOf(kw) >= 0 || q.pt.toLowerCase().indexOf(kw) >= 0;
      });
    }
    $('#browseInfo').textContent = '共 ' + list.length + ' 题' + (kw ? '（搜索：' + kw + '）' : '') +
      '，点击题目展开答案；被遮盖的词可单独点击查看。';
    box.innerHTML = '';
    list.slice(0, 300).forEach(function (q) {
      var p = prog(q.id);
      var badge = !q.ok ? '<span class="item-badge no">暂无答案</span>'
        : (p && p.s < 2) ? '<span class="item-badge weak">待巩固</span>'
          : (p ? '<span class="item-badge ok">已掌握</span>' : '');
      var el = document.createElement('div');
      el.className = 'item' + (browseOpen.has(q.id) ? ' open' : '');
      el.innerHTML =
        '<div class="item-hd"><span class="item-no">' + q.no + '</span>' +
        '<span class="item-q">' + q.q + '</span>' + badge + '</div>' +
        '<div class="item-a"><div class="ans-inner"></div></div>';
      var inner = $('.ans-inner', el);
      $('.item-hd', el).onclick = function () {
        el.classList.toggle('open');
        if (el.classList.contains('open')) {
          browseOpen.add(q.id);
          if (!inner.dataset.done) {
            inner.innerHTML = q.a || '<span class="muted">暂无答案</span>';
            if (q.ok) maskInto(inner, q);
            inner.dataset.done = '1';
          }
        } else browseOpen.delete(q.id);
      };
      inner.addEventListener('click', function (e) {
        if (e.target.classList.contains('mask')) e.target.classList.toggle('on');
      });
      box.appendChild(el);
    });
    if (list.length > 300) {
      var more = document.createElement('div');
      more.className = 'muted tiny';
      more.style.padding = '8px';
      more.textContent = '仅显示前 300 条，请用搜索缩小范围。';
      box.appendChild(more);
    }
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ------------------------------------------------------------------ */
  /* 统计                                                                */
  /* ------------------------------------------------------------------ */
  function renderStats() {
    var box = $('#statsBox');
    var html = '';
    DATA.subjects.forEach(function (s) {
      var ok = 0, weak = 0, mid = 0, none = 0;
      s.chapters.forEach(function (c) {
        c.questions.forEach(function (q) {
          if (!q.ok) return;
          var p = prog(q.id);
          ok++;
          if (!p) none++;
          else if (p.s >= 2) weak++;
          else mid++;
        });
      });
      var pct = ok ? Math.round((weak + mid) / ok * 100) : 0;
      html += '<div class="stat-row"><span class="nm">' + s.subject + '</span>' +
        '<span class="stat-bar"><i class="i-ok" style="width:' + (ok ? weak / ok * 100 : 0) + '%"></i>' +
        '<i class="i-warn" style="width:' + (ok ? mid / ok * 100 : 0) + '%"></i></span>' +
        '<span class="num">掌握 ' + weak + ' · 模糊 ' + mid + ' · 未学 ' + none + '（' + pct + '%）</span></div>';
    });
    var ids = Object.keys(S.prog);
    html += '<div class="muted tiny">累计答题 ' + ids.reduce(function (n, k) { return n + S.prog[k].n; }, 0) +
      ' 次，涉及 ' + ids.length + ' 道题。进度保存在本机浏览器，换设备不会同步。</div>';
    box.innerHTML = html;
  }

  /* ------------------------------------------------------------------ */
  /* 沉浸：空闲时隐藏界面元素                                             */
  /* ------------------------------------------------------------------ */
  function showChrome(on) {
    $('#topbar').classList.toggle('hide', !on);
    $('.qz-top').classList.toggle('hide', !on);
    $('#qzFoot').classList.toggle('hide', !on);
  }
  function kickIdle() {
    if (!SE) return;
    showChrome(true);
    clearTimeout(IDLE);
    IDLE = setTimeout(function () { if (SE) showChrome(false); }, 5000);
  }

  /* ------------------------------------------------------------------ */
  /* 事件                                                                */
  /* ------------------------------------------------------------------ */
  function bind() {
    $$('.tab').forEach(function (b) {
      b.onclick = function () {
        if (SE && b.dataset.screen !== 'quiz') { SE = null; }
        showScreen(b.dataset.screen);
      };
    });

    $$('.segbar').forEach(function (bar) {
      var opt = bar.dataset.opt;
      $$('button', bar).forEach(function (b) {
        b.onclick = function () {
          S.set[opt] = opt === 'count' ? Number(b.dataset.v) : b.dataset.v;
          save();
          renderSetup();
        };
      });
    });

    $('#optAnswered').onchange = function () { S.set.answered = this.checked; save(); refreshStart(); };
    $('#optWeak').onchange = function () { S.set.weak = this.checked; save(); refreshStart(); };

    $$('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var s = DATA.subjects[curSubj], sel = selOf(s.subject);
        var act = b.dataset.act;
        if (act === 'skip') { skip(); return; }
        if (act === 'sel-all') s.chapters.forEach(function (c) { sel.add(c.label); });
        if (act === 'sel-none') sel.clear();
        if (act === 'sel-weak') {
          sel.clear();
          s.chapters.forEach(function (c) {
            if (c.questions.some(isWeak)) sel.add(c.label);
          });
        }
        setSel(s.subject, sel);
        renderChapters();
        refreshStart();
      };
    });

    $('#startBtn').onclick = startSession;
    $('#againBtn').onclick = function () { showScreen('setup'); renderSetup(); startSession(); };
    $('#backBtn').onclick = function () { showScreen('setup'); renderSetup(); };

    $('#quitBtn').onclick = function () {
      if (SE && SE.seen.size && !confirm('结束本组练习？已答 ' + SE.seen.size + ' 题。')) return;
      SE = null;
      showScreen('setup');
      renderSetup();
    };

    $('#showBtn').onclick = reveal;
    $('#maskBtn').onclick = toggleMask;
    $('#revealAllBtn').onclick = revealAll;
    $('#ansBox').addEventListener('click', function (e) {
      if (e.target.classList.contains('mask')) e.target.classList.toggle('on');
      else if (this.classList.contains('blur')) revealAll();
    });
    $$('.rate-btn').forEach(function (b) {
      b.onclick = function () { rate(Number(b.dataset.rate)); };
    });

    $('#fsBtn').onclick = function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    };

    $('#searchInput').oninput = renderBrowse;
    $('#browseReveal').onclick = function () {
      $$('#browseList .item').forEach(function (it) {
        if (!it.classList.contains('open')) $('.item-hd', it).click();
      });
    };

    $('#resetBtn').onclick = function () {
      if (!confirm('确定清空全部学习进度？该操作不可撤销。')) return;
      S.prog = {};
      save();
      renderStats();
      toast('进度已清空');
    };

    $('#themeBtn').onclick = function () {
      S.theme = S.theme === 'dark' ? 'light' : 'dark';
      save();
      applyTheme();
    };

    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'INPUT') return;
      if (!$('#screen-quiz').classList.contains('is-on')) return;
      var k = e.key;
      if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!SE.revealed) reveal(); else rate(3); }
      else if (k === '1') rate(1);
      else if (k === '2') rate(2);
      else if (k === '3') rate(3);
      else if (k === 'ArrowLeft') prevQuestion();
      else if (k === 'ArrowRight') { if (SE.revealed) rate(3); else skip(); }
      else if (k === 'h' || k === 'H') toggleMask();
      else if (k === 's' || k === 'S') skip();
      else if (k === 'f' || k === 'F') $('#fsBtn').click();
      else if (k === 'Escape') $('#quitBtn').click();
      kickIdle();
    });

    document.addEventListener('mousemove', kickIdle);
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', S.theme);
    $('#themeBtn').textContent = S.theme === 'dark' ? '日间' : '夜间';
  }

  /* ------------------------------------------------------------------ */
  applyTheme();
  bind();
  renderSetup();
  $('#metaVer').textContent = '题库 ' + DATA.generatedAt + ' · 关键词 ' + DATA.keywords;
})();

</script>
</body>
</html>
