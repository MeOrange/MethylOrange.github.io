<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>药学考研刷题</title>
<style>
/* ===== 基础 ===== */
:root {
  --bg: #0d1117;
  --bg2: #10151d;
  --card: #161c26;
  --card2: #1b2230;
  --line: #262f3d;
  --txt: #dde5f0;
  --dim: #8a97a9;
  --accent: #5b8cff;
  --accent2: #3ecf8e;
  --warn: #f0b429;
  --bad: #f2637b;
  --mask: #2b3342;
  --mask-txt: transparent;
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --serif: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
}
html[data-theme="light"] {
  --bg: #f4f6f9;
  --bg2: #eef1f6;
  --card: #ffffff;
  --card2: #f7f9fc;
  --line: #e2e7ef;
  --txt: #1e2733;
  --dim: #6d7987;
  --mask: #dfe4ec;
  --shadow: 0 14px 40px rgba(31, 45, 61, .10);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 700px at 50% -10%, var(--bg2), var(--bg));
  color: var(--txt);
  font: 15px/1.7 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; color: inherit; }
h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .3px; }
.muted { color: var(--dim); }
.tiny { font-size: 12px; }

/* ===== 顶栏 ===== */
.topbar {
  position: relative; z-index: 20;
  display: flex; align-items: center; gap: 18px;
  padding: 0 22px; height: 56px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px);
  transition: opacity .35s;
}
.topbar.hide { opacity: 0; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: .5px; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.brand .home { font-size: 13px; font-weight: 400; color: var(--dim); text-decoration: none; margin-left: 10px; transition: color .15s; }
.brand .home:hover { color: var(--accent); }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab {
  border: 0; background: transparent; color: var(--dim);
  padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 14px;
}
.tab:hover { color: var(--txt); }
.tab.is-on { background: var(--card2); color: var(--txt); }
.acts { display: flex; align-items: center; gap: 10px; }
.ver { font-size: 12px; color: var(--dim); }
.icon-btn {
  border: 1px solid var(--line); background: var(--card2); color: var(--dim);
  padding: 5px 11px; border-radius: 8px; cursor: pointer; font-size: 12px;
}
.icon-btn:hover { color: var(--txt); border-color: var(--accent); }

/* ===== 屏幕 ===== */
.screen { display: none; }
.screen.is-on { display: block; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
.wrap { max-width: 1020px; margin: 0 auto; padding: 26px 20px 80px; }
.wrap.narrow { max-width: 620px; }

/* ===== 学科卡片 ===== */
.subj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 20px; }
.subj {
  position: relative; text-align: left; cursor: pointer;
  border: 1px solid var(--line); background: var(--card);
  border-radius: 14px; padding: 16px 18px; transition: .2s;
}
.subj:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.subj.is-on { border-color: var(--accent); background: var(--card2); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 12%, var(--card)), var(--card)); }
.subj .nm { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
.subj .sub { font-size: 12px; color: var(--dim); margin-top: 4px; }
.subj .bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 12px; overflow: hidden; }
.subj .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }

/* ===== 面板 ===== */
.panel { border: 1px solid var(--line); background: var(--card); border-radius: 16px; margin-bottom: 18px; overflow: hidden; }
.panel-hd {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  background: var(--card2);
  background: color-mix(in srgb, var(--card2) 60%, var(--card));
}
.panel-hd .hd-acts { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.mini {
  border: 1px solid var(--line); background: var(--card2); color: var(--dim);
  padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px;
}
.mini:hover { color: var(--txt); border-color: var(--accent); }
.mini.danger:hover { color: #fff; background: var(--bad); border-color: var(--bad); }

/* ===== 章节 ===== */
.chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 16px 18px; }
.chap {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  background: var(--card2); font-size: 13px; transition: .15s;
}
.chap:hover { border-color: var(--accent); }
.chap.is-on { border-color: var(--accent); background: var(--card); background: color-mix(in srgb, var(--accent) 14%, var(--card2)); }
.chap .cbox {
  width: 15px; height: 15px; border-radius: 4px; border: 1px solid var(--line);
  flex: none; display: grid; place-items: center; font-size: 10px; color: transparent;
}
.chap.is-on .cbox { background: var(--accent); border-color: var(--accent); color: #fff; }
.chap .cnt { margin-left: auto; font-size: 11px; color: var(--dim); }
.chap .cnt b { color: var(--accent2); font-weight: 600; }

/* ===== 选项 ===== */
.opts { padding: 16px 18px; display: grid; gap: 14px; }
.opt { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.opt > label { width: 66px; flex: none; color: var(--dim); font-size: 13px; }
.segbar { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.segbar button {
  border: 0; background: var(--card2); color: var(--dim);
  padding: 7px 15px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line);
}
.segbar button:last-child { border-right: 0; }
.segbar button:hover { color: var(--txt); }
.segbar button.is-on { background: var(--accent); color: #fff; }
.checks { display: flex; gap: 20px; flex-wrap: wrap; }
.chk { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; }
.chk input { accent-color: var(--accent); width: 15px; height: 15px; }
.start-row {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 18px; border-top: 1px solid var(--line);
}
.start-info { font-size: 13px; color: var(--dim); }
.start-info b { color: var(--txt); }
.btn-primary {
  margin-left: auto; border: 0; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), #7d6bff);
  color: #fff; padding: 11px 30px; border-radius: 10px; font-size: 15px; font-weight: 600;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent);
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn-ghost {
  border: 1px solid var(--line); background: transparent; color: var(--dim);
  padding: 9px 20px; border-radius: 10px; cursor: pointer; font-size: 14px;
}
.btn-ghost:hover { color: var(--txt); border-color: var(--accent); }

/* ===== 刷题（沉浸） ===== */
.qz { height: calc(100vh - 56px); display: flex; flex-direction: column; }
.qz-top {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 22px; font-size: 13px; color: var(--dim);
  transition: opacity .35s;
}
.qz-top.hide { opacity: 0; }
.qz-meta { margin: 0 auto; letter-spacing: .5px; }
.qz-right { display: flex; align-items: center; gap: 10px; }
.pill { border: 1px solid var(--line); padding: 3px 12px; border-radius: 20px; font-size: 12px; }
.link-btn { border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0; }
.link-btn:hover { color: var(--txt); }
.qz-bar { height: 2px; background: var(--line); }
.qz-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .4s; }
.qz-body { flex: 1; overflow: auto; padding: 26px 20px 40px; }
.card {
  max-width: 860px; margin: 0 auto;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 34px 38px 30px; box-shadow: var(--shadow);
}
.q-tag { font-size: 12px; color: var(--dim); letter-spacing: 1px; margin-bottom: 14px; }
.q-text {
  font-family: var(--serif); font-size: 22px; line-height: 1.85;
  letter-spacing: .5px; margin-bottom: 8px;
}
.ans { margin-top: 22px; display: none; }
.ans.show { display: block; animation: fade .35s ease; }
.ans-inner {
  font-family: var(--serif); font-size: 17px; line-height: 2.05;
  padding: 20px 22px; border-radius: 14px; background: var(--card2);
  border: 1px solid var(--line);
}
.ans-inner .q-ln { padding: 1px 0; }
.ans-empty { padding: 26px 0 8px; text-align: center; color: var(--dim); }
.ans-empty p { margin: 0 0 14px; }
.ans-inner.reveal-all .mask { background: transparent; color: var(--txt); box-shadow: none; }
.mask {
  background: var(--mask); color: var(--mask-txt); border-radius: 4px;
  padding: 0 .18em; cursor: pointer; user-select: none;
  box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--txt) 12%, transparent);
  transition: background .15s, color .15s;
}
.mask:hover { background: var(--accent); }
.mask.on { background: transparent; color: var(--accent2); box-shadow: none; }
.ans.blur .ans-inner { filter: blur(7px); user-select: none; }
.ans.blur { position: relative; }
.ans.blur::after {
  content: "点击「全部揭晓」查看完整答案"; position: absolute; inset: 0;
  display: grid; place-items: center; font-size: 13px; color: var(--dim);
  border-radius: 14px; cursor: pointer;
}
.ans-tools { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.reveal-hint { margin-top: 26px; }
.btn-primary.wide { width: 100%; margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
.kbd {
  font-size: 11px; padding: 2px 8px; border-radius: 6px;
  background: rgba(255, 255, 255, .18); letter-spacing: 1px;
}
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 26px; animation: fade .3s; }
.rate-btn {
  border: 1px solid var(--line); background: var(--card2); color: var(--dim);
  padding: 13px 0; border-radius: 12px; cursor: pointer; font-size: 15px; position: relative;
}
.rate-btn b { position: absolute; right: 12px; top: 8px; font-size: 10px; opacity: .55; font-weight: 400; }
.rate-btn.bad:hover { border-color: var(--bad); color: var(--bad); }
.rate-btn.warn:hover { border-color: var(--warn); color: var(--warn); }
.rate-btn.ok:hover { border-color: var(--accent2); color: var(--accent2); }
.qz-foot {
  display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
  padding: 12px; font-size: 12px; color: var(--dim); transition: opacity .35s;
}
.qz-foot b { color: var(--txt); font-weight: 600; }
.qz-foot.hide { opacity: 0; }

/* 表格 */
.q-tbl { overflow-x: auto; margin: 8px 0; }
.q-tbl table { border-color: var(--line) !important; }
.q-tbl th, .q-tbl td { border-color: var(--line) !important; color: var(--txt); }
.q-tbl tr[style*="background"] { background: var(--card2) !important; }
.q-tbl td[style*="background"] { background: var(--card2) !important; }

/* ===== 浏览 ===== */
.search {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
  padding: 7px 12px; width: 260px; font-size: 13px; outline: none;
}
.search:focus { border-color: var(--accent); }
.list { padding: 0 18px 18px; display: grid; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 12px; background: var(--card2); overflow: hidden; }
.item-hd {
  display: flex; align-items: flex-start; gap: 10px; padding: 13px 15px; cursor: pointer;
}
.item-hd:hover { background: var(--card); }
.item-no { color: var(--dim); font-size: 12px; flex: none; padding-top: 3px; min-width: 26px; }
.item-q { font-family: var(--serif); font-size: 16px; line-height: 1.8; }
.item-badge { margin-left: auto; flex: none; font-size: 11px; color: var(--dim); border: 1px solid var(--line); padding: 2px 8px; border-radius: 20px; }
.item-b.no { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.item-b.ok { color: var(--accent2); border-color: color-mix(in srgb, var(--accent2) 40%, transparent); }
.item-b.weak { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.item-a { display: none; padding: 0 15px 15px 41px; }
.item.open .item-a { display: block; }
.item-a .ans-inner { font-size: 15px; line-height: 1.95; }

/* ===== 统计 / 结算 ===== */
.stats { padding: 18px; display: grid; gap: 16px; }
.stat-row { display: flex; align-items: center; gap: 14px; }
.stat-row .nm { width: 92px; flex: none; font-weight: 600; }
.stat-bar { flex: 1; height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; display: flex; }
.stat-bar i { display: block; height: 100%; }
.stat-bar .i-ok { background: var(--accent2); }
.stat-bar .i-warn { background: var(--warn); }
.stat-row .num { font-size: 12px; color: var(--dim); min-width: 150px; text-align: right; }
.done { padding: 34px; text-align: center; }
.done h2 { font-size: 22px; margin-bottom: 24px; }
.done-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 8px; }
.done-cell { border: 1px solid var(--line); border-radius: 12px; padding: 18px 10px; background: var(--card2); }
.done-cell b { display: block; font-size: 30px; font-weight: 600; }
.done-cell span { font-size: 12px; color: var(--dim); }
.done-acts { display: flex; gap: 12px; justify-content: center; margin-top: 28px; }
.done-acts .btn-primary { margin: 0; }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px);
  background: var(--card2); border: 1px solid var(--line); color: var(--txt);
  padding: 10px 20px; border-radius: 10px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: .3s; z-index: 99;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 窄屏 */
@media (max-width: 720px) {
  .card { padding: 24px 20px; }
  .q-text { font-size: 19px; }
  .search { width: 150px; }
  .opt > label { width: 100%; }
}

</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand"><i class="dot"></i>药学考研刷题<a class="home" href="/index">首页</a></div>
  <nav class="tabs" id="tabs">
    <button class="tab is-on" data-screen="setup">练习</button>
    <button class="tab" data-screen="browse">浏览</button>
    <button class="tab" data-screen="stats">统计</button>
  </nav>
  <div class="acts">
    <span class="ver" id="metaVer"></span>
    <button class="icon-btn" id="themeBtn" title="切换日间/夜间">日间</button>
  </div>
</header>

<main id="main">

  <!-- ======================= 练习设置 ======================= -->
  <section class="screen is-on" id="screen-setup">
    <div class="wrap">
      <div class="subj-grid" id="subjGrid"></div>

      <div class="panel">
        <div class="panel-hd">
          <h2 id="chapTitle">章节</h2>
          <div class="hd-acts">
            <span class="muted" id="chapCount"></span>
            <button class="mini" data-act="sel-all">全选</button>
            <button class="mini" data-act="sel-none">清空</button>
            <button class="mini" data-act="sel-weak">未掌握</button>
          </div>
        </div>
        <div class="chap-grid" id="chapGrid"></div>
      </div>

      <div class="panel">
        <div class="panel-hd"><h2>练习设置</h2></div>
        <div class="opts">
          <div class="opt">
            <label>题量</label>
            <div class="segbar" data-opt="count">
              <button data-v="10">10</button>
              <button data-v="20" class="is-on">20</button>
              <button data-v="30">30</button>
              <button data-v="50">50</button>
              <button data-v="0">全部</button>
            </div>
          </div>
          <div class="opt">
            <label>顺序</label>
            <div class="segbar" data-opt="order">
              <button data-v="rand" class="is-on">随机</button>
              <button data-v="seq">顺序</button>
            </div>
          </div>
          <div class="opt">
            <label>答案遮盖</label>
            <div class="segbar" data-opt="mask">
              <button data-v="kw" class="is-on">关键词</button>
              <button data-v="kwnum">关键词+数字</button>
              <button data-v="block">整段</button>
              <button data-v="off">不遮盖</button>
            </div>
          </div>
          <div class="opt">
            <label>范围</label>
            <div class="checks">
              <label class="chk"><input type="checkbox" id="optAnswered" checked><span>跳过暂无答案的题目</span></label>
              <label class="chk"><input type="checkbox" id="optWeak"><span>只练未掌握 / 错题</span></label>
            </div>
          </div>
        </div>
        <div class="start-row">
          <div class="start-info" id="startInfo"></div>
          <button class="btn-primary" id="startBtn">开始刷题</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ======================= 沉浸刷题 ======================= -->
  <section class="screen" id="screen-quiz">
    <div class="qz" id="qz">
      <div class="qz-top">
        <button class="link-btn" id="quitBtn">← 退出</button>
        <div class="qz-meta"><span id="qzPath"></span></div>
        <div class="qz-right">
          <span class="pill" id="qzCount">0 / 0</span>
          <button class="icon-btn" id="fsBtn" title="全屏 (F)">全屏</button>
        </div>
      </div>
      <div class="qz-bar"><i id="qzBar"></i></div>

      <div class="qz-body">
        <div class="card" id="qCard">
          <div class="q-tag" id="qTag"></div>
          <div class="q-text" id="qText"></div>

          <div class="ans" id="ansBox">
            <div class="ans-inner" id="ansInner"></div>
            <div class="ans-empty" id="ansEmpty" hidden>
              <p>本题暂无答案。</p>
              <button class="btn-ghost" data-act="skip">跳过（空格）</button>
            </div>
          </div>

          <div class="reveal-hint" id="revealHint">
            <button class="btn-primary wide" id="showBtn">显示答案<span class="kbd">空格</span></button>
          </div>

          <div class="ans-tools" id="ansTools" hidden>
            <button class="mini" id="maskBtn">遮盖：开</button>
            <button class="mini" id="revealAllBtn">全部揭晓</button>
            <span class="muted tiny" id="maskTip"></span>
          </div>

          <div class="rate" id="rateRow" hidden>
            <button class="rate-btn bad" data-rate="1">忘记<b>1</b></button>
            <button class="rate-btn warn" data-rate="2">模糊<b>2</b></button>
            <button class="rate-btn ok" data-rate="3">掌握<b>3</b></button>
          </div>
        </div>
      </div>

      <div class="qz-foot" id="qzFoot">
        <span><b>空格</b> 答案</span><span><b>1/2/3</b> 忘记·模糊·掌握</span>
        <span><b>←/→</b> 上一题·下一题</span><span><b>H</b> 遮盖</span><span><b>F</b> 全屏</span><span><b>Esc</b> 退出</span>
      </div>
    </div>
  </section>

  <!-- ======================= 浏览 ======================= -->
  <section class="screen" id="screen-browse">
    <div class="wrap">
      <div class="panel">
        <div class="panel-hd">
          <h2>题库浏览</h2>
          <div class="hd-acts">
            <input class="search" id="searchInput" placeholder="搜索题干 / 答案关键词…">
            <button class="mini" id="browseReveal">全部展开</button>
          </div>
        </div>
        <div class="muted tiny" id="browseInfo" style="padding:0 18px 12px"></div>
        <div class="list" id="browseList"></div>
      </div>
    </div>
  </section>

  <!-- ======================= 统计 ======================= -->
  <section class="screen" id="screen-stats">
    <div class="wrap">
      <div class="panel">
        <div class="panel-hd"><h2>学习统计</h2>
          <div class="hd-acts"><button class="mini danger" id="resetBtn">清空进度</button></div>
        </div>
        <div class="stats" id="statsBox"></div>
      </div>
    </div>
  </section>

  <!-- ======================= 结算 ======================= -->
  <section class="screen" id="screen-done">
    <div class="wrap narrow">

<script>
window.QUIZ_DATA = {"generatedAt":"2026-08-28","keywords":135,"subjects":[{"subject":"药理学","chapters":[{"label":"第一章","questions":[{"id":"2911bf7270","no":1,"q":"药理学 (pharmacology)","a":"\u003cdiv class=\"q-ln\"\u003e是研究药物与机体（含病原体）之间相互作用及作用规律的学科。\u003c/div\u003e","pt":"是研究药物与机体（含病原体）之间相互作用及作用规律的学科。","ok":true,"kw":[]},{"id":"a8d5d6c014","no":2,"q":"药效学 (pharmacodynamics)","a":"\u003cdiv class=\"q-ln\"\u003e是研究药物对机体的作用及其机制的学科。\u003c/div\u003e","pt":"是研究药物对机体的作用及其机制的学科。","ok":true,"kw":[]},{"id":"dc91ba0e73","no":3,"q":"药动学 (pharmacokinetics)","a":"\u003cdiv class=\"q-ln\"\u003e是研究机体对药物的吸收、分布、代谢和排泄过程及规律的学科，并运用数学原理和动力学模型研究体内药物浓度随时间变化的规律。\u003c/div\u003e","pt":"是研究机体对药物的吸收、分布、代谢和排泄过程及规律的学科，并运用数学原理和动力学模型研究体内药物浓度随时间变化的规律。","ok":true,"kw":["动力学"]},{"id":"d967826b5c","no":4,"q":"安慰剂","a":"\u003cdiv class=\"q-ln\"\u003e是不含活性药物但又暗示某种效应的制剂，在颜色、形态、外观等方面与某种活性药物或受试药物相同。（在受试药物对照试验中作为对照，以消除受试药物安慰剂效应对实验结果的影响。）\u003c/div\u003e","pt":"是不含活性药物但又暗示某种效应的制剂，在颜色、形态、外观等方面与某种活性药物或受试药物相同。（在受试药物对照试验中作为对照，以消除受试药物安慰剂效应对实验结果的影响。）","ok":true,"kw":["安慰剂"]},{"id":"4ff147fc0c","no":5,"q":"举例说明药物、食物与毒物的关系","a":"\u003cdiv class=\"q-ln\"\u003e① 药物、食物和毒物间并无绝对界限。如食盐、葡萄糖、维生素都是食物中的成分，但在人体缺乏上述物质时，生理盐水、葡萄糖注射液、维生素等就成了药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 任何药物摄入过量都会引起毒性反应，如对于充血性心力衰竭的患者，过量摄入食盐或生理盐水都可能会加重病情，甚至危及生命。因此药物、食物和毒物之间只有剂量的区别。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e（③ 食物摄入过量也可能引起毒性反应，如前面提到的食盐，以及对于糖尿病患者，若过量摄入葡萄糖也可能加重病情。）\u003c/div\u003e","pt":"① 药物、食物和毒物间并无绝对界限。如食盐、葡萄糖、维生素都是食物中的成分，但在人体缺乏上述物质时，生理盐水、葡萄糖注射液、维生素等就成了药物。 ② 任何药物摄入过量都会引起毒性反应，如对于充血性心力衰竭的患者，过量摄入食盐或生理盐水都可能会加重病情，甚至危及生命。因此药物、食物和毒物之间只有剂量的区别。 （③ 食物摄入过量也可能引起毒性反应，如前面提到的食盐，以及对于糖尿病患者，若过量摄入葡萄糖也可能加重病情。）","ok":true,"kw":["心力衰竭","葡萄糖","维生素","注射液"]},{"id":"b4a67b030d","no":6,"q":"简述药理学在新药研究与开发中的作用","a":"\u003cdiv class=\"q-ln\"\u003e① 新药先导化合物的确定有赖于药理学活性筛选。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 药理学研究可阐明药物的构效关系，后者可指导新药的合成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 新药的临床前药理研究的结果（包括药效学、药动学、一般药理学、毒理学资料等）是新药申请临床试验时的重要审批依据。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ Ⅰ至Ⅳ期临床试验是临床药理学的重要任务，决定新药能否上市销售，并指导上市后的合理用药。\u003c/div\u003e","pt":"① 新药先导化合物的确定有赖于药理学活性筛选。 ② 药理学研究可阐明药物的构效关系，后者可指导新药的合成。 ③ 新药的临床前药理研究的结果（包括药效学、药动学、一般药理学、毒理学资料等）是新药申请临床试验时的重要审批依据。 ④ Ⅰ至Ⅳ期临床试验是临床药理学的重要任务，决定新药能否上市销售，并指导上市后的合理用药。","ok":true,"kw":["先导化合物","构效关系","药理学","药效学","药动学"]}],"count":6,"done":6},{"label":"第二章","questions":[{"id":"9d54a29e89","no":1,"q":"药物的跨膜转运方式有哪些？主动转运和被动转运各有哪些特点？在药物转运中，哪种方式的转运最多见？","a":"\u003cdiv class=\"q-ln\"\u003e① 药物的转运方式包括: 被动转运、主动转运、膜动转运。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 被动转运包括: 简单扩散、易化扩散。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e简单扩散的特点: 1.不需要消耗能量；2.不需要载体；3.无饱和现象；4.无竞争性抑制现象。（5.顺浓度梯度）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e易化扩散的特点: 1.不需要消耗能量；2.需要载体；3.有饱和现象；4.有竞争性抑制现象。（5.顺浓度梯度）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 主动转运包括：原发性主动转运、继发性主动转运。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e主动转运的特点: 1.需要消耗能量；2.需要载体；3.有饱和现象；4.有竞争性抑制现象。（5.逆浓度梯度）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 膜动转运包括：胞饮、胞吐。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e膜动转运的特点：1.需要消耗能量；2.有膜变形。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 药物转运中最常见的方式是简单扩散中的脂溶扩散。\u003c/div\u003e","pt":"① 药物的转运方式包括: 被动转运、主动转运、膜动转运。 ② 被动转运包括: 简单扩散、易化扩散。 简单扩散的特点: 1.不需要消耗能量；2.不需要载体；3.无饱和现象；4.无竞争性抑制现象。（5.顺浓度梯度） 易化扩散的特点: 1.不需要消耗能量；2.需要载体；3.有饱和现象；4.有竞争性抑制现象。（5.顺浓度梯度） ③ 主动转运包括：原发性主动转运、继发性主动转运。 主动转运的特点: 1.需要消耗能量；2.需要载体；3.有饱和现象；4.有竞争性抑制现象。（5.逆浓度梯度） ④ 膜动转运包括：胞饮、胞吐。 膜动转运的特点：1.需要消耗能量；2.有膜变形。 ⑤ 药物转运中最常见的方式是简单扩散中的脂溶扩散。","ok":true,"kw":[]},{"id":"c1efd2367e","no":2,"q":"什么是一级和零级动力学？各有哪些特点？为什么会发生零级动力学？","a":"\u003cdiv class=\"q-ln\"\u003e① 一级动力学过程: 在体内某部位药物的转运速率与该部位药物量或浓度的一次方成正比，即单位时间内药物按一定比例转运。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 一级动力学过程特点: 1.药物转运浓度呈指数衰减，每单位时间内转运的百分比不变，即等比转运，但单位时间内药物的转运量随时间而下降；2.半衰期、总体清除率恒定，与药物剂量或浓度无关；3.AUC与给药的单一剂量成正比。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 零级动力学过程: 在体内某部位药物的转运速率与该部位药物量或浓度的零次方成正比，即单位时间内转运的药物量不变。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 零级动力学过程的特点: 1.转运速率与剂量或浓度无关，按恒量转运，即等量转运，但每单位时间内转运的百分比是可变的；2.半衰期、总体清除率不恒定，剂量加大，半衰期可超比例延长，总体清除率可超比例减少；3.AUC与给药的单一剂量不成正比，给药剂量增加，其面积可超比例增加。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 发生零级动力学过程的原因是药物转运体、药物代谢酶、血浆蛋白与药物的结合等的饱和。\u003c/div\u003e","pt":"① 一级动力学过程: 在体内某部位药物的转运速率与该部位药物量或浓度的一次方成正比，即单位时间内药物按一定比例转运。 ② 一级动力学过程特点: 1.药物转运浓度呈指数衰减，每单位时间内转运的百分比不变，即等比转运，但单位时间内药物的转运量随时间而下降；2.半衰期、总体清除率恒定，与药物剂量或浓度无关；3.AUC与给药的单一剂量成正比。 ③ 零级动力学过程: 在体内某部位药物的转运速率与该部位药物量或浓度的零次方成正比，即单位时间内转运的药物量不变。 ④ 零级动力学过程的特点: 1.转运速率与剂量或浓度无关，按恒量转运，即等量转运，但每单位时间内转运的百分比是可变的；2.半衰期、总体清除率不恒定，剂量加大，半衰期可超比例延长，总体清除率可超比例减少；3.AUC与给药的单一剂量不成正比，给药剂量增加，其面积可超比例增加。 ⑤ 发生零级动力学过程的原因是药物转运体、药物代谢酶、血浆蛋白与药物的结合等的饱和。","ok":true,"kw":["动力学","半衰期"]},{"id":"e7ebe72906","no":3,"q":"药物经代谢后会产生哪些结果，有什么临床意义？","a":"\u003cdiv class=\"q-ln\"\u003e① 有些药物代谢后，代谢产物活性减弱或消失，称为失活。如局麻药普鲁卡因在体内因酯键水解而失活；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 有些药物代谢后，代谢产物才具有活性或活性增强，称为活化。如镇痛药可待因，在体内去甲基后生成镇痛作用更强的吗啡；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 很多药物经代谢后，代谢产物水溶性增强，更容易从胆汁或肾脏排泄，且代谢产物常失去药理活性，起到了消除和解毒的作用；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 有些药物本身无毒性或毒性很小，但在体内经代谢后，生成的有毒性的代谢产物。如乙醇在体内代谢为毒性更强的乙醛，对乙酰氨基酚在细胞色素P450催化下代谢为有肝毒性的N-乙酰对苯醌亚胺。因此代谢所产生的结果是复杂的，不能简单的理解为解毒过程。\u003c/div\u003e","pt":"① 有些药物代谢后，代谢产物活性减弱或消失，称为失活。如局麻药普鲁卡因在体内因酯键水解而失活； ② 有些药物代谢后，代谢产物才具有活性或活性增强，称为活化。如镇痛药可待因，在体内去甲基后生成镇痛作用更强的吗啡； ③ 很多药物经代谢后，代谢产物水溶性增强，更容易从胆汁或肾脏排泄，且代谢产物常失去药理活性，起到了消除和解毒的作用； ④ 有些药物本身无毒性或毒性很小，但在体内经代谢后，生成的有毒性的代谢产物。如乙醇在体内代谢为毒性更强的乙醛，对乙酰氨基酚在细胞色素P450催化下代谢为有肝毒性的N-乙酰对苯醌亚胺。因此代谢所产生的结果是复杂的，不能简单的理解为解毒过程。","ok":true,"kw":["水溶性"]},{"id":"39b28c707d","no":4,"q":"何谓酶的诱导和酶的抑制？药物经酶的诱导和酶的抑制后分别会产生什么后果？","a":"\u003cdiv class=\"q-ln\"\u003e① 有些化学物质能提高肝药酶的活性，从而提到代谢速率，这种现象称为酶的诱导。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 酶的诱导可产生两种临床后果:1.使治疗效果减弱: 由于肝药酶诱导后代谢速率增强，药物代谢速率加快，血药浓度降低，从而使得治疗效果减弱。如苯巴比妥是一种酶诱导剂，能加速华法林的代谢，降低抗凝效果；2.使治疗效果增强，甚至产生毒性反应，主要是那些在体内活化或代谢物有毒性的药物。如乙醇是肝CYP2E1的酶诱导剂，长期饮酒可增加对乙酰氨基酚的肝毒性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 有些化学物质能抑制肝药酶的活性，从而降低代谢速率，这种现象称为酶的抑制。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 酶的抑制也可产生两种临床后果:1. 使治疗效果减弱: 主要是对那些在体内活化的药物，这些药物在酶被抑制后，活性代谢产物生成速率降低，疗效降低。如可待因在酶抑制后其产生活性代谢产物吗啡的速率降低，活性减小；2.使治疗效果增强：指那些在体内代谢后失活的药物，在酶抑制后，代谢速率降低，作用增强，甚至产生毒性反应。如酮康唑是CYP3A4的竞争性抑制剂，当被同酶催化的特非那定合用时，可导致特非那定代谢速率明显减慢，血药浓度明显增加，可诱发致命的心律失常。\u003c/div\u003e","pt":"① 有些化学物质能提高肝药酶的活性，从而提到代谢速率，这种现象称为酶的诱导。 ② 酶的诱导可产生两种临床后果:1.使治疗效果减弱: 由于肝药酶诱导后代谢速率增强，药物代谢速率加快，血药浓度降低，从而使得治疗效果减弱。如苯巴比妥是一种酶诱导剂，能加速华法林的代谢，降低抗凝效果；2.使治疗效果增强，甚至产生毒性反应，主要是那些在体内活化或代谢物有毒性的药物。如乙醇是肝CYP2E1的酶诱导剂，长期饮酒可增加对乙酰氨基酚的肝毒性。 ③ 有些化学物质能抑制肝药酶的活性，从而降低代谢速率，这种现象称为酶的抑制。 ④ 酶的抑制也可产生两种临床后果:1. 使治疗效果减弱: 主要是对那些在体内活化的药物，这些药物在酶被抑制后，活性代谢产物生成速率降低，疗效降低。如可待因在酶抑制后其产生活性代谢产物吗啡的速率降低，活性减小；2.使治疗效果增强：指那些在体内代谢后失活的药物，在酶抑制后，代谢速率降低，作用增强，甚至产生毒性反应。如酮康唑是CYP3A4的竞争性抑制剂，当被同酶催化的特非那定合用时，可导致特非那定代谢速率明显减慢，血药浓度明显增加，可诱发致命的心律失常。","ok":true,"kw":["治疗效果","肝药酶","心律失常","巴比妥"]},{"id":"95c221c63a","no":5,"q":"肝肠循环","a":"\u003cdiv class=\"q-ln\"\u003e由胆汁排入十二指肠的药物通过粪便排出体外，但也有些药物再经肠黏膜上皮细胞吸收，通过门静脉入肝，重新进入体循环，这个反复循环的过程称为肝肠循环。\u003c/div\u003e","pt":"由胆汁排入十二指肠的药物通过粪便排出体外，但也有些药物再经肠黏膜上皮细胞吸收，通过门静脉入肝，重新进入体循环，这个反复循环的过程称为肝肠循环。","ok":true,"kw":["肝肠循环"]},{"id":"4376c134ff","no":6,"q":"吸收、分布、代谢、排泄过程中药物相互作用？","a":"\u003cdiv class=\"q-ln\"\u003e① 吸收: 1.胃肠pH；2.吸收功能 3.胃排空速度及肠蠕动；4.离子作用；5.间接作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 分布: 药物与血浆蛋白结合的竞争性抑制现象: 联合用药时，不同药物与血浆蛋白的结合可能发生相互竞争，使某些药物游离型增加，药理作用增强，出现中毒反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 代谢: 见酶的诱导和酶的抑制。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 排泄: 肾小管分泌: 肾小管分泌具有主动转运的特点。分泌机制相同的两药合用，可发生竞争性抑制，丙磺舒与青霉素合用时，青霉素血浆浓度升高、疗效增强的原因是因为丙磺舒竞争性的抑制了肾小管上皮细胞有机阴离子转运体，从而抑制了青霉素的分泌，提高了青霉素的血药浓度，使其疗效增强。\u003c/div\u003e","pt":"① 吸收: 1.胃肠pH；2.吸收功能 3.胃排空速度及肠蠕动；4.离子作用；5.间接作用。 ② 分布: 药物与血浆蛋白结合的竞争性抑制现象: 联合用药时，不同药物与血浆蛋白的结合可能发生相互竞争，使某些药物游离型增加，药理作用增强，出现中毒反应。 ③ 代谢: 见酶的诱导和酶的抑制。 ④ 排泄: 肾小管分泌: 肾小管分泌具有主动转运的特点。分泌机制相同的两药合用，可发生竞争性抑制，丙磺舒与青霉素合用时，青霉素血浆浓度升高、疗效增强的原因是因为丙磺舒竞争性的抑制了肾小管上皮细胞有机阴离子转运体，从而抑制了青霉素的分泌，提高了青霉素的血药浓度，使其疗效增强。","ok":true,"kw":["青霉素"]},{"id":"54f7f29e2b","no":7,"q":"半衰期的临床意义？","a":"\u003cdiv class=\"q-ln\"\u003e① 有助于设计最佳给药间隔；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 可预计停药后药物从体内的消除时间；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 可预计连续给药到达稳态血药浓度的时间。\u003c/div\u003e","pt":"① 有助于设计最佳给药间隔； ② 可预计停药后药物从体内的消除时间； ③ 可预计连续给药到达稳态血药浓度的时间。","ok":true,"kw":[]},{"id":"4e835b010b","no":8,"q":"稳态血药浓度Css","a":"\u003cdiv class=\"q-ln\"\u003e在临床药物治疗中，很多药物都是通过重复给药以达到有效治疗浓度。若按固定时间间隔给予固定的药物剂量，每次给药时都有前次给药的存留量，多次给药将形成多次蓄积。随着给药次数的增加，体内总药量的蓄积率逐渐减慢，至在给药间隔内消除的药量等于给药量时，达到平衡，此时的血药浓度称为稳态血药浓度。\u003c/div\u003e","pt":"在临床药物治疗中，很多药物都是通过重复给药以达到有效治疗浓度。若按固定时间间隔给予固定的药物剂量，每次给药时都有前次给药的存留量，多次给药将形成多次蓄积。随着给药次数的增加，体内总药量的蓄积率逐渐减慢，至在给药间隔内消除的药量等于给药量时，达到平衡，此时的血药浓度称为稳态血药浓度。","ok":true,"kw":[]}],"count":8,"done":8},{"label":"第三章","questions":[{"id":"196617a3b1","no":1,"q":"受体","a":"","pt":"","ok":false,"kw":[]},{"id":"2f3bef82f9","no":2,"q":"副作用","a":"","pt":"","ok":false,"kw":[]},{"id":"3457b7836d","no":3,"q":"二重感染","a":"\u003cdiv class=\"q-ln\"\u003e长期口服或注射广谱抗菌药时，敏感菌被抑制，不敏感菌乘机大量繁殖，由原来的劣势菌群变为优势菌群，造成新的感染，称作二重感染。\u003c/div\u003e","pt":"长期口服或注射广谱抗菌药时，敏感菌被抑制，不敏感菌乘机大量繁殖，由原来的劣势菌群变为优势菌群，造成新的感染，称作二重感染。","ok":true,"kw":["二重感染","抗菌药"]},{"id":"9613e7e37c","no":4,"q":"后移效应","a":"","pt":"","ok":false,"kw":[]},{"id":"5898f5a8ba","no":5,"q":"竞争性拮抗药","a":"","pt":"","ok":false,"kw":[]},{"id":"983e666674","no":6,"q":"非竞争性拮抗药","a":"","pt":"","ok":false,"kw":[]},{"id":"1308b8536c","no":7,"q":"简述受体的基本特性。","a":"","pt":"","ok":false,"kw":[]},{"id":"c4219a7abf","no":8,"q":"试述药物作用的主要机制。","a":"","pt":"","ok":false,"kw":[]},{"id":"32bd0d8834","no":9,"q":"激动药","a":"","pt":"","ok":false,"kw":[]},{"id":"b93443f9b6","no":10,"q":"部分激动药","a":"","pt":"","ok":false,"kw":[]},{"id":"ec19b29ba4","no":11,"q":"反向激动药","a":"","pt":"","ok":false,"kw":[]}],"count":11,"done":1},{"label":"第四章","questions":[{"id":"9503a4680d","no":1,"q":"乙酰胆碱是如何从胆碱能神经末梢释放的？","a":"","pt":"","ok":false,"kw":[]},{"id":"c1e39b7d63","no":2,"q":"胆碱受体有几种亚型，主要分布在何处？","a":"","pt":"","ok":false,"kw":[]},{"id":"dbcbd8629d","no":3,"q":"肾上腺素受体有几种亚型，主要分布在何处？","a":"","pt":"","ok":false,"kw":[]},{"id":"bf6cb0c40e","no":4,"q":"传出神经系统药物的作用方式有哪些？","a":"","pt":"","ok":fal 作用或副作用。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗精神病作用: 阻断中脑-边缘系统和中脑-皮质通路的D\u003csub\u003e2\u003c/sub\u003e样受体发挥抗精神病作用，精神病患者用药后，可迅速控制兴奋躁动，如继续用药可使幻觉、妄想等逐渐消失，理智恢复，情绪安定，生活自理。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 对内分泌的影响: 阻断结节-漏斗多巴胺通路的D\u003csub\u003e2\u003c/sub\u003e样受体，影响下丘脑多种激素的分泌，如抑制ACh释放，使糖皮质激素减少，以及抑制垂体生长激素分泌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 锥体外系反应: 阻断黑质-纹状体通路D\u003csub\u003e2\u003c/sub\u003e样受体，使纹状体多巴胺功能减弱，而引起药源性帕金森综合征、静坐不能、急性肌张力障碍。\u003c/div\u003e","pt":"① 抗精神病作用: 阻断中脑-边缘系统和中脑-皮质通路的D 2 样受体发挥抗精神病作用，精神病患者用药后，可迅速控制兴奋躁动，如继续用药可使幻觉、妄想等逐渐消失，理智恢复，情绪安定，生活自理。 ② 对内分泌的影响: 阻断结节-漏斗多巴胺通路的D 2 样受体，影响下丘脑多种激素的分泌，如抑制ACh释放，使糖皮质激素减少，以及抑制垂体生长激素分泌。 ③ 锥体外系反应: 阻断黑质-纹状体通路D 2 样受体，使纹状体多巴胺功能减弱，而引起药源性帕金森综合征、静坐不能、急性肌张力障碍。","ok":true,"kw":["糖皮质激素"]},{"id":"66ded27fb7","no":2,"q":"简述氯丙嗪抗精神病作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e氯丙嗪抗精神分裂症作用机制与该药阻断中脑-边缘系统和中脑-皮质通路的D\u003csub\u003e2\u003c/sub\u003e样受体有关。此外，氯丙嗪对中枢胆碱受体、肾上腺素受体、组胺受体和5-HT受体也有一定的阻断作用，从而产生较强的抗精神病作用。\u003c/div\u003e","pt":"氯丙嗪抗精神分裂症作用机制与该药阻断中脑-边缘系统和中脑-皮质通路的D 2 样受体有关。此外，氯丙嗪对中枢胆碱受体、肾上腺素受体、组胺受体和5-HT受体也有一定的阻断作用，从而产生较强的抗精神病作用。","ok":true,"kw":["精神分裂症","胆碱受体","氯丙嗪","肾上腺素","作用机制"]},{"id":"9eb9888322","no":3,"q":"试述氯丙嗪药理作用与临床应用。","a":"\u003cdiv class=\"q-ln\"\u003e\u003cspan style=color:red;\u003e药理作用:\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e对中枢神经系统的影响:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 抗精神分裂症作用: 患者用药后可迅速控制兴奋躁动状态，大剂量连续用药后幻觉、妄想、躁动及精神运动性兴奋逐渐消失，理智恢复，生活自理。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 镇吐作用: 小剂量选择性阻断延髓催吐化学感受区的D\u003csub\u003e2\u003c/sub\u003e受体，大剂量直接抑制呕吐中枢。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 对体温调节的作用: 抑制下丘脑体温调节中枢，使体温调节失灵，不仅降低发热患者的体温，也可降低正常人的体温。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e对自主神经系统的影响:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 阻断α受体致血管扩张和血压下降，但由于连续用药产生耐受性，且副作用较多，不宜用于高血压的治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 阻断M受体，引起口干、便秘、尿潴留和视力模糊等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e对内分泌的影响:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 阻断结节-漏斗多巴胺通路D\u003csub\u003e2\u003c/sub\u003e样受体，影响下丘脑多种激素分泌，如: 抑制ACh释放，使糖皮质激素减少；抑制垂体生长激素的分泌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e\u003cspan style=color:red;\u003e临床应用:\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e精神分裂症: 主要治疗精神分裂症阳性症状，对阴性症状无效甚至加重病情。也可用于治疗双相障碍的狂躁症状及其他精神病伴有的兴奋躁动、紧张和妄想等症状。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e呕吐和顽固性呃逆: 对多种药物和疾病（除晕动症外）引起的呕吐都有效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e人工冬眠: 与哌替啶、异丙嗪等中枢抑制药组成冬眠合剂，使患者处于深睡状态。\u003c/div\u003e","pt":"药理作用: 对中枢神经系统的影响: ① 抗精神分裂症作用: 患者用药后可迅速控制兴奋躁动状态，大剂量连续用药后幻觉、妄想、躁动及精神运动性兴奋逐渐消失，理智恢复，生活自理。 ② 镇吐作用: 小剂量选择性阻断延髓催吐化学感受区的D 2 受体，大剂量直接抑制呕吐中枢。 ③ 对体温调节的作用: 抑制下丘脑体温调节中枢，使体温调节失灵，不仅降低发热患者的体温，也可降低正常人的体温。 对自主神经系统的影响: ① 阻断α受体致血管扩张和血压下降，但由于连续用药产生耐受性，且副作用较多，不宜用于高血压的治疗。 ② 阻断M受体，引起口干、便秘、尿潴留和视力模糊等。 对内分泌的影响: ① 阻断结节-漏斗多巴胺通路D 2 样受体，影响下丘脑多种激素分泌，如: 抑制ACh释放，使糖皮质激素减少；抑制垂体生长激素的分泌。 临床应用: 精神分裂症: 主要治疗精神分裂症阳性症状，对阴性症状无效甚至加重病情。也可用于治疗双相障碍的狂躁症状及其他精神病伴有的兴奋躁动、紧张和妄想等症状。 呕吐和顽固性呃逆: 对多种药物和疾病（除晕动症外）引起的呕吐都有效。 人工冬眠: 与哌替啶、异丙嗪等中枢抑制药组成冬眠合剂，使患者处于深睡状态。","ok":true,"kw":["中枢神经系统","精神分裂症","糖皮质激素","人工冬眠","副作用","组成","选择性"]},{"id":"0330ac3f11","no":4,"q":"锥体外系反应的主要表现是什么？为何氯丙嗪长期大量用药会出现锥体外系反应？","a":"\u003cdiv class=\"q-ln\"\u003e① 主要表现: 1.药源性帕金森综合征；2.静坐不能；3.急性肌张力障碍；4.迟发性运动障碍。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 原因: 前三种是由于氯丙嗪阻断黑质-纹状体通路D\u003csub\u003e2\u003c/sub\u003e样受体，使纹状体多巴胺功能减弱所致。第四种是由于突触后膜多巴胺受体长期被阻断，多巴胺受体数目增加，即向上调节，从而使黑质-纹状体多巴胺功能相对增强。\u003c/div\u003e","pt":"① 主要表现: 1.药源性帕金森综合征；2.静坐不能；3.急性肌张力障碍；4.迟发性运动障碍。 ② 原因: 前三种是由于氯丙嗪阻断黑质-纹状体通路D 2 样受体，使纹状体多巴胺功能减弱所致。第四种是由于突触后膜多巴胺受体长期被阻断，多巴胺受体数目增加，即向上调节，从而使黑质-纹状体多巴胺功能相对增强。","ok":true,"kw":["氯丙嗪"]},{"id":"a8560b7f51","no":5,"q":"氯丙嗪过量或中毒所致血压下降，为什么不能用肾上腺素急救？","a":"\u003cdiv class=\"q-ln\"\u003e因为氯丙嗪会拮抗α\u003csub\u003e1\u003c/sub\u003e受体，而肾上腺素能激动α和β受体，若用肾上腺素急救，氯丙嗪拮抗α\u003csub\u003e1\u003c/sub\u003e受体会导致肾上腺素对血管β\u003csub\u003e2\u003c/sub\u003e受体表现出激动作用，舒张血管平滑肌，肾上腺素的升压作用翻转为降压，加重低血压症状，故不能用肾上腺素急救。\u003c/div\u003e","pt":"因为氯丙嗪会拮抗α 1 受体，而肾上腺素能激动α和β受体，若用肾上腺素急救，氯丙嗪拮抗α 1 受体会导致肾上腺素对血管β 2 受体表现出激动作用，舒 /sub\u003e合成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e临床应用: 高血压、心绞痛、心肌梗死、心力衰竭。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e禁忌证: 禁用于严重心动过缓、支气管哮喘患者。\u003c/div\u003e","pt":"抗高血压机制: ① 拮抗心肌β 1 受体，降低心输出量。 ② 拮抗肾小球旁器β 1 受体，减少肾素分泌，降低RAS系统活性。 ③ 一些β受体拮抗药能通过血脑屏障进入中枢，拮抗中枢β受体，从而降低外周交感神经活性。 ④ 拮抗外周去甲肾上腺素能神经末梢突触前膜β 2 受体，抑制正反馈调节作用，从而减少去甲肾上腺素释放。 ⑤ 促进PGI 2 合成。 临床应用: 高血压、心绞痛、心肌梗死、心力衰竭。 禁忌证: 禁用于严重心动过缓、支气管哮喘患者。","ok":true,"kw":["心力衰竭","神经末梢","交感神经","心绞痛","肾上腺素","受体拮抗药"]},{"id":"a777a63e93","no":6,"q":"血管扩张药的主要不良反应有哪些？如何纠正？","a":"\u003cdiv class=\"q-ln\"\u003e① 激活交感神经，使心肌收缩力加强、心率加快，从而增加心肌耗氧量，易诱发心绞痛；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 交感神经兴奋可致肾素释放增加，激活RAS系统，导致循环中血管紧张素含量增加，从而使血压上升，减弱其降压效果。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e防止措施：可合用利尿药或β受体拮抗药来加以纠正。\u003c/div\u003e","pt":"① 激活交感神经，使心肌收缩力加强、心率加快，从而增加心肌耗氧量，易诱发心绞痛； ② 交感神经兴奋可致肾素释放增加，激活RAS系统，导致循环中血管紧张素含量增加，从而使血压上升，减弱其降压效果。 防止措施：可合用利尿药或β受体拮抗药来加以纠正。","ok":true,"kw":["血管紧张素","交感神经","心绞痛","受体拮抗药","利尿药"]}],"count":6,"done":6},{"label":"第十八章","questions":[{"id":"fe423aa796","no":1,"q":"详述抗心律失常药物的分类，并各举一代表药。","a":"\u003cdiv class=\"q-ln\"\u003eⅠ类: 钠通道阻滞药\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① Ⅰa 类 适度阻滞钠通道。如: 奎尼丁。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② Ⅰb 类 轻度阻滞钠通道。如: 利多卡因。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ Ⅰc 类 明显阻滞钠通道。如: 普罗帕酮。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003eⅡ类: β受体拮抗药。如: 普萘洛尔。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003eⅢ类: 延长动作电位时程药。如: 胺碘酮。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003eⅣ类: 钙通道阻滞药。如: 维拉帕米。\u003c/div\u003e","pt":"Ⅰ类: 钠通道阻滞药 ① Ⅰa 类 适度阻滞钠通道。如: 奎尼丁。 ② Ⅰb 类 轻度阻滞钠通道。如: 利多卡因。 ③ Ⅰc 类 明显阻滞钠通道。如: 普罗帕酮。 Ⅱ类: β受体拮抗药。如: 普萘洛尔。 Ⅲ类: 延长动作电位时程药。如: 胺碘酮。 Ⅳ类: 钙通道阻滞药。如: 维拉帕米。","ok":true,"kw":["钙通道阻滞药","受体拮抗药"]}],"count":1,"done":1},{"label":"第十九章","questions":[{"id":"e675bff771","no":1,"q":"β受体拮抗药可用于哪种功能的心衰？为什么能改善心功能？","a":"\u003cdiv class=\"q-ln\"\u003e可用于慢性心力衰竭。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e改善心功能的机制:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 改善心室功能，纠正由于交感神经支配不均造成的室壁局 : 多巴胺；2.磷酸二酯酶抑制药: 米力农；3.钙增敏药: 左西孟旦\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e其他药物:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 钠-葡萄糖共转运蛋白2抑制药: 达格列净\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 可溶性鸟苷酸环化酶激动药: 维立西呱\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗心律失常药: 伊伐布雷定\u003c/div\u003e","pt":"神经-内分泌系统抑制药: Ⅰ RAS系统抑制药: ① ACEI: 卡托普利 ② ARB: 缬沙坦 ③ 血管紧张素受体-脑啡肽酶抑制药: 沙库巴曲缬沙坦 ④ 醛固酮受体拮抗药: 螺内酯 Ⅱ β受体拮抗药: 美托洛尔 减轻心脏负荷药: ① 利尿药: 氢氯噻嗪 ② 血管扩张药: 硝普钠 正性肌力药: ① 强心苷类: 地高辛 ② 其他正性肌力药: 1.β受体激动药: 多巴胺；2.磷酸二酯酶抑制药: 米力农；3.钙增敏药: 左西孟旦 其他药物: ① 钠-葡萄糖共转运蛋白2抑制药: 达格列净 ② 可溶性鸟苷酸环化酶激动药: 维立西呱 ③ 抗心律失常药: 伊伐布雷定","ok":true,"kw":["血管紧张素","心律失常","醛固酮","激动药","葡萄糖","受体拮抗药","利尿药"]},{"id":"8e15b95ee9","no":4,"q":"强心苷类正性肌力作用的机制是什么？","a":"\u003cdiv class=\"q-ln\"\u003e强心苷类药物通过抑制心肌细胞膜上的Na\u003csup\u003e+\u003c/sup\u003e-K\u003csup\u003e+\u003c/sup\u003e-ATP酶，使Na\u003csup\u003e+\u003c/sup\u003e在细胞内积聚，促进Na\u003csup\u003e+\u003c/sup\u003e-Ca\u003csup\u003e2+\u003c/sup\u003e交换，升高细胞内Ca\u003csup\u003e2+\u003c/sup\u003e浓度而增强心肌收缩力。\u003c/div\u003e","pt":"强心苷类药物通过抑制心肌细胞膜上的Na + -K + -ATP酶，使Na + 在细胞内积聚，促进Na + -Ca 2+ 交换，升高细胞内Ca 2+ 浓度而增强心肌收缩力。","ok":true,"kw":["细胞膜"]},{"id":"445fb8bbb2","no":5,"q":"试述强心苷治疗心房纤颤和心房扑动的药理依据。","a":"\u003cdiv class=\"q-ln\"\u003e① 心房纤颤: 强心苷类通过减慢房室传导，阻止过多冲动传入心室，从而减慢心室率，改善心室泵血功能。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 心房扑动: 缩短心房不应期，使扑动变为颤动。\u003c/div\u003e","pt":"① 心房纤颤: 强心苷类通过减慢房室传导，阻止过多冲动传入心室，从而减慢心室率，改善心室泵血功能。 ② 心房扑动: 缩短心房不应期，使扑动变为颤动。","ok":true,"kw":[]},{"id":"cbdc94f6eb","no":6,"q":"简述强心苷的不良反应及中毒的防治措施。","a":"\u003cdiv class=\"q-ln\"\u003e不良反应:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 胃肠道反应: 为常见的早期反应，表现为厌食、恶心、呕吐、腹泻。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 中枢神经系统反应: 眩晕、头疼、疲倦、失眠、谵妄，以及视觉障碍。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 心脏反应: 1.快速型心律失常；2.房室传导阻滞；3.窦性心动过缓。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e防治措施:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 氯化钾: 快速型心律失常应及时补钾。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 苯妥英钠: 对强心苷类引起的重症快速型心律失常，常用苯妥英钠救治。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 利多卡因: 解救强心苷类引起的严重室性心动过速和心室纤颤。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 阿托品: 对强心苷类引起的房室传导阻滞、窦性心动过缓、窦性停搏等，可采用阿托品静脉注射治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 地高辛抗体: 治疗严重危及生命的地高辛中毒。\u003c/div\u003e","pt":"不良反应: ① 胃肠道反应: 为常见的早期反应，表现为厌食、恶心、呕吐、腹泻。 ② 中枢神经系统反应: 眩晕、头疼、疲倦、失眠、谵妄，以及视觉障碍。 ③ 心脏反应: 1.快速型心律失常；2.房室传导阻滞；3.窦性心动过缓。 防治措施: ① 氯化钾: 快速型心律失常应及时补钾。 ② 苯妥英钠: 对强心苷类引起的重症快速型心律失常，常用苯妥英钠救治。 ③ 利多卡因: 解救强心苷类引起的严重室性心动过速和心室纤颤。 ④ 阿托品: 对强心苷类引起的房室传导阻滞、窦性心动过缓、窦性停搏等，可采用阿托品静脉注射治疗。 ⑤ 地高辛抗体: 治疗严重危及生命的地高辛中毒。","ok":true,"kw":["中枢神经系统","心律失常","胃肠道"]},{"id":"b83e469ea1","no":7,"q":"治疗充血性心力衰竭选用强心苷而不用肾上腺素或异丙肾上腺素的原因是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 强心苷有正性肌力、负性频率作用，增加衰竭心脏的心肌收缩力和心输出量的同时，不增加甚至降低心肌耗氧量；心率减慢使舒张期延长，使有效回心血量升高，使心脏可以更加充分休息并获得更多的冠脉供血。因此，强心苷可有效缓解充血性心力衰竭患者的症状。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 而肾上腺素和异丙肾上腺素，虽对心脏β\u003csub\u003e1\u003c/sub\u003e受体有兴奋作用，可使心肌收缩力升高，心输出量升高，但同时心脏的兴奋性升高，心脏自律性升高，心率加快，并增加心肌耗氧量，反而导致心力衰竭加重和心律失常。\u003c/div\u003e","pt":"① 强心苷有正性肌力、负性频率作用，增加衰竭心脏的心肌收缩力和心输出量的同时，不增加甚至降低心肌耗氧量；心率减慢使舒张期延长，使有效回心血量升高，使心脏可以更加充分休息并获得更多的冠脉供血。因此，强心苷可有效缓解充血性心力衰竭患者的症状。 ② 而肾上腺素和异丙肾上腺素，虽对心脏β 1 受体有兴奋作用，可使心肌收缩力升高，心输出量升高，但同时心脏的兴奋性升高，心脏自律性升高，心率加快，并增加心肌耗氧量，反而导致心力衰竭加重和心律失常。","ok":true,"kw":["心力衰竭","心律失常","肾上腺素"]}],"count":7,"done":7},{"label":"第二十章","questions":[{"id":"5dab4c364d","no":1,"q":"简述硝酸酯类抗心绞痛作用的主要分子机制。","a":"\u003cdiv class=\"q-ln\"\u003e硝酸酯类在血管平滑肌细胞内代谢释放NO，后者与可溶性GC的血红素Fe\u003csup\u003e2+\u003c/sup\u003e结合，激活GC催化GTP生成cGMP，激活cGMP依赖的蛋白激酶，抑制胞外Ca\u003csup\u003e2+\u003c/sup\u003e内流与胞内Ca\u003csup\u003e2+\u003c/sup\u003e释放，降低胞内游离Ca\u003csup\u003e2+\u003c/sup\u003e浓度，使得肌球蛋白轻链去磷酸化而松弛血管平滑肌。\u003c/div\u003e","pt":"硝酸酯类在血管平滑肌细胞内代谢释放NO，后者与可溶性GC的血红素Fe 2+ 结合，激活GC催化GTP生成cGMP，激活cGMP依赖的蛋白激酶，抑制胞外Ca 2+ 内流与胞内Ca 2+ 释放，降低胞内游离Ca 2+ 浓度，使得肌球蛋白轻链去磷酸化而松弛血管平滑肌。","ok":true,"kw":["血管平滑肌","GMP"]},{"id":"8f6c1bef67","no":2,"q":"试述普萘洛尔与硝酸酯类或硝苯地平联合应用抗心绞痛的药理学基础。","a":"\u003cdiv class=\"q-ln\"\u003e① 普萘洛尔与硝酸酯类合用: 1.普萘洛尔可对抗硝酸甘油引起的反射性心率加快、心肌收缩力增强；2.硝酸酯类可缩小β受体拮抗药抑制心脏所致的心室容积增大、射血时间延长。3.可协同降低心肌耗氧量；4.各自用量减少，不良反应减少。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 普萘洛尔与硝苯地平合用: 1.普萘洛尔可抑制硝苯地平引起的反射性交感兴奋；2.硝苯地平可拮抗β受体拮抗药所致的血管收缩。3.可协同抗心绞痛。4.各自用量减少，不良反应减少。\u003c/div\u003e","pt":"① 普萘洛尔与硝酸酯类合用: 1.普萘洛尔可对抗硝酸甘油引起的反射性心率加快、心肌收缩力增强；2.硝酸酯类可缩小β受体拮抗药抑制心脏所致的心室容积增大、射血时间延长。3.可协同降低心肌耗氧量；4.各自用量减少，不良反应减少。 ② 普萘洛尔与硝苯地平合用: 1.普萘洛尔可抑制硝苯地平引起的反射性交感兴奋；2.硝苯地平可拮抗β受体拮抗药所致的血管收缩。3.可协同抗心绞痛。4.各自用量减少，不良反应减少。","ok":true,"kw":["心绞痛","受体拮抗药"]},{"id":"404a11bcf0","no":3,"q":"简述伊伐布雷定抗心绞痛的作用机制及应用。","a":"\u003cdiv class=\"q-ln\"\u003e① 作用机制: 选择性抑制窦房结的I\u003csub\u003ef\u003c/sub\u003e起搏电流，降低窦房结节律，减慢心率，降低心肌耗氧量，从而减轻心绞痛症状、降低心绞痛发作频率。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 该药对心内传导、心肌收缩力和心室复极化无明显影响，适用于不能耐受β受体拮抗药的心绞痛患者，可降低心肌梗死的风险。\u003c/div\u003e","pt":"① 作用机制: 选择性抑制窦房结的I f 起搏电流，降低窦房结节律，减慢心率，降低心肌耗氧量，从而减轻心绞痛症状、降低心绞痛发作频率。 ② 应用: 该药对心内传导、心肌收缩力和心室复极化无明显影响，适用于不能耐受β受体拮抗药的心绞痛患者，可降低心肌梗死的风险。","ok":true,"kw":["心绞痛","作用机制","受体拮抗药","选择性"]},{"id":"8285fa53dd","no":4,"q":"维拉帕米不能和β受体拮抗药合用的原因？","a":"\u003cdiv class=\"q-ln\"\u003e维拉帕米为钙通道阻滞药，对心脏的选择性大于血管，抑制窦房结自律性和房室结传导，减慢心率，抑制心肌收缩力，使心肌耗氧量降低，对心脏的抑制作用强。不宜与β受体拮抗药合用，以免诱发严重的心动过缓、房室传导阻滞及心力衰竭。\u003c/div\u003e","pt":"维拉帕米为钙通道阻滞药，对心脏的选择性大于血管，抑制窦房结自律性和房室结传导，减慢心率，抑制心肌收缩力，使心肌耗氧量降低，对心脏的抑制作用强。不宜与β受体拮抗药合用，以免诱发严重的心动过缓、房室传导阻滞及心力衰竭。","ok":true,"kw":["钙通道阻滞药","心力衰竭","受体拮抗药","选择性"]}],"count":4,"done":4},{"label":"第二十一章","questions":[{"id":"189b90a0ee","no":1,"q":"简述降血脂药主要包括哪几类？他们的代表药物。","a":"\u003cdiv class=\"q-ln\"\u003e① 他汀类: 洛伐他汀\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 胆汁酸结合树脂: 考来烯胺\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 胆固醇吸收抑制药: 依折麦布\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ PCSK9抑制药: 依洛尤单抗\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 贝特类: 非诺贝特\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 烟酸类: 烟酸\u003c/div\u003e","pt":"① 他汀类: 洛伐他汀 ② 胆汁酸结合树脂: 考来烯胺 ③ 胆固醇吸收抑制药: 依折麦布 ④ PCSK9抑制药: 依洛尤单抗 ⑤ 贝特类: 非诺贝特 ⑥ 烟酸类: 烟酸","ok":true,"kw":["胆固醇"]}],"count":1,"done":1},{"label":"第二十二章","questions":[{"id":"67a41781e5","no":1,"q":"为什么影响髓袢升支粗段的利尿药作用最强？而影响远曲小管及集合管重吸收的利尿药作用不强。","a":"\u003cdiv class=\"q-ln\"\u003e利尿药的作用强度大小取决于其抑制肾脏不同部位Na\u003csup\u003e+\u003c/sup\u003e重吸收程度的高低:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 髓袢升支髓质部和皮质部对肾小球滤过的Na\u003csup\u003e+\u003c/sup\u003e重吸收比例占20%\\~25%，髓袢升支皮质部占10%，但远曲小管和集合管对Na\u003csup\u003e+\u003c/sup\u003e重吸收比例仅为2%\\~5%。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抑制髓袢升支粗段髓质和皮质部Na\u003csup\u003e+\u003c/sup\u003e重吸收后，破坏了肾脏的浓缩功能和稀释功能，产生强大的利尿作用，而抑制远曲小管和集合管Na\u003csup\u003e+\u003c/sup\u003e重吸收后，则产生弱的利尿作用。\u003c/div\u003e","pt":"利尿药的作用强度大小取决于其抑制肾脏不同部位Na + 重吸收程度的高低: ① 髓袢升支髓质部和皮质部对肾小球滤过的Na + 重吸收比例占20%\\~25%，髓袢升支皮质部占10%，但远曲小管和集合管对Na + 重吸收比例仅为2%\\~5%。 ② 抑制髓袢升支粗段髓质和皮质部Na + 重吸收后，破坏了肾脏的浓缩功能和稀释功能，产生强大的利尿作用，而抑制远曲小管和集合管Na + 重吸收后，则产生弱的利尿作用。","ok":true,"kw":["利尿药"]},{"id":"69b8c6869a","no":2,"q":"简述噻嗪类利尿药的不良反应。","a":"\u003cdiv class=\"q-ln\"\u003e① 电解质紊乱: 低血钾、低血钠、低血镁、低氯性碱血症等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 高尿酸血症: 与其在近曲小管和尿酸竞争有机酸分泌途径有关。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 影响代谢: 可致糖尿病患者血糖升高，可能与其抑制胰岛素分泌及减少组织对葡萄糖利用有关。还可使血清胆固醇升高5%\\~15%，并升高血清低密度脂蛋白含量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 过敏反应: 本类药物与磺胺类药物有交叉过敏反应。可见皮疹、皮炎等，偶见严重过敏反应如溶血性贫血、血小板减少等。\u003c/div\u003e","pt":"① 电解质紊乱: 低血钾、低血钠、低血镁、低氯性碱血症等。 ② 高尿酸血症: 与其在近曲小管和尿酸竞争有机酸分泌途径有关。 ③ 影响代谢: 可致糖尿病患者血糖升高，可能与其抑制胰岛素分泌及减少组织对葡萄糖利用有关。还可使血清胆固醇升高5%\\~15%，并升高血清低密度脂蛋白含量。 ④ 过敏反应: 本类药物与磺胺类药物有交叉过敏反应。可见皮疹、皮炎等，偶见严重过敏反应如溶血性贫血、血小板减少等。","ok":true,"kw":["胆固醇","胰岛素","电解质","葡萄糖"]},{"id":"d035f5d083","no":3,"q":"简述呋塞米与噻嗪类利尿药药理作用的区别。","a":"\u003cdiv class=\"q-ln\"\u003e① 呋塞米属于高效能利尿药，作用于髓袢升支粗段，抑制Na\u003csup\u003e+\u003c/sup\u003e-K\u003csup\u003e+\u003c/sup\u003e-2Cl\u003csup\u003e-\u003c/sup\u003e同向转运体，减少NaCl重吸收，降低肾脏稀释与浓缩能力。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 噻嗪类属于中效能利尿药，作用于远曲小管近端，抑制Na\u003csup\u003e+\u003c/sup\u003e-Cl\u003csup\u003e-\u003c/sup\u003e同向转运体，减少NaCl重吸收，只降低肾脏稀释功能，不影响其浓缩功能。\u003c/div\u003e","pt":"① 呋塞米属于高效能利尿药，作用于髓袢升支粗段，抑制Na + -K + -2Cl - 同向转运体，减少NaCl重吸收，降低肾脏稀释与浓缩能力。 ② 噻嗪类属于中效能利尿药，作用于远曲小管近端，抑制Na + -Cl - 同向转运体，减少NaCl重吸收，只降低肾脏稀释功能，不影响其浓缩功能。","ok":true,"kw":["利尿药"]},{"id":"ebc97c26a0","no":4,"q":"试述保钾利尿药在消除水肿治疗中的地位。","a":"\u003cdiv class=\"q-ln\"\u003e因有排钠保钾的作用，主要与排钾利尿药联合应用，治疗各种重度水肿或继发性醛固酮增多的水肿，联合用药的目的是增加疗效，防止低血钾。\u003c/div\u003e","pt":"因有排钠保钾的作用，主要与排钾利尿药联合应用，治疗各种重度水肿或继发性醛固酮增多的水肿，联合用药的目的是增加疗效，防止低血钾。","ok":true,"kw":["醛固酮","利尿药"]},{"id":"5779cdf23d","no":5,"q":"简述呋塞米用于急性肺水肿的药理学基础。","a":"\u003cdiv class=\"q-ln\"\u003e静脉给予呋塞米能迅速扩张容量血管，减少回心血量，在利尿作用出现之前即可迅速有效地缓解急性肺水肿。\u003c/div\u003e","pt":"静脉给予呋塞米能迅速扩张容量血管，减少回心血量，在利尿作用出现之前即可迅速有效地缓解急性肺水肿。","ok":true,"kw":[]}],"count":5,"done":5},{"label":"第二十二章·续","questions":[{"id":"8097a36db2","no":1,"q":"试述选择性COX-2抑制剂诱发心血管不良反应的作用、作用机制和预防措施。","a":"\u003cdiv class=\"q-ln\"\u003e（考研习题册p43）\u003c/div\u003e","pt":"（考研习题册p43）","ok":true,"kw":[]},{"id":"d94a2f77a2","no":2,"q":"试述小剂量阿司匹林防止血栓形成的机制。","a":"\u003cdiv class=\"q-ln\"\u003eTXA\u003csub\u003e2\u003c/sub\u003e是诱发血小板聚集和血栓形成的重要内源性物质。小剂量阿司匹林不可逆的抑制血小板COX，抑制TXA\u003csub\u003e2\u003c/sub\u003e合成，从而抑制血栓形成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e（大剂量阿司匹林直接抑制血管内皮细胞合成PGI\u003csub\u003e2\u003c/sub\u003e，PGI\u003csub\u003e2\u003c/sub\u003e是TXA\u003csub\u003e2\u003c/sub\u003e拮抗药，它的合成减少促进血小板聚集和血栓形成。）\u003c/div\u003e","pt":"TXA 2 是诱发血小板聚集和血栓形成的重要内源性物质。小剂量阿司匹林不可逆的抑制血小板COX，抑制TXA 2 合成，从而抑制血栓形成。 （大剂量阿司匹林直接抑制血管内皮细胞合成PGI 2 ，PGI 2 是TXA 2 拮抗药，它的合成减少促进血小板聚集和血栓形成。）","ok":true,"kw":[]},{"id":"6a67d6ca81","no":3,"q":"NSAID与吗啡的镇痛作用，NSAID与氯丙嗪的体温调节作用。","a":"\u003cdiv class=\"q-ln\"\u003e① NSAID与吗啡镇痛作用的比较:\u003c/div\u003e\u003cdiv class=\"q-tbl\"\u003e\u003ctable style=\"width:100%;border-collapse:collapse;text-align:center;border:2px solid #333;font-size:0.95em;\"\u003e\u003cthead\u003e\u003ctr style=\"background:#e8e8e8;\"\u003e\u003cth style=\"border:1px solid #333;padding:10px;width:18%;\"\u003e\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003eNSAID\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e吗啡\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003c [{"id":"a8bb11528b","no":1,"q":"试述H\u003csub\u003e1\u003c/sub\u003e受体拮抗药的药理作用及临床应用。","a":"\u003cdiv class=\"q-ln\"\u003e药理作用:（药理p282-283）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① H\u003csub\u003e1\u003c/sub\u003e受体拮抗作用\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 中枢作用\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗胆碱作用\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 微弱的α受体拮抗作用和局麻作用\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e临床应用:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 变态反应性疾病\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 晕动症和呕吐\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 镇静、催眠\u003c/div\u003e","pt":"药理作用:（药理p282-283） ① H 1 受体拮抗作用 ② 中枢作用 ③ 抗胆碱作用 ④ 微弱的α受体拮抗作用和局麻作用 临床应用: ① 变态反应性疾病 ② 晕动症和呕吐 ③ 镇静、催眠","ok":true,"kw":[]}],"count":1,"done":1},{"label":"第二十六章","questions":[{"id":"5272275b9b","no":1,"q":"反跳现象","a":"\u003cdiv class=\"q-ln\"\u003e又叫停药反应，因长期应用某些药物（如糖皮质激素），机体对其已产生适应性改变，导致突然停药后原有疾病加剧的现象。原因可能是患者对激素产生了依赖性或症状尚未被充分控制。常需加大剂量再行治疗，待症状缓解后再缓慢减量、停药。\u003c/div\u003e","pt":"又叫停药反应，因长期应用某些药物（如糖皮质激素），机体对其已产生适应性改变，导致突然停药后原有疾病加剧的现象。原因可能是患者对激素产生了依赖性或症状尚未被充分控制。常需加大剂量再行治疗，待症状缓解后再缓慢减量、停药。","ok":true,"kw":["糖皮质激素"]},{"id":"190a3c3a27","no":2,"q":"允许作用","a":"\u003cdiv class=\"q-ln\"\u003e糖皮质激素类药物对某些组织细胞虽无直接作用，但可给其他激素发挥作用创造有利条件，称为允许作用。如糖皮质激素类药物可增强儿茶酚胺的收缩血管作用和胰高血糖素的升高血糖作用等。\u003c/div\u003e","pt":"糖皮质激素类药物对某些组织细胞虽无直接作用，但可给其他激素发挥作用创造有利条件，称为允许作用。如糖皮质激素类药物可增强儿茶酚胺的收缩血管作用和胰高血糖素的升高血糖作用等。","ok":true,"kw":["糖皮质激素","允许作用"]},{"id":"1e76f89578","no":3,"q":"试述糖皮质激素类药物的主要药理作用。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗炎作用：具有强大的抗炎作用，能抑制各种原因引起的炎症反应；对炎症病理发展过程的不同阶段都有显著的非特异性抑制作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 免疫抑制与抗过敏作用：对免疫反应的多个环节具有抑制作用；1.包括抑制巨噬细胞吞噬和处理抗原；2.阻碍淋巴母细胞转化，破坏淋巴细胞；3.干扰淋巴组织在抗原作用下的分裂和增殖，阻断致敏T细胞诱发的单核细胞和巨噬细胞的募集等，抑制淋巴因子所引起的炎症反应，故可抑制皮肤Ⅳ型超敏反应和异体组织脏器移植的排斥反应；4.小剂量主要抑制细胞免疫；5.大剂量可抑制B细胞转化成浆细胞，抑制体液免疫。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗休克作用：常用于严重休克，特别是中毒性休克的治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 其他作用：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1.能降低外周血单核细胞、淋巴细胞、嗜酸性和嗜碱性粒细胞数。能刺激骨髓造血功能，使血液中红细胞、血小板、中性粒细胞数增加；也能增加血红蛋白、纤维蛋白原含量和缩短凝血时间。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2.能使胃蛋白酶和胃酸分泌增多，增加食欲，促进消化。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3.尚有退热和增强应激能力等作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3.长期大量应用本类药物时可出现骨质疏松。允许浓度的糖皮质激素对维持肌肉的正常功能是必需的。缺乏时表现为软弱、疲劳等。过量则可致皮质类固醇肌病。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2.可提高中枢神经系统兴奋性，偶可诱发精神失常；大剂量对儿童可致惊厥。\u003c/div\u003e","pt":"① 抗炎作用：具有强大的抗炎作用，能抑制各种原因引起的炎症反应；对炎症病理发展过程的不同阶段都有显著的非特异性抑制作用。 ② 免疫抑制与抗过敏作用：对免疫反应的多个环节具有抑制作用；1.包括抑制巨噬细胞吞噬和处理抗原；2.阻碍淋巴母细胞转化，破坏淋巴细胞；3.干扰淋巴组织在抗原作用下的分裂和增殖，阻断致敏T细胞诱发的单核细胞和巨噬细胞的募集等，抑制淋巴因子所引起的炎症反应，故可抑制皮肤Ⅳ型超敏反应和异体组织脏器移植的排斥反应；4.小剂量主要抑制细胞免疫；5.大剂量可抑制B细胞转化成浆细胞，抑制体液免疫。 ③ 抗休克作用：常用于严重休克，特别是中毒性休克的治疗。 ④ 其他作用： 1.能降低外周血单核细胞、淋巴细胞、嗜酸性和嗜碱性粒细胞数。能刺激骨髓造血功能，使血液中红细胞、血小板、中性粒细胞数增加；也能增加血红蛋白、纤维蛋白原含量和缩短凝血时间。 2.能使胃蛋白酶和胃酸分泌增多，增加食欲，促进消化。 3.尚有退热和增强应激能力等作用。 3.长期大量应用本类药物时可出现骨质疏松。允许浓度的糖皮质激素对维持肌肉的正常功能是必需的。缺乏时表现为软弱、疲劳等。过量则可致皮质类固醇肌病。 2.可提高中枢神经系统兴奋性，偶可诱发精神失常；大剂量对儿童可致惊厥。","ok":true,"kw":["中枢神经系统","糖皮质激素","特异性"]},{"id":"3849735359","no":4,"q":"试述糖皮质激素抗炎作用的基本机制。","a":"\u003cdiv class=\"q-ln\"\u003e其抗炎作用的基本机制是基因效应。糖皮质激素进入细胞后，与胞质内的糖皮质激素受体结合，受体激活，发生变构，暴露出一个DNA结合域。随之类固醇-受体复合体进入细胞核，在细胞核内与特异性DNA位点即靶基因的启动子序列的糖皮质激素反应元件（GRE）相结合，影响基因转录，相应地引起转录增加或减少，改变炎性介质相关蛋白的水平，进而对炎症细胞和分子产生影响而发挥抗炎作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e主要作用环节有：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 影响炎症抑制蛋白及某些靶酶。增加炎症抑制膜联蛋白的生成，继之抑制磷脂酶A\u003csub\u003e2\u003c/sub\u003e，影响花生四烯酸代谢的连锁反应，使具有扩血管作用的前列腺素和有趋化作用的白三烯类等炎症介质减少；抑制一氧化氮合酶和COX-2等的表达，从而阻断NO、PGE\u003csub\u003e2\u003c/sub\u003e等相关介质的产生；诱导血管紧张素转换酶的生成，以降解可引起血管舒张和致痛作用的缓激肽。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抑制细胞因子及黏附分子的表达。不仅抑制多种致炎细胞因子如TNF-α、白介素等的产生，而且可在转录水平上直接抑制某些黏附分子如E-选择素及ICAM-1的表达；此外，还影响细胞因子及黏附分子生物学效应的发挥。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 诱导炎细胞凋亡。\u003c/div\u003e","pt":"其抗炎作用的基本机制是基因效应。糖皮质激素进入细胞后，与胞质内的糖皮质激素受体结合，受体激活，发生变构，暴露出一个DNA结合域。随之类固醇-受体复合体进入细胞核，在细胞核内与特异性DNA位点即靶基因的启动子序列的糖皮质激素反应元件（GRE）相结合，影响基因转录，相应地引起转录增加或减少，改变炎性介质相关蛋白的水平，进而对炎症细胞和分子产生影响而发挥抗炎作用。 主要作用环节有： ① 影响炎症抑制蛋白及某些靶酶。增加炎症抑制膜联蛋白的生成，继之抑制磷脂酶A 2 ，影响花生四烯酸代谢的连锁反应，使具有扩血管作用的前列腺素和有趋化作用的白三烯类等炎症介质减少；抑制一氧化氮合酶和COX-2等的表达，从而阻断NO、PGE 2 等相关介质的产生；诱导血管紧张素转换酶的生成，以降解可引起血管舒张和致痛作用的缓激肽。 ② 抑制细胞因子及黏附分子的表达。不仅抑制多种致炎细胞因子如TNF-α、白介素等的产生，而且可在转录水平上直接抑制某些黏附分子如E-选择素及ICAM-1的表达；此外，还影响细胞因子及黏附分子生物学效应的发挥。 ③ 诱导炎细胞凋亡。","ok":true,"kw":["血管紧张素","糖皮质激素","特异性"]},{"id":"863b8afa2b","no":5,"q":"糖皮质激素类药物的主要临床应用包括哪些方面？","a":"\u003cdiv class=\"q-ln\"\u003e① 严重感染或炎症：在同时应用足量有效的抗生素控制感染的前提下，主要用于中毒性感染或伴有休克者，一般感染不用。如果炎症发生在人体重要器官，可用糖皮质激素以减少炎性渗出，防止组织过度破坏，抑制粘连及瘢痕的形成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 自身免疫性疾病、过敏性疾病和器官移植排斥反应：如重症全身性红斑狼疮、重症肌无力、支气管哮喘、过敏性休克，可与其他免疫抑制药联合应用抑制异体皮肤或脏器移植后的排斥反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗休克治疗：感染中毒性休克时，在有效的抗菌药物治疗下，可及早、短时间突击使用大剂量皮质激素；对过敏性休克，本类药物为次选药物，可与首选药物肾上腺素合用；对低血容量性休克，在补液补电解质或输血后效果不佳者，可合用超大剂量的皮质激素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 替代疗法：用于急性或慢性肾上腺皮质功能减退症、脑垂体功能减退症和肾上腺次全切除术后。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 其他：可用于某些血液病、皮肤病、眼部疾病以及脑水肿、急性脊髓损伤等治疗。\u003c/div\u003e","pt":"① 严重感染或炎症：在同时应用足量有效的抗生素控制感染的前提下，主要用于中毒性感染或伴有休克者，一般感染不用。如果炎症发生在人体重要器官，可用糖皮质激素以减少炎性渗出，防止组织过度破坏，抑制粘连及瘢痕的形成。 ② 自身免疫性疾病、过敏性疾病和器官移植排斥反应：如重症全身性红斑狼疮、重症肌无力、支气管哮喘、过敏性休克，可与其他免疫抑制药联合应用抑制异体皮肤或脏器移植后的排斥反应。 ③ 抗休克治疗：感染中毒性休克时，在有效的抗菌药物治疗下，可及早、短时间突击使用大剂量皮质激素；对过敏性休克，本类药物为次选药物，可与首选药物肾上腺素合用；对低血容量性休克，在补液补电解质或输血后效果不佳者，可合用超大剂量的皮质激素。 ④ 替代疗法：用于急性或慢性肾上腺皮质功能减退症、脑垂体功能减退症和肾上腺次全切除术后。 ⑤ 其他：可用于某些血液病、皮肤病、眼部疾病以及脑水肿、急性脊髓损伤等治疗。","ok":true,"kw":["糖皮质激素","肾上腺素","电解质","抗菌药物","抗生素","抗菌药"]},{"id":"13e48048f6","no":6,"q":"糖皮质激素抗炎作用特点（或利弊）？","a":"\u003cdiv class=\"q-ln\"\u003e优点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 本类药物具有强大的抗炎作用，对感染性、物理性、化学性、免疫性或缺血性组织损伤等原因引起的炎症，以及炎症病理发展过程的不同阶段都有显著的非特异性抑制作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 在炎症发展的急性阶段，本类药物可增加血管紧张性，降低毛细血管通透性，减轻渗出和水肿；同时减少各种炎症因子的释放，抑制白细胞浸润和吞噬反应，从而改善和消除红、肿、热、痛等症状。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 在炎症后期，能抑制毛细血管和成纤维细胞的增生，延缓胶原蛋白、黏多糖的合成以及抑制肉芽组织的增生，从而防止组织粘连和瘢痕形成，减轻后遗症。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e缺点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 炎症反应是机体的一种防御性反应，炎症后期的反应更是组织修复的重要过程。因此本类药物若使用不当，可致感染扩散、创面愈合延缓。\u003c/div\u003e","pt":"优点: ① 本类药物具有强大的抗炎作用，对感染性、物理性、化学性、免疫性或缺血性组织损伤等原因引起的炎症，以及炎症病理发展过程的不同阶段都有显著的非特异性抑制作用。 ② 在炎症发展的急性阶段，本类药物可增加血管紧张性，降低毛细血管通透性，减轻渗出和水肿；同时减少各种炎症因子的释放，抑制白细胞浸润和吞噬反应，从而改善和消除红、肿、热、痛等症状。 ③ 在炎症后期，能抑制毛细血管和成纤维细胞的增生，延缓胶原蛋白、黏多糖的合成以及抑制肉芽组织的增生，从而防止组织粘连和瘢痕形成，减轻后遗症。 缺点: ① 炎症反应是机体的一种防御性反应，炎症后期的反应更是组织修复的重要过程。因此本类药物若使用不当，可致感染扩散、创面愈合延缓。","ok":true,"kw":["毛细血管","特异性"]}],"count":6,"done":6},{"label":"第二十七章","questions":[{"id":"0be3f21b3e","no":1,"q":"试述胰岛素的主要药理作用和用途。","a":"\u003cdiv class=\"q-ln\"\u003e药理作用:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 糖代谢: 促进糖原合成与储存，加速葡萄糖的氧化和酵解，抑制糖原分解和糖异生，并能降低血糖。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 脂肪代谢: 抑制脂肪酶以及肾上腺素、生长激素和胰高血糖素的脂肪分解作用，使脂肪分解减慢；促进肝脏等部位脂肪合成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 蛋白质代谢: 增加氨基酸转运，促进蛋白质合成；抑制蛋白质分解。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 其他: 促进钾离子进入细胞，降低血钾浓度。加速心率，加强心肌收缩力。减少肾血流量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e临床应用:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 糖尿病: 各型糖尿病，尤其是1型糖尿病。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 胰岛素加入葡萄糖注射液内静脉滴注治疗高血钾症。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 合用葡萄糖、胰岛素和氯化钾液静脉滴注，促进K\u003csup\u003e+\u003c/sup\u003e进入细胞，用于心肌梗死的早期治疗，可防治心肌病变时的心律失常，降低死亡率。\u003c/div\u003e","pt":"药理作用: ① 糖代谢: 促进糖原合成与储存，加速葡萄糖的氧化和酵解，抑制糖原分解和糖异生，并能降低血糖。 ② 脂肪代谢: 抑制脂肪酶以及肾上腺素、生长激素和胰高血糖素的脂肪分解作用，使脂肪分解减慢；促进肝脏等部位脂肪合成。 ③ 蛋白质代谢: 增加氨基酸转运，促进蛋白质合成；抑制蛋白质分解。 ④ 其他: 促进钾离子进入细胞，降低血钾浓度。加速心率，加强心肌收缩力。减少肾血流量。 临床应用: ① 糖尿病: 各型糖尿病，尤其是1型糖尿病。 ② 胰岛素加入葡萄糖注射液内静脉滴注治疗高血钾症。 ③ 合用葡萄糖、胰岛素和氯化钾液静脉滴注，促进K + 进入细胞，用于心肌梗死的早期治疗，可防治心肌病变时的心律失常，降低死亡率。","ok":true,"kw":["静脉滴注","心律失常","氨基酸","胰岛素","肾上腺素","葡萄糖","注射液","蛋白质"]},{"id":"237231d332","no":2,"q":"简述磺酰脲类的作用机制和临床用途。","a":"\u003cdiv class=\"q-ln\"\u003e① 作用机制: 磺酰脲类与胰岛β细胞膜上磺酰脲受体结合，引起ATP敏感K\u003csup\u003e+\u003c/sup\u003e通道关闭，抑制细胞内K\u003csup\u003e+\u003c/sup\u003e外流，使细胞膜去极化，进而引起电压依赖性Ca\u003csup\u003e2+\u003c/sup\u003e通道开放，Ca\u003csup\u003e2+\u003c/sup\u003e内流，触发胰岛素的释放。本类药物降血糖作用机制可能还与增强胰岛素与靶组织及受体的结合能力，增加靶细胞膜上胰岛素受体的数目和亲和力等有关。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 临床用途: 主要用于单用饮食控制无效的胰岛功能尚存的2型糖尿病；亦可利用其与胰岛素有相加作用，用于对胰岛素有耐受性的患者，可减少胰岛素的用量。\u003c/div\u003e","pt":"① 作用机制: 磺酰脲类与胰岛β细胞膜上磺酰脲受体结合，引起ATP敏感K + 通道关闭，抑制细胞内K + 外流，使细胞膜去极化，进而引起电压依赖性Ca 2+ 通道开放，Ca 2+ 内流，触发胰岛素的释放。本类药物降血糖作用机制可能还与增强胰岛素与靶组织及受体的结合能力，增加靶细胞膜上胰岛素受体的数目和亲和力等有关。 ② 临床用途: 主要用于单用饮食控制无效的胰岛功能尚存的2型糖尿病；亦可利用其与胰岛素有相加作用，用于对胰岛素有耐受性的患者，可减少胰岛素的用量。","ok":true,"kw":["临床用途","胰岛素","作用机制","细胞膜"]},{"id":"70b6a40fee","no":3,"q":"产生胰岛素抵抗的主要原因和防治措施？","a":"\u003cdiv class=\"q-ln\"\u003e① 急性型: 并发感染、手术、创伤、情绪激动等所致应激状态时，血中拮抗胰岛素作用物质增多；酮症酸中毒时，血中大量游离脂肪酸和酮体妨碍了葡萄糖的摄取和利用；pH降低减少胰岛素与受体的结合等诱发因素使得胰岛素的效应下降。防治措施：消除诱因，增加胰岛素用量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 慢性型: 涉及多个方面，包括体内产生了胰岛素抗体，胰岛素受体数目减少以及受体与胰岛素亲和力降低，靶细胞膜上葡萄糖转运系统失常等。防治措施：选用抗原性小的胰岛素制剂，避免间断性使用胰岛素。\u003c/div\u003e","pt":"① 急性型: 并发感染、手术、创伤、情绪激动等所致应激状态时，血中拮抗胰岛素作用物质增多；酮症酸中毒时，血中大量游离脂肪酸和酮体妨碍了葡萄糖的摄取和利用；pH降低减少胰岛素与受体的结合等诱发因素使得胰岛素的效应下降。防治措施：消除诱因，增加胰岛素用量。 ② 慢性型: 涉及多个方面，包括体内产生了胰岛素抗体，胰岛素受体数目减少以及受体与胰岛素亲和力降低，靶细胞膜上葡萄糖转运系统失常等。防治措施：选用抗原性小的胰岛素制剂，避免间断性使用胰岛素。","ok":true,"kw":["胰岛素","葡萄糖","细胞膜"]}],"count":3,"done":3},{"label":"第二十八章","questions":[{"id":"d41071dfa7","no":1,"q":"试比较丙硫氧嘧啶和大剂量碘剂的作用原理、作用特点和临床应用。","a":"\u003cdiv class=\"q-tbl\"\u003e\u003ctable style=\"width:100%;border-collapse:collapse;text-align:center;border:2px solid #333;font-size:0.95em;\"\u003e\u003cthead\u003e\u003ctr style=\"background:#e8e8e8;\"\u003e\u003cth style=\"border:1px solid #333;padding:10px;width:18%;\"\u003e\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e丙硫氧嘧啶\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e大剂量碘剂\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e作用原理\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e抑制甲状腺激素合成，抑制 T\u003csub\u003e4\u003c/sub\u003e 转化为 T\u003csub\u003e3\u003c/sub\u003e，抑制血液循环 TSI 合成\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e抑制谷胱甘肽还原酶对甲状腺球蛋白水解时二硫键的还原，抑制甲状腺激素的释放；拮抗 TSH 促进甲状腺激素释放的作用\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e作用特点\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e起效慢、疗程长；甲状腺肿大、变软脆，加重突眼\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e起效快，但不持久（&gt;2 周失去作用）；对抗 TSH，腺体变小、变硬，血管减少\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e临床应用\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e甲亢的内科治疗、甲状腺术前准备、甲状腺危象的辅助治疗\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e甲亢术前准备：使甲状腺组织缩小，血管减少，利于手术进行及减少出血；甲状腺危象的治疗\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e","pt":"丙硫氧嘧啶 大剂量碘剂 作用原理 抑制甲状腺激素合成，抑制 T 4 转化为 T 3 ，抑制血液循环 TSI 合成 抑制谷胱甘肽还原酶对甲状腺球蛋白水解时二硫键的还原，抑制甲状腺激素的释放；拮抗 TSH 促进甲状腺激素释放的作用 作用特点 起效慢、疗程长；甲状腺肿大、变软脆，加重突眼 起效快，但不持久（\u003e2 周失去作用）；对抗 TSH，腺体变小、变硬，血管减少 临床应用 甲亢的内科治疗、甲状腺术前准备、甲状腺危象的辅助治疗 甲亢术前准备：使甲状腺组织缩小，血管减少，利于手术进行及减少出血；甲状腺危象的治疗","ok":true,"kw":["谷胱甘肽","甲状腺"]},{"id":"ca63f7a521","no":2,"q":"甲状腺功能亢进治疗药物有哪几类？举例说明。","a":"\u003cdiv class=\"q-ln\"\u003e① 硫脲类：如丙硫氧嘧啶，抑制甲状腺激素合成，抑制外周血 T\u003csub\u003e4\u003c/sub\u003e 转为 T\u003csub\u003e3\u003c/sub\u003e，同时抑制血液循环 TSI 合成。可用于甲亢内科治疗、甲亢术前准备和甲亢危象辅助用药等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 碘和碘化物：如碘化钾或鲁氏碘液，小剂量用于预防单纯性甲状腺肿，大剂量碘用于甲状腺危象和甲亢术前准备。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ β 受体拮抗药：如普萘洛尔，主要通过阻断 β 受体而改善甲亢症状，并可减少甲状腺素分泌和 T\u003csub\u003e3\u003c/sub\u003e 生成。用于甲亢治疗、甲状腺危象辅助治疗及术前准备，单用作用有限，与硫脲类合用作用更显著。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 放射性碘：如 \u003csup\u003e131\u003c/sup\u003eI，利用产生 β 射线破坏甲状腺组织来治疗甲亢，γ 射线可用于甲状腺摄碘功能检查。\u003c/div\u003e","pt":"① 硫脲类：如丙硫氧嘧啶，抑制甲状腺激素合成，抑制外周血 T 4 转为 T 3 ，同时抑制血液循环 TSI 合成。可用于甲亢内科治疗、甲亢术前准备和甲亢危象辅助用药等。 ② 碘和碘化物：如碘化钾或鲁氏碘液，小剂量用于预防单纯性甲状腺肿，大剂量碘用于甲状腺危象和甲亢术前准备。 ③ β 受体拮抗药：如普萘洛尔，主要通过阻断 β 受体而改善甲亢症状，并可减少甲状腺素分泌和 T 3 生成。用于甲亢治疗、甲状腺危象辅助治疗及术前准备，单用作用有限，与硫脲类合用作用更显著。 ④ 放射性碘：如 131 I，利用产生 β 射线破坏甲状腺组织来治疗甲亢，γ 射线可用于甲状腺摄碘功能检查。","ok":true,"kw":["甲状腺","受体拮抗药"]},{"id":"fdd6ccbe36","no":3,"q":"简述放射性碘的临床应用。","a":"\u003cdiv class=\"q-ln\"\u003e① 甲亢的治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 转移性甲状腺癌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 甲状腺摄碘功能检查。\u003c/div\u003e","pt":"① 甲亢的治疗。 ② 转移性甲状腺癌。 ③ 甲状腺摄碘功能检查。","ok":true,"kw":["甲状腺"]}],"count":3,"done":3},{"label":"第三十一章","questions":[{"id":"204871ba89","no":1,"q":"简述控制哮喘药物的分类，列举各类的主要代表药。","a":"\u003cdiv class=\"q-ln\"\u003e支气管扩张药:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① β受体激动药: 1.非选择性β受体激动药: 异丙肾上腺素；2.β\u003csub\u003e2\u003c/sub\u003e受体激动药: 沙丁胺醇\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 茶碱类: 氨茶碱\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ M受体拮抗药: 噻托溴铵\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e抗炎平喘药:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 糖皮质激素类: 丙酸氟替卡松\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e抗过敏平喘药:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 过敏介质阻释药: 色苷酸钠\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抗百三烯药: 孟鲁司特\u003c/div\u003e","pt":"支气管扩张药: ① β受体激动药: 1.非选择性β受体激动药: 异丙肾上腺素；2.β 2 受体激动药: 沙丁胺醇 ② 茶碱类: 氨茶碱 ③ M受体拮抗药: 噻托溴铵 抗炎平喘药: ① 糖皮质激素类: 丙酸氟替卡松 抗过敏平喘药: ① 过敏介质阻释药: 色苷酸钠 ② 抗百三烯药: 孟鲁司特","ok":true,"kw":["糖皮质激素","肾上腺素","激动药","受体拮抗药","选择性"]},{"id":"11fe47f9e7","no":2,"q":"简述糖皮质激素平喘作用的机制。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗炎: 这是发挥平喘作用的最重要机制，可抑制气道黏膜中各种炎症细胞的趋化、聚集、活化及多种炎症介质、致炎细胞因子的生产及释放，促进嗜酸性粒细胞凋亡，减少渗出，减轻气道黏膜的充血水肿和局部炎症反应，抑制黏液腺分泌，使破坏的支气管上皮愈合，控制支气管的高反应性而改善肺功能。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抗过敏: 抑制过敏介质释放。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 阻滞β受体下调: 增加气道平滑肌β\u003csub\u003e2\u003c/sub\u003e受体的反应性。\u003c/div\u003e","pt":"① 抗炎: 这是发挥平喘作用的最重要机制，可抑制气道黏膜中各种炎症细胞的趋化、聚集、活化及多种炎症介质、致炎细胞因子的生产及释放，促进嗜酸性粒细胞凋亡，减少渗出，减轻气道黏膜的充血水肿和局部炎症反应，抑制黏液腺分泌，使破坏的支气管上皮愈合，控制支气管的高反应性而改善肺功能。 ② 抗过敏: 抑制过敏介质释放。 ③ 阻滞β受体下调: 增加气道平滑肌β 2 受体的反应性。","ok":true,"kw":[]}],"count":2,"done":2},{"label":"第三十二章","questions":[{"id":"edc380eff3","no":1,"q":"试述临床上抑制胃酸分泌的药物分类及代表药。","a":"\u003cdiv class=\"q-ln\"\u003e① 质子泵抑制剂: 奥美拉唑\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② H\u003csub\u003e2\u003c/sub\u003e受体拮抗药: 西咪替丁\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ M受体拮抗药: 哌仑西平\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 胃泌素受体拮抗药: 丙谷胺\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 前列腺素EP\u003csub\u003e3\u003c/sub\u003e受体激动药: 米索前列醇\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 生长抑素\u003c/div\u003e","pt":"① 质子泵抑制剂: 奥美拉唑 ② H 2 受体拮抗药: 西咪替丁 ③ M受体拮抗药: 哌仑西平 ④ 胃泌素受体拮抗药: 丙谷胺 ⑤ 前列腺素EP 3 受体激动药: 米索前列醇 ⑥ 生长抑素","ok":true,"kw":["质子泵抑制剂","奥美拉唑","激动药","受体拮抗药"]},{"id":"a901dda0cd","no":2,"q":"为什么多潘立酮具有与甲氧氯普胺相似的镇吐和催乳素反应（溢乳），但却不产生锥体外系反应？","a":"\u003cdiv class=\"q-ln\"\u003e① 两药都能拮抗D\u003csub\u003e2\u003c/sub\u003e受体，但区别是多潘立酮不易透过血脑屏障而阻断黑质-纹状体通路的多巴胺D\u003csub\u003e2\u003c/sub\u003e受体，因而不产生锥体外系反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 但多潘立酮能在血脑屏障薄弱的部位，如延髓催吐化学感受区和垂体前叶拮抗D\u003csub\u003e2\u003c/sub\u003e受体发挥作用，从而产生和甲氧氯普胺相似的镇吐和催乳素反应。\u003c/div\u003e","pt":"① 两药都能拮抗D 2 受体，但区别是多潘立酮不易透过血脑屏障而阻断黑质-纹状体通路的多巴胺D 2 受体，因而不产生锥体外系反应。 ② 但多潘立酮能在血脑屏障薄弱的部位，如延髓催吐化学感受区和垂体前叶拮抗D 2 受体发挥作用，从而产生和甲氧氯普胺相似的镇吐和催乳素反应。","ok":true,"kw":[]}],"count":2,"done":2},{"label":"第三十三章","questions":[{"id":"b741174b0c","no":1,"q":"试比较肝素和双香豆素的异同。","a":"\u003cdiv class=\"q-ln\"\u003e肝素:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 肝素抗凝作用迅速、强大，作用时间短，静脉注射后立即起效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 肝素在体内、体外均可抗凝。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 肝素只能静脉给药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 肝素的作用机制是加速抗凝血酶Ⅲ对凝血因子Ⅱa、Ⅸa、Ⅹa、Ⅺa、Ⅻa的灭活，进而抑制凝血过程。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 肝素过量所致自发性出血可用硫酸鱼精蛋白对抗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e香豆素:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 香豆素抗凝作用缓慢但持久。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 香豆素只能体内抗凝，体外无效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 香豆素给药方式为口服给药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 香豆素抗凝机制为抑制维生素K在肝脏由环氧化物转换为氢醌型，从而妨碍肝脏合成凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 香豆素过量所引起的自发性出血可静脉滴注维生素K，或输新鲜血浆或血液抢救。\u003c/div\u003e","pt":"肝素: ① 肝素抗凝作用迅速、强大，作用时间短，静脉注射后立即起效。 ② 肝素在体内、体外均可抗凝。 ③ 肝素只能静脉给药。 ④ 肝素的作用机制是加速抗凝血酶Ⅲ对凝血因子Ⅱa、Ⅸa、Ⅹa、Ⅺa、Ⅻa的灭活，进而抑制凝血过程。 ⑤ 肝素过量所致自发性出血可用硫酸鱼精蛋白对抗。 香豆素: ① 香豆素抗凝作用缓慢但持久。 ② 香豆素只能体内抗凝，体外无效。 ③ 香豆素给药方式为口服给药。 ④ 香豆素抗凝机制为抑制维生素K在肝脏由环氧化物转换为氢醌型，从而妨碍肝脏合成凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ。 ⑤ 香豆素过量所引起的自发性出血可静脉滴注维生素K，或输新鲜血浆或血液抢救。","ok":true,"kw":["静脉滴注","作用机制","维生素"]}],"count":1,"done":1},{"label":"第三十四章","questions":[{"id":"519220580c","no":1,"q":"化学治疗","a":"\u003cdiv class=\"q-ln\"\u003e细菌和其他病原微生物、寄生虫以及癌细胞所致疾病的药物治疗统称为化学治疗，简称化疗。\u003c/div\u003e","pt":"细菌和其他病原微生物、寄生虫以及癌细胞所致疾病的药物治疗统称为化学治疗，简称化疗。","ok":true,"kw":["化学治疗"]},{"id":"635687c9c6","no":2,"q":"化疗指数","a":"\u003cdiv class=\"q-ln\"\u003eLD\u003csub\u003e50\u003c/sub\u003e/ED\u003csub\u003e50\u003c/sub\u003e 或 LD\u003csub\u003e5\u003c/sub\u003e/ED\u003csub\u003e95\u003c/sub\u003e 评价化疗药物对机体毒性、疗效的重要指标。\u003c/div\u003e","pt":"LD 50 /ED 50 或 LD 5 /ED 95 评价化疗药物对机体毒性、疗效的重要指标。","ok":true,"kw":[]},{"id":"a328ff2584","no":3,"q":"抗生素","a":"\u003cdiv class=\"q-ln\"\u003e是由各种微生物（包括细菌、真菌、放线菌属）产生的，能杀灭或抑制其他微生物的物质。抗生素分为天然抗生素和人工半合成抗生素，前者由微生物产生，后者是对天然抗生素进行结构改造获得的半合成产品。\u003c/div\u003e","pt":"是由各种微生物（包括细菌、真菌、放线菌属）产生的，能杀灭或抑制其他微生物的物质。抗生素分为天然抗生素和人工半合成抗生素，前者由微生物产生，后者是对天然抗生素进行结构改造获得的半合成产品。","ok":true,"kw":["半合成抗生素","抗生素"]},{"id":"8a8db9079d","no":4,"q":"抗菌药物","a":"\u003cdiv class=\"q-ln\"\u003e是指能够抑制或杀灭细菌，用于防治细菌感染性疾病的药物，包括抗生素和人工合成抗菌药物。\u003c/div\u003e","pt":"是指能够抑制或杀灭细菌，用于防治细菌感染性疾病的药物，包括抗生素和人工合成抗菌药物。","ok":true,"kw":["抗菌药物","抗生素","抗菌药"]},{"id":"cb2e5cf31d","no":5,"q":"最低抑菌浓度 (MIC)","a":"\u003cdiv class=\"q-ln\"\u003e在体外，抗菌药物与细菌培养 18～24 小时后能抑制培养基内病原菌生长的最低药物浓度。\u003c/div\u003e","pt":"在体外，抗菌药物与细菌培养 18～24 小时后能抑制培养基内病原菌生长的最低药物浓度。","ok":true,"kw":["病原菌","抗菌药物","抗菌药"]},{"id":"aa4434a348","no":6,"q":"最低杀菌浓度 (MBC)","a":"\u003cdiv class=\"q-ln\"\u003e抗菌药物能够杀灭培养基内细菌或使细菌数减少 99.9% 的最低药物浓度。\u003c/div\u003e","pt":"抗菌药物能够杀灭培养基内细菌或使细菌数减少 99.9% 的最低药物浓度。","ok":true,"kw":["抗菌药物","抗菌药"]},{"id":"fdac19ae90","no":7,"q":"抗生素后效应 (PAE)","a":"\u003cdiv class=\"q-ln\"\u003e细菌与抗生素短暂接触后，当抗生素的浓度低于最低抑菌浓度或消失后，细菌仍被持续抑制的效应。\u003c/div\u003e","pt":"细菌与抗生素短暂接触后，当抗生素的浓度低于最低抑菌浓度或消失后，细菌仍被持续抑制的效应。","ok":true,"kw":["最低抑菌浓度","抗生素"]},{"id":"0629ed7571","no":8,"q":"抗菌谱","a":"\u003cdiv class=\"q-ln\"\u003e是指抗菌药物的抗菌范围，包括广谱和窄谱两种。广谱抗菌药指对多种病原微生物有效的抗菌药，如四环素 、氯霉素，广谱青霉素等。窄谱抗菌药指仅对一种细菌或局限于某属细菌有抗菌作用的药物，如异烟肼仅对结核分枝杆菌有作用，而对其他细菌无效。抗菌药物的抗菌谱是临床选药的基础。\u003c/div\u003e","pt":"是指抗菌药物的抗菌范围，包括广谱和窄谱两种。广谱抗菌药指对多种病原微生物有效的抗菌药，如四环素 、氯霉素，广谱青霉素等。窄谱抗菌药指仅对一种细菌或局限于某属细菌有抗菌作用的药物，如异烟肼仅对结核分枝杆菌有作用，而对其他细菌无效。抗菌药物的抗菌谱是临床选药的基础。","ok":true,"kw":["青霉素","抗菌药物","抗菌谱","抗菌药"]},{"id":"65c69a8ce7","no":9,"q":"耐药性","a":"\u003cdiv class=\"q-ln\"\u003e是指常规治疗剂量下，细菌对药物的敏感性下降甚至消失，导致药物对耐药菌的疗效降低或无效。\u003c/div\u003e","pt":"是指常规治疗剂量下，细菌对药物的敏感性下降甚至消失，导致药物对耐药菌的疗效降低或无效。","ok":true,"kw":["耐药菌"]},{"id":"816a927929","no":10,"q":"如何评价抗菌药物的抗菌活性。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗菌活性的强弱: 抑菌剂或杀菌剂；MIC/MBC；PAE。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抗菌谱的范围: 窄谱、广谱；革兰氏阳性菌、革兰氏阴性菌；难治细菌如铜绿假单胞菌、厌氧菌。\u003c/div\u003e","pt":"① 抗菌活性的强弱: 抑菌剂或杀菌剂；MIC/MBC；PAE。 ② 抗菌谱的范围: 窄谱、广谱；革兰氏阳性菌、革兰氏阴性菌；难治细菌如铜绿假单胞菌、厌氧菌。","ok":true,"kw":["铜绿假单胞菌","抗菌活性","抗菌谱"]},{"id":"dd5af7fbb1","no":11,"q":"抗菌药物的合理使用原则是什么","a":"\u003cdiv class=\"q-ln\"\u003e① 诊断为细菌性感染者方有指征应用抗菌药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 尽早查明感染病原，根据病原种类及药物敏感试验结果选用抗菌药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗菌药物的经验治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 按照药物的抗菌作用及其体内过程特点选择用药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 综合患者病情、病原菌种类及抗菌药物特点制订抗菌治疗方案。\u003c/div\u003e","pt":"① 诊断为细菌性感染者方有指征应用抗菌药物。 ② 尽早查明感染病原，根据病原种类及药物敏感试验结果选用抗菌药物。 ③ 抗菌药物的经验治疗。 ④ 按照药物的抗菌作用及其体内过程特点选择用药。 ⑤ 综合患者病情、病原菌种类及抗菌药物特点制订抗菌治疗方案。","ok":true,"kw":["病原菌","抗菌药物","抗菌药"]},{"id":"97dabffd7c","no":12,"q":"抗菌药物联合用药的意义是什么","a":"\u003cdiv class=\"q-ln\"\u003e① 发挥药物协同作用，提高疗效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 延迟或减少耐药菌株出现。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 扩大抗菌范围（混合感染)。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 减少毒副反应（减少个别药剂量）。\u003c/div\u003e","pt":"① 发挥药物协同作用，提高疗效。 ② 延迟或减少耐药菌株出现。 ③ 扩大抗菌范围（混合感染)。 ④ 减少毒副反应（减少个别药剂量）。","ok":true,"kw":["耐药菌"]},{"id":"11053d667f","no":13,"q":"抗菌药物联合用药的指征是什么","a":"\u003cdiv class=\"q-ln\"\u003e① 病原菌尚未查明的严重感染，包括免疫缺陷者的严重感染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 单一抗菌药物不能控制的严重感染，需氧菌及厌氧菌混合感染，2种及2种以上复数菌感染，以及多重耐药菌或泛耐药菌感染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 需长疗程治疗，但病原菌易对某些抗菌药物产生耐药性的感染，如某些侵袭性真菌病；或病原菌含有不同生长特点的菌群，需要应用不同抗菌机制的药物联合使用，如结核和非结核分枝杆菌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 毒性较大的抗菌药物，联合用药时剂量可适当减少，但需有临床资料证明其同样有效。如两性霉素B与氟胞嘧啶联合治疗隐球菌性脑膜炎时，前者的剂量可适当减少，以减少其毒性反应。\u003c/div\u003e","pt":"① 病原菌尚未查明的严重感染，包括免疫缺陷者的严重感染。 ② 单一抗菌药物不能控制的严重感染，需氧菌及厌氧菌混合感染，2种及2种以上复数菌感染，以及多重耐药菌或泛耐药菌感染。 ③ 需长疗程治疗，但病原菌易对某些抗菌药物产生耐药性的感染，如某些侵袭性真菌病；或病原菌含有不同生长特点的菌群，需要应用不同抗菌机制的药物联合使用，如结核和非结核分枝杆菌。 ④ 毒性较大的抗菌药物，联合用药时剂量可适当减少，但需有临床资料证明其同样有效。如两性霉素B与氟胞嘧啶联合治疗隐球菌性脑膜炎时，前者的剂量可适当减少，以减少其毒性反应。","ok":true,"kw":["病原菌","抗菌药物","耐药性","耐药菌","抗菌药"]},{"id":"6a8f89ec9d","no":14,"q":"抗菌药物抗菌机制","a":"\u003cdiv class=\"q-ln\"\u003e① 抑制细菌细胞壁的合成: 青霉素、头孢菌素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抑制核酸的复制与代谢: 1.影响核酸复制: 喹诺酮类；2.影响叶酸代谢: 磺胺类与甲氧苄啶；3.影响DNA合成: 硝基咪唑类。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抑制蛋白质合成: 氯霉素、林可霉素、四环素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 增加胞质膜的通透性: 多黏菌素类、两性霉素B。\u003c/div\u003e","pt":"① 抑制细菌细胞壁的合成: 青霉素、头孢菌素。 ② 抑制核酸的复制与代谢: 1.影响核酸复制: 喹诺酮类；2.影响叶酸代谢: 磺胺类与甲氧苄啶；3.影响DNA合成: 硝基咪唑类。 ③ 抑制蛋白质合成: 氯霉素、林可霉素、四环素。 ④ 增加胞质膜的通透性: 多黏菌素类、两性霉素B。","ok":true,"kw":["青霉素","蛋白质"]},{"id":"5c65b122cc","no":15,"q":"细菌耐药性的产生机制","a":"\u003cdiv class=\"q-ln\"\u003e① 产生灭活酶。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抗菌药物作用靶点改变。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 改变细菌外膜通透性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 影响主动外排系统。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 形成细菌生物被膜。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 改变代谢途径。\u003c/div\u003e","pt":"① 产生灭活酶。 ② 抗菌药物作用靶点改变。 ③ 改变细菌外膜通透性。 ④ 影响主动外排系统。 ⑤ 形成细菌生物被膜。 ⑥ 改变代谢途径。","ok":true,"kw":["抗菌药物","抗菌药"]}],"count":15,"done":15},{"label":"第三十五章","questions":[{"id":"dadc5e8b8c","no":1,"q":"细菌对青霉素类药物产生耐药性的机制是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 产生β-内酰胺酶，如青霉素酶，使青霉素水解失活，失去抗菌活性而耐药；或通过牵制机制抑制β-内酰胺类到达PBP靶点发挥抗菌作用而耐药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② PBP的组成与功能改变: 耐药菌株降低PBP与β-内酰胺类的亲和力或产生与β-内酰胺亲和力低的PBP，使药物抗菌活性难以发挥而耐药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 通过降低细胞外膜通透性、加强主动外排系统以及形成细菌生物膜使得细菌体内的β-内酰胺类抗生素积聚减少而耐药。\u003c/div\u003e","pt":"① 产生β-内酰胺酶，如青霉素酶，使青霉素水解失活，失去抗菌活性而耐药；或通过牵制机制抑制β-内酰胺类到达PBP靶点发挥抗菌作用而耐药。 ② PBP的组成与功能改变: 耐药菌株降低PBP与β-内酰胺类的亲和力或产生与β-内酰胺亲和力低的PBP，使药物抗菌活性难以发挥而耐药。 ③ 通过降低细胞外膜通透性、加强主动外排系统以及形成细菌生物膜使得细菌体内的β-内酰胺类抗生素积聚减少而耐药。","ok":true,"kw":["抗菌活性","青霉素","耐药菌","抗生素","组成"]},{"id":"3300b02182","no":2,"q":"半合成青霉素类药物的分类以及特点是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 耐酸青霉素: 如青霉素V，可口服。抗菌谱与青霉素相似，抗菌作用略弱于青霉素，不用于严重感染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 耐酸耐酶青霉素: 如甲氧西林，可口服。抗菌谱与青霉素相似，但对耐青霉素的金黄色葡萄球菌有一定作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 广谱青霉素: 如氨苄西林、阿莫西林，可口服或注射。抗菌谱较青霉素扩大，对G\u003csup\u003e-\u003c/sup\u003e杆菌有较强作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 抗铜绿假单胞菌广谱青霉素: 如羧苄西林，部分药物可口服。对G\u003csup\u003e-\u003c/sup\u003e杆菌尤其是铜绿假单胞菌有较强作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 抗G\u003csup\u003e-\u003c/sup\u003e杆菌青霉素: 如美西林、匹美西林，匹美西林可口服。对G\u003csup\u003e-\u003c/sup\u003e杆菌作用强，对G\u003csup\u003e+\u003c/sup\u003e菌作用弱，对铜绿假单胞菌无效。\u003c/div\u003e","pt":"① 耐酸青霉素: 如青霉素V，可口服。抗菌谱与青霉素相似，抗菌作用略弱于青霉素，不用于严重感染。 ② 耐酸耐酶青霉素: 如甲氧西林，可口服。抗菌谱与青霉素相似，但对耐青霉素的金黄色葡萄球菌有一定作用。 ③ 广谱青霉素: 如氨苄西林、阿莫西林，可口服或注射。抗菌谱较青霉素扩大，对G - 杆菌有较强作用。 ④ 抗铜绿假单胞菌广谱青霉素: 如羧苄西林，部分药物可口服。对G - 杆菌尤其是铜绿假单胞菌有较强作用。 ⑤ 抗G - 杆菌青霉素: 如美西林、匹美西林，匹美西林可口服。对G - 杆菌作用强，对G + 菌作用弱，对铜绿假单胞菌无效。","ok":true,"kw":["铜绿假单胞菌","青霉素","抗菌谱"]},{"id":"1febb4c5cb","no":3,"q":"西司他丁与亚胺培南联合应用的原理是什么？","a":"\u003cdiv class=\"q-ln\"\u003e亚胺培南具有高效、抗菌谱广、耐酶等特点，但在体内易被肾肽酶水解失活。西司他丁为肾肽酶的抑制药，使亚胺培南免受肾肽酶降解而延缓代谢，延长其半衰期。\u003c/div\u003e","pt":"亚胺培南具有高效、抗菌谱广、耐酶等特点，但在体内易被肾肽酶水解失活。西司他丁为肾肽酶的抑制药，使亚胺培南免受肾肽酶降解而延缓代谢，延长其半衰期。","ok":true,"kw":["半衰期","抗菌谱"]},{"id":"f5b0fd2477","no":4,"q":"试比较各代头孢菌素的特点。","a":"\u003cdiv class=\"q-tbl\"\u003e\u003ctable style=\"width:100%;border-collapse:collapse;text-align:center;border:2px solid #333;font-size:0.95em;\"\u003e\u003cthead\u003e\u003ctr style=\"background:#e8e8e8;\"\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003eG\u003csup\u003e+\u003c/sup\u003e菌\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003eG\u003csup\u003e-\u003c/sup\u003e菌\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e耐酶稳定性\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e肾毒性\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e铜绿假单胞菌\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e其他\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e第一代\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e+++\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e+\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e+\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e有\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e无效\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e敏感菌感染\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e第二代\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e++\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\ 件下抗菌作用增强，酸性条件下抗菌作用减弱。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 抗菌机制相似，均抑制细菌体蛋白质合成，为速效静止期杀菌药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 不良反应相似，均可不同程度地引起耳毒性、肾毒性及神经肌肉麻痹等反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 耐药性相似的细菌对本类药物均有交叉耐药性或单向交叉耐药性。\u003c/div\u003e","pt":"① 化学性质相似，都是较强的有机碱，脂溶性小，难以跨膜转运。 ② 体内过程相似，口服难吸收，多采用肌内注射。主要分布于细胞外液，大部分以原型经肾脏排出。不易通过血脑屏障，但可通过胎盘屏障。 ③ 抗菌谱相似，对革兰氏阴性杆菌有杀灭作用，对某些革兰氏阳性球菌也有效。在碱性条件下抗菌作用增强，酸性条件下抗菌作用减弱。 ④ 抗菌机制相似，均抑制细菌体蛋白质合成，为速效静止期杀菌药。 ⑤ 不良反应相似，均可不同程度地引起耳毒性、肾毒性及神经肌肉麻痹等反应。 ⑥ 耐药性相似的细菌对本类药物均有交叉耐药性或单向交叉耐药性。","ok":true,"kw":["耐药性","抗菌谱","蛋白质"]},{"id":"d6db1894f1","no":4,"q":"灰婴综合征","a":"\u003cdiv class=\"q-ln\"\u003e早产儿和新生儿肝脏缺乏葡萄糖醛酸转移酶，肾排泄功能不完善，对氯霉素解毒能力差；药物剂量过大可致中毒，表现为循环衰竭、呼吸困难、进行性血压下降、皮肤苍白和发绀，故称灰婴综合征。\u003c/div\u003e","pt":"早产儿和新生儿肝脏缺乏葡萄糖醛酸转移酶，肾排泄功能不完善，对氯霉素解毒能力差；药物剂量过大可致中毒，表现为循环衰竭、呼吸困难、进行性血压下降、皮肤苍白和发绀，故称灰婴综合征。","ok":true,"kw":["灰婴综合征","葡萄糖"]},{"id":"66ba7eea7d","no":5,"q":"二重感染","a":"\u003cdiv class=\"q-ln\"\u003e长期口服或注射广谱抗菌药时，敏感菌被抑制，不敏感菌乘机大量繁殖，由原来的劣势菌群变为优势菌群，造成新的感染，称作二重感染。\u003c/div\u003e","pt":"长期口服或注射广谱抗菌药时，敏感菌被抑制，不敏感菌乘机大量繁殖，由原来的劣势菌群变为优势菌群，造成新的感染，称作二重感染。","ok":true,"kw":["二重感染","抗菌药"]}],"count":5,"done":5},{"label":"第三十八章","questions":[{"id":"799beff41d","no":1,"q":"简述氟喹诺酮类药理学共同特征。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗菌谱广，抗菌活性强：对G\u003csup\u003e-\u003c/sup\u003e菌有强大的杀菌作用，对金黄色葡萄球菌及产酶金黄色葡萄球菌也有良好抗菌作用；某些品种对结核分枝杆菌、支原体、衣原体及厌氧菌也有作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 药代动力学特性好: 吸收迅速而完全，体内分布广，组织体液浓度高，可达有效抑菌或杀菌水平；血浆 t\u003csub\u003e1/2\u003c/sub\u003e 相对较长。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 细菌对本类药物与其他抗菌药物间无交叉耐药性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 临床应用广泛: 适用于敏感病原菌所致的呼吸道感染、尿路感染、前列腺炎、淋病及G\u003csup\u003e-\u003c/sup\u003e杆菌所致各种感染，骨、关节、皮肤软组织感染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 不良反应少，大多轻微，常见的有恶心、呕吐、食欲减退、皮疹、头痛、眩晕。偶有抽搐精神症状，停药可消退。有些喹诺酮类药物可出现光敏性皮炎和骨关节病。\u003c/div\u003e","pt":"① 抗菌谱广，抗菌活性强：对G - 菌有强大的杀菌作用，对金黄色葡萄球菌及产酶金黄色葡萄球菌也有良好抗菌作用；某些品种对结核分枝杆菌、支原体、衣原体及厌氧菌也有作用。 ② 药代动力学特性好: 吸收迅速而完全，体内分布广，组织体液浓度高，可达有效抑菌或杀菌水平；血浆 t 1/2 相对较长。 ③ 细菌对本类药物与其他抗菌药物间无交叉耐药性。 ④ 临床应用广泛: 适用于敏感病原菌所致的呼吸道感染、尿路感染、前列腺炎、淋病及G - 杆菌所致各种感染，骨、关节、皮肤软组织感染。 ⑤ 不良反应少，大多轻微，常见的有恶心、呕吐、食欲减退、皮疹、头痛、眩晕。偶有抽搐精神症状，停药可消退。有些喹诺酮类药物可出现光敏性皮炎和骨关节病。","ok":true,"kw":["病原菌","抗菌活性","动力学","抗菌药物","耐药性","抗菌谱","抗菌药"]},{"id":"c1d8d27763","no":2,"q":"简述喹诺酮类药物的抗菌作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e① 喹诺酮类药物抗G\u003csup\u003e-\u003c/sup\u003e菌的主要机制是抑制细菌DNA回旋酶，通过抑制其切口和封口功能而阻碍细菌DNA合成，最终导致细菌死亡。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抗G\u003csup\u003e+\u003c/sup\u003e菌的主要机制是抑制拓扑异构酶Ⅳ，影响子代DNA解环链而干扰DNA复制，达到杀菌作用。\u003c/div\u003e","pt":"① 喹诺酮类药物抗G - 菌的主要机制是抑制细菌DNA回旋酶，通过抑制其切口和封口功能而阻碍细菌DNA合成，最终导致细菌死亡。 ② 抗G + 菌的主要机制是抑制拓扑异构酶Ⅳ，影响子代DNA解环链而干扰DNA复制，达到杀菌作用。","ok":true,"kw":[]},{"id":"6bad8db74f","no":3,"q":"细菌对氟喹诺酮类药物的耐药机制有哪些？","a":"\u003cdiv class=\"q-ln\"\u003e① 抗菌靶点突变，细菌染色质上，喹诺酮类药物耐药决定区的基因突变，是耐药性产生的最主要机制。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 质粒介导的耐药性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 细菌细胞膜通透性改变。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 主动外排机制。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 细菌生物被膜形成。\u003c/div\u003e","pt":"① 抗菌靶点突变，细菌染色质上，喹诺酮类药物耐药决定区的基因突变，是耐药性产生的最主要机制。 ② 质粒介导的耐药性。 ③ 细菌细胞膜通透性改变。 ④ 主动外排机制。 ⑤ 细菌生物被膜形成。","ok":true,"kw":["耐药性","细胞膜"]},{"id":"94989c180b","no":4,"q":"磺胺类药物为何与甲氧苄啶合用？","a":"\u003cdiv class=\"q-ln\"\u003e磺胺类药物作用于二氢蝶酸合成酶，干扰合成叶酸的第一步，甲氧苄啶作用于叶酸合成代谢的第二步，选择性抑制二氢叶酸还原酶，两者合用可使细菌的叶酸代谢受到双重阻断，具有协同抗菌作用，其抗菌作用较单药增强，对已呈现耐药的菌株也相应减少。\u003c/div\u003e","pt":"磺胺类药物作用于二氢蝶酸合成酶，干扰合成叶酸的第一步，甲氧苄啶作用于叶酸合成代谢的第二步，选择性抑制二氢叶酸还原酶，两者合用可使细菌的叶酸代谢受到双重阻断，具有协同抗菌作用，其抗菌作用较单药增强，对已呈现耐药的菌株也相应减少。","ok":true,"kw":["选择性"]},{"id":"3788c2ea2f","no":5,"q":"简述磺胺类药物的不良反应及防治。","a":"\u003cdiv class=\"q-ln\"\u003e磺胺类药物不良反应较多，且随个体差异而不同。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 肾脏损害：提高尿液 pH，多饮水，可增加磺胺类药物尿中溶解度。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 急性溶血性贫血：可因过敏或先天性葡萄糖-6-磷酸脱氢酶缺乏而引起。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 造血系统毒性：长期用药可抑制骨髓造血功能，导致血小板减少、粒细胞减少，甚至再生障碍性贫血，虽然罕见，但一旦发生可能是致命的。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 过敏反应 ,"count":4,"done":0},{"label":"第六章","questions":[{"id":"9beda20408","no":1,"q":"有效径","a":"","pt":"","ok":false,"kw":[]},{"id":"ef8beedec4","no":2,"q":"休止角","a":"","pt":"","ok":false,"kw":[]},{"id":"421c65e864","no":3,"q":"临界相对湿度","a":"","pt":"","ok":false,"kw":[]},{"id":"d7e2e262a4","no":4,"q":"说明粒子径有哪些测定方法？其原理与测定范围有何不同？","a":"","pt":"","ok":false,"kw":[]},{"id":"d20061d140","no":5,"q":"简述影响粉体流动性的因素和改善方法。","a":"","pt":"","ok":false,"kw":[]},{"id":"e5851a1752","no":6,"q":"药物制剂的流变性质？","a":"","pt":"","ok":false,"kw":[]},{"id":"b842cabeec","no":7,"q":"简述牛顿流体、塑性流体、假塑性流体和胀性流体的特点。","a":"","pt":"","ok":false,"kw":[]},{"id":"fd037753e2","no":8,"q":"触变性","a":"","pt":"","ok":false,"kw":[]}],"count":8,"done":0},{"label":"第七章","questions":[{"id":"0165d34f1b","no":1,"q":"液体制剂","a":"\u003cdiv class=\"q-ln\"\u003e是指药物分散在适宜的分散介质中制成的可供内服或外用的液体形态的制剂。\u003c/div\u003e","pt":"是指药物分散在适宜的分散介质中制成的可供内服或外用的液体形态的制剂。","ok":true,"kw":["分散介质"]},{"id":"28638563c7","no":2,"q":"Suspensions","a":"\u003cdiv class=\"q-ln\"\u003e是指难溶性固体药物以微粒状态分散于分散介质中形成的非均相液体制剂，可供内服或外用。混悬剂中的药物微粒一般在0.5\\~10μm之间，小者可达0.1μm，大者可达50μm或更大。混悬剂属于热力学；动力学不稳定的粗分散体系。\u003c/div\u003e","pt":"是指难溶性固体药物以微粒状态分散于分散介质中形成的非均相液体制剂，可供内服或外用。混悬剂中的药物微粒一般在0.5\\~10μm之间，小者可达0.1μm，大者可达50μm或更大。混悬剂属于热力学；动力学不稳定的粗分散体系。","ok":true,"kw":["分散介质","液体制剂","动力学","非均相","混悬剂","均相"]},{"id":"9c3085334c","no":3,"q":"Emulsions","a":"\u003cdiv class=\"q-ln\"\u003e是指互不相溶的两种液体混合，其中一种液体以液滴状分散于另一种液体中形成的非均相液体分散体系。可供内服；外用或注射。\u003c/div\u003e","pt":"是指互不相溶的两种液体混合，其中一种液体以液滴状分散于另一种液体中形成的非均相液体分散体系。可供内服；外用或注射。","ok":true,"kw":["非均相","均相"]},{"id":"e980cc35f6","no":4,"q":"增加药物溶解度的方法有哪些？举例说明。","a":"","pt":"","ok":false,"kw":[]},{"id":"a60d17e19a","no":5,"q":"简述液体制剂的特点及分类。","a":"\u003cdiv class=\"q-ln\"\u003e特点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 优点: 1.药物分散度大；吸收快；发挥药效迅速；2.给药途径多；3.方便分剂量，服用方便，特别适于老人；婴幼儿等患者；4.能减少药物刺激性，如避免易溶性固体药物口服后由于局部浓度过高而引起的胃肠道刺激。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 缺点: 1.药物分散度大，容易发生化学降解，降低药效，甚至失效；2.液体制剂体积大，携带；运输；贮存等不方便。3.水性液体制剂易发生霉变，需要加入防腐剂；4
